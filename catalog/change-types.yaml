        - request-parameter-list-of-types-widened
        - request-parameter-property-became-not-enum
        - request-parameter-property-list-of-types-narrowed
        - request-parameter-property-list-of-types-widened
        - request-parameter-property-type-changed
        - request-parameter-property-type-generalized
        - request-parameter-property-type-specialized
        - request-parameter-type-changed
        - request-parameter-type-generalized

  - id: add-model
    category: model
    breaking: false
    description: "A new schema is added (oasdiff reports nothing until an operation uses it)."
    oasdiff:
      required: []
      allowed: []

  - id: remove-model
    category: model
    breaking: true
    description: "A schema is removed, so the SDK type disappears."
    oasdiff:
      required:
        - api-schema-removed
      allowed:
        - api-schema-removed

  - id: add-optional-property
    category: model
    breaking: false
    description: "A schema gains an optional property."
    oasdiff:
      required: []
      allowed:
        - new-optional-request-property
        - response-optional-property-added
