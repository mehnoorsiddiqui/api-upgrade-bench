  - id: release-status-change
    category: metadata
    breaking: false
    description: "A release status changes (x-release-status, e.g. BETA -> PUBLIC; deprecation of a schema). oasdiff does not see it."
    oasdiff:
      required: []
      allowed: []

  - id: docs-and-metadata
    category: metadata
    breaking: false
    description: "Descriptions, summaries, examples, tags and other x- extensions change. oasdiff does not see it."
    oasdiff:
      required: []
      allowed:
        - api-tag-added
        - api-tag-removed

