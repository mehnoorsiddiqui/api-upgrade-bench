[project]
name = "api-upgrade-bench"
version = "0.1.0"
description = "Build benchmark API versions (base spec + labelled overlays), publish the C# SDK and Context Plugin, and lock what each version contains."
requires-python = ">=3.11"
dependencies = [
    "jsonpath-ng>=1.6,<2",
    "jsonschema>=4.21,<5",
    "pyyaml>=6.0,<7",
]

[project.scripts]
bench = "bench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
