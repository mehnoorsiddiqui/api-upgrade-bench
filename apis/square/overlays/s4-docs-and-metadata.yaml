- target: $['components']['schemas']['CatalogIdMapping']
  update:
    description: 'A mapping between a temporary client-supplied ID and a permanent server-generated ID.


      When calling [UpsertCatalogObject](api-endpoint:Catalog-UpsertCatalogObject) or

      [BatchUpsertCatalogObjects](api-endpoint:Catalog-BatchUpsertCatalogObjects) to

      create a [CatalogObject](entity:CatalogObject) instance, you can supply

      a temporary ID for the to-be-created object, especially when the object is to be referenced

      elsewhere in the same request body. This temporary ID can be any string unique within

      the call, but must be prefixed by "#".


      After the request is submitted and the object created, a permanent server-generated ID is assigned

      to the new object. The permanent ID is unique across the Square catalog.'
- target: $['components']['schemas']['CatalogItem']
  update:
    description: A [CatalogObject](entity:CatalogObject) instance of the `ITEM` type, also referred to as an item, in the catalog.
- target: $['components']['schemas']['CatalogItem']['properties']['channels']
  update:
    description: 'A list of IDs representing channels, such as a Square Online site, where the item can be made visible or available.

      This field is read only and cannot be edited.'
- target: $['components']['schemas']['CatalogItemVariation']
  update:
    description: 'An item variation, representing a product for sale, in the Catalog object model. Each [item](entity:CatalogItem) must have at least one

      item variation and can have at most 250 item variations.


      An item variation can be sellable, stockable, or both if it has a unit of measure for its count for the sold number of the variation, the stocked

      number of the variation, or both. For example, when a variation representing wine is stocked and sold by the bottle, the variation is both

      stockable and sellable. But when a variation of the wine is sold by the glass, the sold units cannot be used as a measure of the stocked units. This by-the-glass

      variation is sellable, but not stockable. To accurately keep track of the wine''s inventory count at any time, the sellable count must be

      converted to stockable count. Typically, the seller defines this unit conversion. For example, 1 bottle equals 5 glasses. The Square API exposes

      the `stockable_conversion` property on the variation to specify the conversion. Thus, when two glasses of the wine are sold, the sellable count

      decreases by 2, and the stockable count automatically decreases by 0.4 bottle according to the conversion.'
- target: $['components']['schemas']['CatalogItemVariation']['properties']['stockable_conversion']
  update:
    description: 'The unit conversion rule, as prescribed by the [CatalogStockConversion](entity:CatalogStockConversion) type,

      that describes how this non-stockable (i.e., sellable/receivable) item variation is converted

      to/from the stockable item variation sharing the same parent item. With the stock conversion,

      you can accurately track inventory when an item variation is sold in one unit, but stocked in

      another unit.'
- target: $['components']['schemas']['CatalogObjectType']['x-enum-elements']
  remove: true
- target: $['components']['schemas']['CatalogObjectType']
  update:
    x-enum-elements:
    - name: ITEM
      description: 'The `CatalogObject` instance is of the [CatalogItem](entity:CatalogItem) type and represents an item. The item-specific data

        must be set on the `item_data` field.'
    - name: IMAGE
      description: 'The `CatalogObject` instance is of the [CatalogImage](entity:CatalogImage) type and represents an image. The image-specific data

        must be set on the `image_data` field.'
    - name: CATEGORY
      description: 'The `CatalogObject` instance is of the [CatalogCategory](entity:CatalogCategory) type and represents a category. The category-specific data

        must be set on the `category_data` field.'
    - name: ITEM_VARIATION
      description: 'The `CatalogObject` instance is of the  [CatalogItemVariation](entity:CatalogItemVariation) type and represents an item variation, also referred to as variation.

        The item variation-specific data must be set on the `item_variation_data` field.'
    - name: TAX
      description: 'The `CatalogObject` instance is of the [CatalogTax](entity:CatalogTax) type and represents a tax. The tax-specific data

        must be set on the `tax_data` field.'
    - name: DISCOUNT
      description: 'The `CatalogObject` instance is of the [CatalogDiscount](entity:CatalogDiscount) type and represents a discount. The discount-specific data

        must be set on the `discount_data` field.'
    - name: MODIFIER_LIST
      description: 'The `CatalogObject` instance is of the [CatalogModifierList](entity:CatalogModifierList) type and represents a modifier list.

        The modifier-list-specific data must be set on the `modifier_list_data` field.'
    - name: MODIFIER
      description: 'The `CatalogObject` instance is of the [CatalogModifier](entity:CatalogModifier) type and represents a modifier. The modifier-specific data

        must be set on the `modifier_data` field.'
    - name: PRICING_RULE
      description: 'The `CatalogObject` instance is of the [CatalogPricingRule](entity:CatalogPricingRule) type and represents a pricing rule. The pricing-rule-specific data

        must be set on the `pricing_rule_data` field.'
    - name: PRODUCT_SET
      description: 'The `CatalogObject` instance is of the [CatalogProductSet](entity:CatalogProductSet) type and represents a product set.

        The product-set-specific data will be stored in the `product_set_data` field.'
    - name: TIME_PERIOD
      description: 'The `CatalogObject` instance is of the [CatalogTimePeriod](entity:CatalogTimePeriod) type and represents a time period.

        The time-period-specific data must be set on the `time_period_data` field.'
    - name: MEASUREMENT_UNIT
      description: 'The `CatalogObject` instance is of the [CatalogMeasurementUnit](entity:CatalogMeasurementUnit) type and represents a measurement unit specifying the unit of

        measure and precision in which an item variation is sold. The measurement-unit-specific data must set on the `measurement_unit_data` field.'
    - name: SUBSCRIPTION_PLAN_VARIATION
      description: 'The `CatalogObject` instance is of the [CatalogSubscriptionPlan](entity:CatalogSubscriptionPlan) type and represents a subscription plan.

        The subscription-plan-specific data must be stored on the `subscription_plan_data` field.'
    - name: ITEM_OPTION
      description: 'The `CatalogObject` instance is of the [CatalogItemOption](entity:CatalogItemOption) type and represents a list of options (such as a color or size of a T-shirt)

        that can be assigned to item variations. The item-option-specific data must be on the `item_option_data` field.'
    - name: ITEM_OPTION_VAL
      description: 'The `CatalogObject` instance is of the [CatalogItemOptionValue](entity:CatalogItemOptionValue) type and represents a value associated with one or more item options.

        For example, an item option of "Size" may have item option values such as "Small" or "Medium".

        The item-option-value-specific data must be on the `item_option_value_data` field.'
    - name: CUSTOM_ATTRIBUTE_DEFINITION
      description: 'The `CatalogObject` instance is of the [CatalogCustomAttributeDefinition](entity:CatalogCustomAttributeDefinition) type and represents the definition of a custom attribute.

        The custom-attribute-definition-specific data must be set on the `custom_attribute_definition_data` field.'
    - name: QUICK_AMOUNTS_SETTINGS
      description: 'The `CatalogObject` instance is of the [CatalogQuickAmountsSettings](entity:CatalogQuickAmountsSettings) type and represents settings to configure preset charges for quick payments at each location.

        For example, a location may have a list of both AUTO and MANUAL quick amounts that are set to DISABLED.

        The quick-amounts-settings-specific data must be set on the `quick_amounts_settings_data` field.'
    - name: SUBSCRIPTION_PLAN
      description: 'The `CatalogObject` instance is of the [CatalogSubscriptionPlan](entity:CatalogSubscriptionPlan) type and represents a subscription plan.

        The subscription plan specific data must be stored on the `subscription_plan_data` field.'
    - name: AVAILABILITY_PERIOD
      description: 'The `CatalogObject` instance is of the [CatalogAvailabilityPeriod](entity:CatalogAvailabilityPeriod) type and represents an availability period.

        The availability period specific data must be stored on the `availability_period_data` field.'
- target: $['components']['schemas']['CatalogQuery']
  update:
    description: 'A query composed of one or more different types of filters to narrow the scope of targeted objects when calling the `SearchCatalogObjects` endpoint.


      Although a query can have multiple filters, only certain query types can be combined per call to [SearchCatalogObjects](api-endpoint:Catalog-SearchCatalogObjects).

      Any combination of the following types may be used together:

      - [exact_query](entity:CatalogQueryExact)

      - [prefix_query](entity:CatalogQueryPrefix)

      - [range_query](entity:CatalogQueryRange)

      - [sorted_attribute_query](entity:CatalogQuerySortedAttribute)

      - [text_query](entity:CatalogQueryText)


      All other query types cannot be combined with any others.


      When a query filter is based on an attribute, the attribute must be searchable.

      Searchable attributes are listed as follows, along their parent types that can be searched for with applicable query filters.


      Searchable attribute and objects queryable by searchable attributes:

      - `name`:  `CatalogItem`, `CatalogItemVariation`, `CatalogCategory`, `CatalogTax`, `CatalogDiscount`, `CatalogModifier`, `CatalogModifierList`, `CatalogItemOption`, `CatalogItemOptionValue`

      - `description`: `CatalogItem`, `CatalogItemOptionValue`

      - `abbreviation`: `CatalogItem`

      - `upc`: `CatalogItemVariation`

      - `sku`: `CatalogItemVariation`

      - `caption`: `CatalogImage`

      - `display_name`: `CatalogItemOption`


      For example, to search for [CatalogItem](entity:CatalogItem) objects by searchable attributes, you can use

      the `"name"`, `"description"`, or `"abbreviation"` attribute in an applicable query filter.'
