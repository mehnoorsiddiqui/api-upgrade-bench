- target: $['paths']['/v2/bank-accounts']['get']
  update:
    description: Returns a list of [BankAccount](entity:BankAccount) objects linked to a Square account.
- target: $['paths']['/v2/bank-accounts/by-v1-id/{v1_bank_account_id}']['get']
  update:
    description: Returns details of a [BankAccount](entity:BankAccount) identified by V1 bank account ID.
- target: $['paths']['/v2/bank-accounts/{bank_account_id}']['get']
  update:
    description: 'Returns details of a [BankAccount](entity:BankAccount)

      linked to a Square account.'
- target: $['paths']['/v2/cash-drawers/shifts/{shift_id}']['get']
  update:
    description: 'Provides the summary details for a single cash drawer shift. See

      [ListCashDrawerShiftEvents](api-endpoint:CashDrawers-ListCashDrawerShiftEvents) for a list of cash drawer shift events.'
- target: $['paths']['/v2/catalog/batch-delete']['post']
  update:
    description: 'Deletes a set of [CatalogItem](entity:CatalogItem)s based on the

      provided list of target IDs and returns a set of successfully deleted IDs in

      the response. Deletion is a cascading event such that all children of the

      targeted object are also deleted. For example, deleting a CatalogItem will

      also delete all of its [CatalogItemVariation](entity:CatalogItemVariation)

      children.


      `BatchDeleteCatalogObjects` succeeds even if only a portion of the targeted

      IDs can be deleted. The response will only include IDs that were

      actually deleted.


      To ensure consistency, only one delete request is processed at a time per seller account.

      While one (batch or non-batch) delete request is being processed, other (batched and non-batched)

      delete requests are rejected with the `429` error code.'
- target: $['paths']['/v2/catalog/batch-retrieve']['post']
  update:
    description: 'Returns a set of objects based on the provided ID.

      Each [CatalogItem](entity:CatalogItem) returned in the set includes all of its

      child information including: all of its

      [CatalogItemVariation](entity:CatalogItemVariation) objects, references to

      its [CatalogModifierList](entity:CatalogModifierList) objects, and the ids of

      any [CatalogTax](entity:CatalogTax) objects that apply to it.'
- target: $['paths']['/v2/catalog/images']['post']
  update:
    description: 'Uploads an image file to be represented by a [CatalogImage](entity:CatalogImage) object that can be linked to an existing

      [CatalogObject](entity:CatalogObject) instance. The resulting `CatalogImage` is unattached to any `CatalogObject` if the `object_id`

      is not specified.


      This `CreateCatalogImage` endpoint accepts HTTP multipart/form-data requests with a JSON part and an image file part in

      JPEG, PJPEG, PNG, or GIF format. The maximum file size is 15MB.'
- target: $['paths']['/v2/catalog/images/{image_id}']['put']
  update:
    description: 'Uploads a new image file to replace the existing one in the specified [CatalogImage](entity:CatalogImage) object.


      This `UpdateCatalogImage` endpoint accepts HTTP multipart/form-data requests with a JSON part and an image file part in

      JPEG, PJPEG, PNG, or GIF format. The maximum file size is 15MB.'
- target: $['paths']['/v2/catalog/list']['get']
  update:
    description: 'Returns a list of all [CatalogObject](entity:CatalogObject)s of the specified types in the catalog.


      The `types` parameter is specified as a comma-separated list of the [CatalogObjectType](entity:CatalogObjectType) values,

      for example, "`ITEM`, `ITEM_VARIATION`, `MODIFIER`, `MODIFIER_LIST`, `CATEGORY`, `DISCOUNT`, `TAX`, `IMAGE`".


      __Important:__ ListCatalog does not return deleted catalog items. To retrieve

      deleted catalog items, use [SearchCatalogObjects](api-endpoint:Catalog-SearchCatalogObjects)

      and set the `include_deleted_objects` attribute value to `true`.'
- target: $['paths']['/v2/catalog/list']['get']['parameters'][?(@.name == 'catalog_version' && @.in == 'query')]
  update:
    description: 'The specific version of the catalog objects to be included in the response.

      This allows you to retrieve historical versions of objects. The specified version value is matched against

      the [CatalogObject](entity:CatalogObject)s'' `version` attribute.  If not included, results will be from the

      current version of the catalog.'
- target: $['paths']['/v2/catalog/object']['post']
  update:
    description: 'Creates a new or updates the specified [CatalogObject](entity:CatalogObject).


      To ensure consistency, only one update request is processed at a time per seller account.

      While one (batch or non-batch) update request is being processed, other (batched and non-batched)

      update requests are rejected with the `429` error code.'
- target: $['paths']['/v2/catalog/object/{object_id}']['delete']
  update:
    description: 'Deletes a single [CatalogObject](entity:CatalogObject) based on the

      provided ID and returns the set of successfully deleted IDs in the response.

      Deletion is a cascading event such that all children of the targeted object

      are also deleted. For example, deleting a [CatalogItem](entity:CatalogItem)

      will also delete all of its

      [CatalogItemVariation](entity:CatalogItemVariation) children.


      To ensure consistency, only one delete request is processed at a time per seller account.

      While one (batch or non-batch) delete request is being processed, other (batched and non-batched)

      delete requests are rejected with the `429` error code.'
- target: $['paths']['/v2/catalog/object/{object_id}']['get']
  update:
    description: 'Returns a single [CatalogItem](entity:CatalogItem) as a

      [CatalogObject](entity:CatalogObject) based on the provided ID. The returned

      object includes all of the relevant [CatalogItem](entity:CatalogItem)

      information including: [CatalogItemVariation](entity:CatalogItemVariation)

      children, references to its

      [CatalogModifierList](entity:CatalogModifierList) objects, and the ids of

      any [CatalogTax](entity:CatalogTax) objects that apply to it.'
- target: $['paths']['/v2/catalog/object/{object_id}']['get']['parameters'][?(@.name == 'catalog_version' && @.in == 'query')]
  update:
    description: 'Requests objects as of a specific version of the catalog. This allows you to retrieve historical

      versions of objects. The value to retrieve a specific version of an object can be found

      in the version field of [CatalogObject](entity:CatalogObject)s. If not included, results will

      be from the current version of the catalog.'
- target: $['paths']['/v2/catalog/search']['post']
  update:
    description: 'Searches for [CatalogObject](entity:CatalogObject) of any type by matching supported search attribute values,

      excluding custom attribute values on items or item variations, against one or more of the specified query filters.


      This (`SearchCatalogObjects`) endpoint differs from the [SearchCatalogItems](api-endpoint:Catalog-SearchCatalogItems)

      endpoint in the following aspects:


      - `SearchCatalogItems` can only search for items or item variations, whereas `SearchCatalogObjects` can search for any type of catalog objects.

      - `SearchCatalogItems` supports the custom attribute query filters to return items or item variations that contain custom attribute values, where `SearchCatalogObjects` does not.

      - `SearchCatalogItems` does not support the `include_deleted_objects` filter to search for deleted items or item variations, whereas `SearchCatalogObjects` does.

      - The both endpoints have different call conventions, including the query filter formats.'
- target: $['paths']['/v2/catalog/search-catalog-items']['post']
  update:
    description: 'Searches for catalog items or item variations by matching supported search attribute values, including

      custom attribute values, against one or more of the specified query filters.


      This (`SearchCatalogItems`) endpoint differs from the [SearchCatalogObjects](api-endpoint:Catalog-SearchCatalogObjects)

      endpoint in the following aspects:


      - `SearchCatalogItems` can only search for items or item variations, whereas `SearchCatalogObjects` can search for any type of catalog objects.

      - `SearchCatalogItems` supports the custom attribute query filters to return items or item variations that contain custom attribute values, where `SearchCatalogObjects` does not.

      - `SearchCatalogItems` does not support the `include_deleted_objects` filter to search for deleted items or item variations, whereas `SearchCatalogObjects` does.

      - The both endpoints use different call conventions, including the query filter formats.'
- target: $['paths']['/v2/catalog/update-item-modifier-lists']['post']
  update:
    description: 'Updates the [CatalogModifierList](entity:CatalogModifierList) objects

      that apply to the targeted [CatalogItem](entity:CatalogItem) without having

      to perform an upsert on the entire item.'
- target: $['paths']['/v2/catalog/update-item-taxes']['post']
  update:
    description: 'Updates the [CatalogTax](entity:CatalogTax) objects that apply to the

      targeted [CatalogItem](entity:CatalogItem) without having to perform an

      upsert on the entire item.'
- target: $['paths']['/v2/customers/bulk-create']['post']
  update:
    description: 'Creates multiple [customer profiles](entity:Customer) for a business.


      This endpoint takes a map of individual create requests and returns a map of responses.


      You must provide at least one of the following values in each create request:


      - `given_name`

      - `family_name`

      - `company_name`

      - `email_address`

      - `phone_number`'
- target: $['paths']['/v2/customers/bulk-update']['post']
  update:
    description: 'Updates multiple customer profiles.


      This endpoint takes a map of individual update requests and returns a map of responses.'
- target: $['paths']['/v2/customers/custom-attribute-definitions']['get']
  update:
    description: 'Lists the customer-related [custom attribute definitions](entity:CustomAttributeDefinition) that belong to a Square seller account.


      When all response pages are retrieved, the results include all custom attribute definitions

      that are visible to the requesting application, including those that are created by other

      applications and set to `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`. Note that

      seller-defined custom attributes (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/customers/custom-attribute-definitions']['post']
  update:
    description: 'Creates a customer-related [custom attribute definition](entity:CustomAttributeDefinition) for a Square seller account.

      Use this endpoint to define a custom attribute that can be associated with customer profiles.


      A custom attribute definition specifies the `key`, `visibility`, `schema`, and other properties

      for a custom attribute. After the definition is created, you can call

      [UpsertCustomerCustomAttribute](api-endpoint:CustomerCustomAttributes-UpsertCustomerCustomAttribute) or

      [BulkUpsertCustomerCustomAttributes](api-endpoint:CustomerCustomAttributes-BulkUpsertCustomerCustomAttributes)

      to set the custom attribute for customer profiles in the seller''s Customer Directory.


      Sellers can view all custom attributes in exported customer data, including those set to

      `VISIBILITY_HIDDEN`.'
- target: $['paths']['/v2/customers/custom-attribute-definitions/{key}']['delete']
  update:
    description: 'Deletes a customer-related [custom attribute definition](entity:CustomAttributeDefinition) from a Square seller account.


      Deleting a custom attribute definition also deletes the corresponding custom attribute from

      all customer profiles in the seller''s Customer Directory.


      Only the definition owner can delete a custom attribute definition.'
- target: $['paths']['/v2/customers/custom-attribute-definitions/{key}']['get']
  update:
    description: 'Retrieves a customer-related [custom attribute definition](entity:CustomAttributeDefinition) from a Square seller account.


      To retrieve a custom attribute definition created by another application, the `visibility`

      setting must be `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/customers/custom-attribute-definitions/{key}']['put']
  update:
    description: 'Updates a customer-related [custom attribute definition](entity:CustomAttributeDefinition) for a Square seller account.


      Use this endpoint to update the following fields: `name`, `description`, `visibility`, or the

      `schema` for a `Selection` data type.


      Only the definition owner can update a custom attribute definition. Note that sellers can view

      all custom attributes in exported customer data, including those set to `VISIBILITY_HIDDEN`.'
- target: $['paths']['/v2/customers/custom-attributes/bulk-upsert']['post']
  update:
    description: 'Creates or updates [custom attributes](entity:CustomAttribute) for customer profiles as a bulk operation.


      Use this endpoint to set the value of one or more custom attributes for one or more customer profiles.

      A custom attribute is based on a custom attribute definition in a Square seller account, which is

      created using the [CreateCustomerCustomAttributeDefinition](api-endpoint:CustomerCustomAttributes-CreateCustomerCustomAttributeDefinition) endpoint.


      This `BulkUpsertCustomerCustomAttributes` endpoint accepts a map of 1 to 25 individual upsert

      requests and returns a map of individual upsert responses. Each upsert request has a unique ID

      and provides a customer ID and custom attribute. Each upsert response is returned with the ID

      of the corresponding request.


      To create or update a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/customers/{customer_id}']['delete']
  update:
    description: 'Deletes a customer profile from a business.


      To delete a customer profile that was created by merging existing profiles, you must use the ID of the newly created profile.'
- target: $['paths']['/v2/customers/{customer_id}']['put']
  update:
    description: 'Updates a customer profile. This endpoint supports sparse updates, so only new or changed fields are required in the request.

      To add or update a field, specify the new value. To remove a field, specify `null`.


      To update a customer profile that was created by merging existing profiles, you must use the ID of the newly created profile.'
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes']['get']
  update:
    description: 'Lists the [custom attributes](entity:CustomAttribute) associated with a customer profile.


      You can use the `with_definitions` query parameter to also retrieve custom attribute definitions

      in the same call.


      When all response pages are retrieved, the results include all custom attributes that are

      visible to the requesting application, including those that are owned by other applications

      and set to `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes/{key}']['delete']
  update:
    description: 'Deletes a [custom attribute](entity:CustomAttribute) associated with a customer profile.


      To delete a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes/{key}']['get']
  update:
    description: 'Retrieves a [custom attribute](entity:CustomAttribute) associated with a customer profile.


      You can use the `with_definition` query parameter to also retrieve the custom attribute definition

      in the same call.


      To retrieve a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes/{key}']['post']
  update:
    description: 'Creates or updates a [custom attribute](entity:CustomAttribute) for a customer profile.


      Use this endpoint to set the value of a custom attribute for a specified customer profile.

      A custom attribute is based on a custom attribute definition in a Square seller account, which

      is created using the [CreateCustomerCustomAttributeDefinition](api-endpoint:CustomerCustomAttributes-CreateCustomerCustomAttributeDefinition) endpoint.


      To create or update a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/disputes/{dispute_id}/submit-evidence']['post']
  update:
    description: 'Submits evidence to the cardholder''s bank.


      The evidence submitted by this endpoint includes evidence uploaded

      using the [CreateDisputeEvidenceFile](api-endpoint:Disputes-CreateDisputeEvidenceFile) and

      [CreateDisputeEvidenceText](api-endpoint:Disputes-CreateDisputeEvidenceText) endpoints and

      evidence automatically provided by Square, when available. Evidence cannot be removed from

      a dispute after submission.'
- target: $['paths']['/v2/gift-cards']['post']
  update:
    description: 'Creates a digital gift card or registers a physical (plastic) gift card. The resulting gift card

      has a `PENDING` state. To activate a gift card so that it can be redeemed for purchases, call

      [CreateGiftCardActivity](api-endpoint:GiftCardActivities-CreateGiftCardActivity) and create an `ACTIVATE`

      activity with the initial balance. Alternatively, you can use [RefundPayment](api-endpoint:Refunds-RefundPayment)

      to refund a payment to the new gift card.'
- target: $['paths']['/v2/gift-cards/activities']['post']
  update:
    description: 'Creates a gift card activity to manage the balance or state of a [gift card](entity:GiftCard).

      For example, create an `ACTIVATE` activity to activate a gift card with an initial balance before first use.'
- target: $['paths']['/v2/inventory/adjustments/{adjustment_id}']['get']
  update:
    description: 'Returns the [InventoryAdjustment](entity:InventoryAdjustment) object

      with the provided `adjustment_id`.'
- target: $['paths']['/v2/inventory/counts/batch-retrieve']['post']
  update:
    description: 'Returns current counts for the provided

      [CatalogObject](entity:CatalogObject)s at the requested

      [Location](entity:Location)s.


      Results are paginated and sorted in descending order according to their

      `calculated_at` timestamp (newest first).


      When `updated_after` is specified, only counts that have changed since that

      time (based on the server timestamp for the most recent change) are

      returned. This allows clients to perform a "sync" operation, for example

      in response to receiving a Webhook notification.'
- target: $['paths']['/v2/inventory/physical-counts/{physical_count_id}']['get']
  update:
    description: 'Returns the [InventoryPhysicalCount](entity:InventoryPhysicalCount)

      object with the provided `physical_count_id`.'
- target: $['paths']['/v2/inventory/transfers/{transfer_id}']['get']
  update:
    description: 'Returns the [InventoryTransfer](entity:InventoryTransfer) object

      with the provided `transfer_id`.'
- target: $['paths']['/v2/inventory/{catalog_object_id}']['get']
  update:
    description: 'Retrieves the current calculated stock count for a given

      [CatalogObject](entity:CatalogObject) at a given set of

      [Location](entity:Location)s. Responses are paginated and unsorted.

      For more sophisticated queries, use a batch endpoint.'
- target: $['paths']['/v2/invoices']['post']
  update:
    description: "Creates a draft [invoice](entity:Invoice) \nfor an order created using the Orders API.\n\nA draft invoice remains in your account and no action is taken. \nYou must publish the invoice before Square can process it (send it to the customer's email address or charge the customer’s card on file)."
- target: $['paths']['/v2/locations/custom-attribute-definitions']['get']
  update:
    description: 'Lists the location-related [custom attribute definitions](entity:CustomAttributeDefinition) that belong to a Square seller account.

      When all response pages are retrieved, the results include all custom attribute definitions

      that are visible to the requesting application, including those that are created by other

      applications and set to `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/locations/custom-attribute-definitions']['post']
  update:
    description: 'Creates a location-related [custom attribute definition](entity:CustomAttributeDefinition) for a Square seller account.

      Use this endpoint to define a custom attribute that can be associated with locations.

      A custom attribute definition specifies the `key`, `visibility`, `schema`, and other properties

      for a custom attribute. After the definition is created, you can call

      [UpsertLocationCustomAttribute](api-endpoint:LocationCustomAttributes-UpsertLocationCustomAttribute) or

      [BulkUpsertLocationCustomAttributes](api-endpoint:LocationCustomAttributes-BulkUpsertLocationCustomAttributes)

      to set the custom attribute for locations.'
- target: $['paths']['/v2/locations/custom-attribute-definitions/{key}']['delete']
  update:
    description: 'Deletes a location-related [custom attribute definition](entity:CustomAttributeDefinition) from a Square seller account.

      Deleting a custom attribute definition also deletes the corresponding custom attribute from

      all locations.

      Only the definition owner can delete a custom attribute definition.'
- target: $['paths']['/v2/locations/custom-attribute-definitions/{key}']['get']
  update:
    description: 'Retrieves a location-related [custom attribute definition](entity:CustomAttributeDefinition) from a Square seller account.

      To retrieve a custom attribute definition created by another application, the `visibility`

      setting must be `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/locations/custom-attribute-definitions/{key}']['put']
  update:
    description: 'Updates a location-related [custom attribute definition](entity:CustomAttributeDefinition) for a Square seller account.

      Use this endpoint to update the following fields: `name`, `description`, `visibility`, or the

      `schema` for a `Selection` data type.

      Only the definition owner can update a custom attribute definition.'
- target: $['paths']['/v2/locations/custom-attributes/bulk-delete']['post']
  update:
    description: 'Deletes [custom attributes](entity:CustomAttribute) for locations as a bulk operation.

      To delete a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/locations/custom-attributes/bulk-upsert']['post']
  update:
    description: 'Creates or updates [custom attributes](entity:CustomAttribute) for locations as a bulk operation.

      Use this endpoint to set the value of one or more custom attributes for one or more locations.

      A custom attribute is based on a custom attribute definition in a Square seller account, which is

      created using the [CreateLocationCustomAttributeDefinition](api-endpoint:LocationCustomAttributes-CreateLocationCustomAttributeDefinition) endpoint.

      This `BulkUpsertLocationCustomAttributes` endpoint accepts a map of 1 to 25 individual upsert

      requests and returns a map of individual upsert responses. Each upsert request has a unique ID

      and provides a location ID and custom attribute. Each upsert response is returned with the ID

      of the corresponding request.

      To create or update a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/locations/{location_id}/custom-attributes']['get']
  update:
    description: 'Lists the [custom attributes](entity:CustomAttribute) associated with a location.

      You can use the `with_definitions` query parameter to also retrieve custom attribute definitions

      in the same call.

      When all response pages are retrieved, the results include all custom attributes that are

      visible to the requesting application, including those that are owned by other applications

      and set to `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/locations/{location_id}/custom-attributes/{key}']['delete']
  update:
    description: 'Deletes a [custom attribute](entity:CustomAttribute) associated with a location.

      To delete a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/locations/{location_id}/custom-attributes/{key}']['get']
  update:
    description: 'Retrieves a [custom attribute](entity:CustomAttribute) associated with a location.

      You can use the `with_definition` query parameter to also retrieve the custom attribute definition

      in the same call.

      To retrieve a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/locations/{location_id}/custom-attributes/{key}']['post']
  update:
    description: 'Creates or updates a [custom attribute](entity:CustomAttribute) for a location.

      Use this endpoint to set the value of a custom attribute for a specified location.

      A custom attribute is based on a custom attribute definition in a Square seller account, which

      is created using the [CreateLocationCustomAttributeDefinition](api-endpoint:LocationCustomAttributes-CreateLocationCustomAttributeDefinition) endpoint.

      To create or update a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/loyalty/accounts/{account_id}/accumulate']['post']
  update:
    description: 'Adds points earned from a purchase to a [loyalty account](entity:LoyaltyAccount).


      - If you are using the Orders API to manage orders, provide the `order_id`. Square reads the order

      to compute the points earned from both the base loyalty program and an associated

      [loyalty promotion](entity:LoyaltyPromotion). For purchases that qualify for multiple accrual

      rules, Square computes points based on the accrual rule that grants the most points.

      For purchases that qualify for multiple promotions, Square computes points based on the most

      recently created promotion. A purchase must first qualify for program points to be eligible for promotion points.


      - If you are not using the Orders API to manage orders, provide `points` with the number of points to add.

      You must first perform a client-side computation of the points earned from the loyalty program and

      loyalty promotion. For spend-based and visit-based programs, you can call [CalculateLoyaltyPoints](api-endpoint:Loyalty-CalculateLoyaltyPoints)

      to compute the points earned from the base loyalty program. For information about computing points earned from a loyalty promotion, see

      [Calculating promotion points](https://developer.squareup.com/docs/loyalty-api/loyalty-promotions#calculate-promotion-points).'
- target: $['paths']['/v2/loyalty/accounts/{account_id}/adjust']['post']
  update:
    description: 'Adds points to or subtracts points from a buyer''s account.


      Use this endpoint only when you need to manually adjust points. Otherwise, in your application flow, you call

      [AccumulateLoyaltyPoints](api-endpoint:Loyalty-AccumulateLoyaltyPoints)

      to add points when a buyer pays for the purchase.'
- target: $['paths']['/v2/loyalty/programs/{program_id}/calculate']['post']
  update:
    description: 'Calculates the number of points a buyer can earn from a purchase. Applications might call this endpoint

      to display the points to the buyer.


      - If you are using the Orders API to manage orders, provide the `order_id` and (optional) `loyalty_account_id`.

      Square reads the order to compute the points earned from the base loyalty program and an associated

      [loyalty promotion](entity:LoyaltyPromotion).


      - If you are not using the Orders API to manage orders, provide `transaction_amount_money` with the

      purchase amount. Square uses this amount to calculate the points earned from the base loyalty program,

      but not points earned from a loyalty promotion. For spend-based and visit-based programs, the `tax_mode`

      setting of the accrual rule indicates how taxes should be treated for loyalty points accrual.

      If the purchase qualifies for program points, call

      [ListLoyaltyPromotions](api-endpoint:Loyalty-ListLoyaltyPromotions) and perform a client-side computation

      to calculate whether the purchase also qualifies for promotion points. For more information, see

      [Calculating promotion points](https://developer.squareup.com/docs/loyalty-api/loyalty-promotions#calculate-promotion-points).'
- target: $['paths']['/v2/loyalty/programs/{program_id}/promotions']['get']
  update:
    description: 'Lists the loyalty promotions associated with a [loyalty program](entity:LoyaltyProgram).

      Results are sorted by the `created_at` date in descending order (newest to oldest).'
- target: $['paths']['/v2/loyalty/programs/{program_id}/promotions']['post']
  update:
    description: 'Creates a loyalty promotion for a [loyalty program](entity:LoyaltyProgram). A loyalty promotion

      enables buyers to earn points in addition to those earned from the base loyalty program.


      This endpoint sets the loyalty promotion to the `ACTIVE` or `SCHEDULED` status, depending on the

      `available_time` setting. A loyalty program can have a maximum of 10 loyalty promotions with an

      `ACTIVE` or `SCHEDULED` status.'
- target: $['paths']['/v2/loyalty/rewards/search']['post']
  update:
    description: 'Searches for loyalty rewards. This endpoint accepts a request with no query filters and returns results for all loyalty accounts.

      If you include a `query` object, `loyalty_account_id` is required and `status` is  optional.


      If you know a reward ID, use the

      [RetrieveLoyaltyReward](api-endpoint:Loyalty-RetrieveLoyaltyReward) endpoint.


      Search results are sorted by `updated_at` in descending order.'
- target: $['paths']['/v2/loyalty/rewards/{reward_id}']['delete']
  update:
    description: 'Deletes a loyalty reward by doing the following:


      - Returns the loyalty points back to the loyalty account.

      - If an order ID was specified when the reward was created

      (see [CreateLoyaltyReward](api-endpoint:Loyalty-CreateLoyaltyReward)),

      it updates the order by removing the reward and related

      discounts.


      You cannot delete a reward that has reached the terminal state (REDEEMED).'
- target: $['paths']['/v2/merchants']['get']
  update:
    description: 'Provides details about the merchant associated with a given access token.


      The access token used to connect your application to a Square seller is associated

      with a single merchant. That means that `ListMerchants` returns a list

      with a single `Merchant` object. You can specify your personal access token

      to get your own merchant information or specify an OAuth token to get the

      information for the merchant that granted your application access.


      If you know the merchant ID, you can also use the [RetrieveMerchant](api-endpoint:Merchants-RetrieveMerchant)

      endpoint to retrieve the merchant information.'
- target: $['paths']['/v2/merchants/custom-attribute-definitions']['get']
  update:
    description: 'Lists the merchant-related [custom attribute definitions](entity:CustomAttributeDefinition) that belong to a Square seller account.

      When all response pages are retrieved, the results include all custom attribute definitions

      that are visible to the requesting application, including those that are created by other

      applications and set to `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/merchants/custom-attribute-definitions']['post']
  update:
    description: 'Creates a merchant-related [custom attribute definition](entity:CustomAttributeDefinition) for a Square seller account.

      Use this endpoint to define a custom attribute that can be associated with a merchant connecting to your application.

      A custom attribute definition specifies the `key`, `visibility`, `schema`, and other properties

      for a custom attribute. After the definition is created, you can call

      [UpsertMerchantCustomAttribute](api-endpoint:MerchantCustomAttributes-UpsertMerchantCustomAttribute) or

      [BulkUpsertMerchantCustomAttributes](api-endpoint:MerchantCustomAttributes-BulkUpsertMerchantCustomAttributes)

      to set the custom attribute for a merchant.'
- target: $['paths']['/v2/merchants/custom-attribute-definitions/{key}']['delete']
  update:
    description: 'Deletes a merchant-related [custom attribute definition](entity:CustomAttributeDefinition) from a Square seller account.

      Deleting a custom attribute definition also deletes the corresponding custom attribute from

      the merchant.

      Only the definition owner can delete a custom attribute definition.'
- target: $['paths']['/v2/merchants/custom-attribute-definitions/{key}']['get']
  update:
    description: 'Retrieves a merchant-related [custom attribute definition](entity:CustomAttributeDefinition) from a Square seller account.

      To retrieve a custom attribute definition created by another application, the `visibility`

      setting must be `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/merchants/custom-attribute-definitions/{key}']['put']
  update:
    description: 'Updates a merchant-related [custom attribute definition](entity:CustomAttributeDefinition) for a Square seller account.

      Use this endpoint to update the following fields: `name`, `description`, `visibility`, or the

      `schema` for a `Selection` data type.

      Only the definition owner can update a custom attribute definition.'
- target: $['paths']['/v2/merchants/custom-attributes/bulk-delete']['post']
  update:
    description: 'Deletes [custom attributes](entity:CustomAttribute) for a merchant as a bulk operation.

      To delete a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/merchants/custom-attributes/bulk-upsert']['post']
  update:
    description: 'Creates or updates [custom attributes](entity:CustomAttribute) for a merchant as a bulk operation.

      Use this endpoint to set the value of one or more custom attributes for a merchant.

      A custom attribute is based on a custom attribute definition in a Square seller account, which is

      created using the [CreateMerchantCustomAttributeDefinition](api-endpoint:MerchantCustomAttributes-CreateMerchantCustomAttributeDefinition) endpoint.

      This `BulkUpsertMerchantCustomAttributes` endpoint accepts a map of 1 to 25 individual upsert

      requests and returns a map of individual upsert responses. Each upsert request has a unique ID

      and provides a merchant ID and custom attribute. Each upsert response is returned with the ID

      of the corresponding request.

      To create or update a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/merchants/{merchant_id}/custom-attributes']['get']
  update:
    description: 'Lists the [custom attributes](entity:CustomAttribute) associated with a merchant.

      You can use the `with_definitions` query parameter to also retrieve custom attribute definitions

      in the same call.

      When all response pages are retrieved, the results include all custom attributes that are

      visible to the requesting application, including those that are owned by other applications

      and set to `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/merchants/{merchant_id}/custom-attributes/{key}']['delete']
  update:
    description: 'Deletes a [custom attribute](entity:CustomAttribute) associated with a merchant.

      To delete a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/merchants/{merchant_id}/custom-attributes/{key}']['get']
  update:
    description: 'Retrieves a [custom attribute](entity:CustomAttribute) associated with a merchant.

      You can use the `with_definition` query parameter to also retrieve the custom attribute definition

      in the same call.

      To retrieve a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/merchants/{merchant_id}/custom-attributes/{key}']['post']
  update:
    description: 'Creates or updates a [custom attribute](entity:CustomAttribute) for a merchant.

      Use this endpoint to set the value of a custom attribute for a specified merchant.

      A custom attribute is based on a custom attribute definition in a Square seller account, which

      is created using the [CreateMerchantCustomAttributeDefinition](api-endpoint:MerchantCustomAttributes-CreateMerchantCustomAttributeDefinition) endpoint.

      To create or update a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders']['post']
  update:
    description: 'Creates a new [order](entity:Order) that can include information about products for

      purchase and settings to apply to the purchase.


      To pay for a created order, see

      [Pay for Orders](https://developer.squareup.com/docs/orders-api/pay-for-orders).


      You can modify open orders using the [UpdateOrder](api-endpoint:Orders-UpdateOrder) endpoint.'
- target: $['paths']['/v2/orders/batch-retrieve']['post']
  update:
    description: 'Retrieves a set of [orders](entity:Order) by their IDs.


      If a given order ID does not exist, the ID is ignored instead of generating an error.'
- target: $['paths']['/v2/orders/custom-attribute-definitions']['get']
  update:
    description: 'Lists the order-related [custom attribute definitions](entity:CustomAttributeDefinition) that belong to a Square seller account.


      When all response pages are retrieved, the results include all custom attribute definitions

      that are visible to the requesting application, including those that are created by other

      applications and set to `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`. Note that

      seller-defined custom attributes (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders/custom-attribute-definitions/{key}']['delete']
  update:
    description: 'Deletes an order-related [custom attribute definition](entity:CustomAttributeDefinition) from a Square seller account.


      Only the definition owner can delete a custom attribute definition.'
- target: $['paths']['/v2/orders/custom-attribute-definitions/{key}']['get']
  update:
    description: 'Retrieves an order-related [custom attribute definition](entity:CustomAttributeDefinition) from a Square seller account.


      To retrieve a custom attribute definition created by another application, the `visibility`

      setting must be `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders/custom-attributes/bulk-delete']['post']
  update:
    description: 'Deletes order [custom attributes](entity:CustomAttribute) as a bulk operation.


      Use this endpoint to delete one or more custom attributes from one or more orders.

      A custom attribute is based on a custom attribute definition in a Square seller account.  (To create a

      custom attribute definition, use the [CreateOrderCustomAttributeDefinition](api-endpoint:OrderCustomAttributes-CreateOrderCustomAttributeDefinition) endpoint.)


      This `BulkDeleteOrderCustomAttributes` endpoint accepts a map of 1 to 25 individual delete

      requests and returns a map of individual delete responses. Each delete request has a unique ID

      and provides an order ID and custom attribute. Each delete response is returned with the ID

      of the corresponding request.


      To delete a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders/custom-attributes/bulk-upsert']['post']
  update:
    description: 'Creates or updates order [custom attributes](entity:CustomAttribute) as a bulk operation.


      Use this endpoint to delete one or more custom attributes from one or more orders.

      A custom attribute is based on a custom attribute definition in a Square seller account.  (To create a

      custom attribute definition, use the [CreateOrderCustomAttributeDefinition](api-endpoint:OrderCustomAttributes-CreateOrderCustomAttributeDefinition) endpoint.)


      This `BulkUpsertOrderCustomAttributes` endpoint accepts a map of 1 to 25 individual upsert

      requests and returns a map of individual upsert responses. Each upsert request has a unique ID

      and provides an order ID and custom attribute. Each upsert response is returned with the ID

      of the corresponding request.


      To create or update a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders/search']['post']
  update:
    description: "Search all orders for one or more locations. Orders include all sales,\nreturns, and exchanges regardless of how or when they entered the Square\necosystem (such as Point of Sale, Invoices, and Connect APIs).\n\n`SearchOrders` requests need to specify which locations to search and define a\n[SearchOrdersQuery](entity:SearchOrdersQuery) object that controls\nhow to sort or filter the results. Your `SearchOrdersQuery` can:\n\n  Set filter criteria.\n  Set the sort order.\n  Determine whether to return results as complete `Order` objects or as\n[OrderEntry](entity:OrderEntry) objects.\n\nNote that details for orders processed with Square Point of Sale while in\noffline mode might not be transmitted to Square for up to 72 hours. Offline\norders have a `created_at` value that reflects the time the order was created,\nnot the time it was subsequently transmitted to Square."
- target: $['paths']['/v2/orders/{order_id}']['get']
  update:
    description: Retrieves an [Order](entity:Order) by ID.
- target: $['paths']['/v2/orders/{order_id}']['put']
  update:
    description: 'Updates an open [order](entity:Order) by adding, replacing, or deleting

      fields. Orders with a `COMPLETED` or `CANCELED` state cannot be updated.


      An `UpdateOrder` request requires the following:


      - The `order_id` in the endpoint path, identifying the order to update.

      - The latest `version` of the order to update.

      - The [sparse order](https://developer.squareup.com/docs/orders-api/manage-orders/update-orders#sparse-order-objects)

      containing only the fields to update and the version to which the update is

      being applied.

      - If deleting fields, the [dot notation paths](https://developer.squareup.com/docs/orders-api/manage-orders/update-orders#identifying-fields-to-delete)

      identifying the fields to clear.


      To pay for an order, see

      [Pay for Orders](https://developer.squareup.com/docs/orders-api/pay-for-orders).'
- target: $['paths']['/v2/orders/{order_id}/custom-attributes']['get']
  update:
    description: 'Lists the [custom attributes](entity:CustomAttribute) associated with an order.


      You can use the `with_definitions` query parameter to also retrieve custom attribute definitions

      in the same call.


      When all response pages are retrieved, the results include all custom attributes that are

      visible to the requesting application, including those that are owned by other applications

      and set to `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders/{order_id}/custom-attributes/{custom_attribute_key}']['delete']
  update:
    description: 'Deletes a [custom attribute](entity:CustomAttribute) associated with a customer profile.


      To delete a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders/{order_id}/custom-attributes/{custom_attribute_key}']['get']
  update:
    description: 'Retrieves a [custom attribute](entity:CustomAttribute) associated with an order.


      You can use the `with_definition` query parameter to also retrieve the custom attribute definition

      in the same call.


      To retrieve a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders/{order_id}/custom-attributes/{custom_attribute_key}']['post']
  update:
    description: 'Creates or updates a [custom attribute](entity:CustomAttribute) for an order.


      Use this endpoint to set the value of a custom attribute for a specific order.

      A custom attribute is based on a custom attribute definition in a Square seller account. (To create a

      custom attribute definition, use the [CreateOrderCustomAttributeDefinition](api-endpoint:OrderCustomAttributes-CreateOrderCustomAttributeDefinition) endpoint.)


      To create or update a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders/{order_id}/pay']['post']
  update:
    description: 'Pay for an [order](entity:Order) using one or more approved [payments](entity:Payment)

      or settle an order with a total of `0`.


      The total of the `payment_ids` listed in the request must be equal to the order

      total. Orders with a total amount of `0` can be marked as paid by specifying an empty

      array of `payment_ids` in the request.


      To be used with `PayOrder`, a payment must:


      - Reference the order by specifying the `order_id` when [creating the payment](api-endpoint:Payments-CreatePayment).

      Any approved payments that reference the same `order_id` not specified in the

      `payment_ids` is canceled.

      - Be approved with [delayed capture](https://developer.squareup.com/docs/payments-api/take-payments/card-payments/delayed-capture).

      Using a delayed capture payment with `PayOrder` completes the approved payment.'
- target: $['paths']['/v2/payments']['get']['parameters'][?(@.name == 'sort_order' && @.in == 'query')]
  update:
    description: 'The order in which results are listed by `ListPaymentsRequest.sort_field`:

      - `ASC` - Oldest to newest.

      - `DESC` - Newest to oldest (default).'
