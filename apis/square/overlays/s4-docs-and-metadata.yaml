    - error-code: BAD_REQUEST
    - error-code: FORBIDDEN
- target: $['paths']['/v2/team-members/bulk-create']['post']
  update:
    x-endpoint-errors:
    - error-code: BAD_REQUEST
    - error-code: FORBIDDEN
- target: $['paths']['/v2/team-members/bulk-update']['post']
  update:
    x-endpoint-errors:
    - error-code: BAD_REQUEST
    - error-code: FORBIDDEN
- target: $['paths']['/v2/team-members/search']['post']
  update:
    description: "Returns a paginated list of `TeamMember` objects for a business. \nThe list can be filtered by location IDs, `ACTIVE` or `INACTIVE` status, or whether\nthe team member is the Square account owner."
- target: $['paths']['/v2/team-members/{team_member_id}']['put']['x-endpoint-errors']
  remove: true
- target: $['paths']['/v2/team-members/{team_member_id}']['put']
  update:
    x-endpoint-errors:
    - error-code: INVALID_EMAIL_ADDRESS
    - error-code: BAD_REQUEST
    - error-code: FORBIDDEN
- target: $['paths']['/v2/team-members/{team_member_id}/wage-setting']['get']
  update:
    description: 'Retrieves a `WageSetting` object for a team member specified

      by `TeamMember.id`. For more information, see

      [Troubleshooting the Team API](https://developer.squareup.com/docs/team/troubleshooting#retrievewagesetting).


      Square recommends using [RetrieveTeamMember](api-endpoint:Team-RetrieveTeamMember) or [SearchTeamMembers](api-endpoint:Team-SearchTeamMembers)

      to get this information directly from the `TeamMember.wage_setting` field.'
- target: $['paths']['/v2/team-members/{team_member_id}/wage-setting']['put']
  update:
    description: 'Creates or updates a `WageSetting` object. The object is created if a

      `WageSetting` with the specified `team_member_id` doesn''t exist. Otherwise,

      it fully replaces the `WageSetting` object for the team member.

      The `WageSetting` is returned on a successful update. For more information, see

      [Troubleshooting the Team API](https://developer.squareup.com/docs/team/troubleshooting#create-or-update-a-wage-setting).


      Square recommends using [CreateTeamMember](api-endpoint:Team-CreateTeamMember) or [UpdateTeamMember](api-endpoint:Team-UpdateTeamMember)

      to manage the `TeamMember.wage_setting` field directly.'
- target: $['paths']['/v2/terminals/refunds']['post']
  update:
    description: Creates a request to refund an Interac payment completed on a Square Terminal. Refunds for Interac payments on a Square Terminal are supported only for Interac debit cards in Canada. Other refunds for Terminal payments should use the Refunds API. For more information, see [Refunds API](api:Refunds).
- target: $['paths']['/v2/vendors/bulk-create']['post']
  update:
    description: Creates one or more [Vendor](entity:Vendor) objects to represent suppliers to a seller.
- target: $['paths']['/v2/vendors/bulk-retrieve']['post']
  update:
    description: Retrieves one or more vendors of specified [Vendor](entity:Vendor) IDs.
- target: $['paths']['/v2/vendors/bulk-update']['put']
  update:
    description: Updates one or more of existing [Vendor](entity:Vendor) objects as suppliers to a seller.
- target: $['paths']['/v2/vendors/create']['post']
  update:
    description: Creates a single [Vendor](entity:Vendor) object to represent a supplier to a seller.
- target: $['paths']['/v2/vendors/search']['post']
  update:
    description: Searches for vendors using a filter against supported [Vendor](entity:Vendor) properties and a supported sorter.
- target: $['paths']['/v2/vendors/{vendor_id}']['get']
  update:
    description: Retrieves the vendor of a specified [Vendor](entity:Vendor) ID.
- target: $['paths']['/v2/vendors/{vendor_id}']['put']
  update:
    description: Updates an existing [Vendor](entity:Vendor) object as a supplier to a seller.
- target: $
  update:
