          type: string
          description: '**Read only** The unique Square-assigned ID of the job. If you need a job ID for an API request,

            call [ListJobs](api-endpoint:Team-ListJobs) or use the ID returned when you created the job.

            You can also get job IDs from a team member''s wage setting.'
        title:
          type: string
          description: The title of the job.
          maxLength: 150
          nullable: true
        is_tip_eligible:
          type: boolean
          description: Indicates whether team members can earn tips for the job.
          nullable: true
        created_at:
          type: string
          description: The timestamp when the job was created, in RFC 3339 format.
          readOnly: true
        updated_at:
          type: string
          description: The timestamp when the job was last updated, in RFC 3339 format.
          readOnly: true
        version:
          type: integer
          description: '**Read only** The current version of the job. Include this field in `UpdateJob` requests to enable

            [optimistic concurrency](https://developer.squareup.com/docs/working-with-apis/optimistic-concurrency)

            control and avoid overwrites from concurrent requests. Requests fail if the provided version doesn''t

            match the server version at the time of the request.'
