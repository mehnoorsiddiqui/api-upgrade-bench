      description: 'Represents a job that can be assigned to [team members](entity:TeamMember). This object defines the

        job''s title and tip eligibility. Compensation is defined in a [job assignment](entity:JobAssignment)

        in a team member''s wage setting.'
      x-release-status: BETA
      properties:
