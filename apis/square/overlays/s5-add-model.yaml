      properties:
        transfer_order_line_uid:
          type: string
          description: The unique identifier of the Transfer Order line being received
          maxLength: 64
        quantity_received:
          type: string
          description: 'The quantity received for this line item as a decimal string (e.g. "10.5").

            These items will be added to the destination [Location](entity:Location)''s inventory with [InventoryState](entity:InventoryState) of IN_STOCK.'
          minLength: 1
