    BookingCreatedEvent:
      type: object
      description: "Published when a booking is created.\n\nTo receive this event with buyer-level permissions, you must have `APPOINTMENTS_READ` set for the OAuth scope.  \nTo receive this event with seller-level permissions, you must have `APPOINTMENTS_ALL_READ` and `APPOINTMENTS_READ` set for the OAuth scope."
      x-release-status: PUBLIC
      properties:
        merchant_id:
          type: string
          description: The ID of the target seller associated with the event.
          nullable: true
        type:
          type: string
          description: The type of this event. The value is `"booking.created"`.
          nullable: true
        event_id:
          type: string
          description: A unique ID for the event.
          nullable: true
        created_at:
          type: string
          description: The timestamp of when the event was created, in RFC 3339 format.
          readOnly: true
        data:
          $ref: '#/components/schemas/BookingCreatedEventData'
          description: The data associated with the event.
          nullable: true
      example:
        created_at: '2020-12-08T19:56:53Z'
        data:
          id: i2id2g3enyspi7:0
          object:
            booking:
              appointment_segments:
