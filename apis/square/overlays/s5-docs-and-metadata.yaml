actions:
- target: $['components']['securitySchemes']['bearerAuth']['x-additional-headers']
  remove: true
- target: $['components']['securitySchemes']['bearerAuth']
  update:
    x-additional-headers:
    - name: Square-Version
      description: Square Connect API versions
      schema:
        default: '2025-10-16'
- target: $['components']['schemas']['Break']
  update:
    description: A record of a team member's break on a [timecard](entity:Timecard).
- target: $['components']['schemas']['Break']['properties']['start_at']
  update:
    description: 'RFC 3339; follows the same timezone information as the [timecard](entity:Timecard). Precision up to

      the minute is respected; seconds are truncated.'
- target: $['components']['schemas']['Break']['properties']['end_at']
  update:
    description: 'RFC 3339; follows the same timezone information as the [timecard](entity:Timecard). Precision up to

      the minute is respected; seconds are truncated.'
- target: $['components']['schemas']['Break']['properties']['break_type_id']
  update:
    description: The [BreakType](entity:BreakType) that this break was templated on.
- target: $['components']['schemas']['Break']['properties']['expected_duration']
  update:
    description: 'Format: RFC-3339 P[n]Y[n]M[n]DT[n]H[n]M[n]S. The expected length of

      the break.


      Example for break expected duration of 15 minutes: PT15M'
- target: $['components']['schemas']['BreakType']
  update:
    description: 'A template for a type of [break](entity:Break) that can be added to a

      [timecard](entity:Timecard), including the expected duration and paid status.'
- target: $['components']['schemas']['BreakType']['properties']['break_name']
  update:
    description: 'A human-readable name for this type of break. The name is displayed to

      team members in Square products.'
- target: $['components']['schemas']['BreakType']['properties']['expected_duration']
  update:
    description: 'Format: RFC-3339 P[n]Y[n]M[n]DT[n]H[n]M[n]S. The expected length of

      this break. Precision less than minutes is truncated.


      Example for break expected duration of 15 minutes: PT15M'
- target: $['components']['schemas']['CancelPaymentByIdempotencyKeyRequest']
  update:
    description: 'Describes a request to cancel a payment using

      [CancelPaymentByIdempotencyKey](api-endpoint:Payments-CancelPaymentByIdempotencyKey).'
- target: $['components']['schemas']['CancelPaymentByIdempotencyKeyResponse']
  update:
    description: 'Defines the response returned by

      [CancelPaymentByIdempotencyKey](api-endpoint:Payments-CancelPaymentByIdempotencyKey).

      On success, `errors` is empty.'
- target: $['components']['schemas']['Card']['properties']['billing_address']
  update:
    description: 'The billing address for this card. `US` postal codes can be provided as a 5-digit zip code

      or 9-digit ZIP+4 (example: `12345-6789`). For a full list of field meanings by country, see

      [Working with Addresses](https://developer.squareup.com/docs/build-basics/common-data-types/working-with-addresses).'
- target: $['components']['schemas']['Card']['properties']['customer_id']
  update:
    description: '**Required** The ID of a [customer](entity:Customer) to be associated with the card.'
- target: $['components']['schemas']['Card']['properties']['prepaid_type']
  update:
    description: 'Indicates whether the card is prepaid or not.

      See [CardPrepaidType](#type-cardprepaidtype) for possible values'
- target: $['components']['schemas']['CatalogItemModifierListInfo']
  update:
    description: 'Controls how a modifier list is applied to a specific item. This object allows for item-specific customization of modifier list behavior

      and provides the ability to override global modifier list settings.'
- target: $['components']['schemas']['CatalogItemModifierListInfo']['properties']['modifier_overrides']
  update:
    description: A set of `CatalogModifierOverride` objects that override default modifier settings for this item.
- target: $['components']['schemas']['CatalogItemModifierListInfo']['properties']['min_selected_modifiers']
  update:
    description: 'The minimum number of modifiers that must be selected from this modifier list.

      Values:


      - 0: No selection is required.

      - -1: Default value, the attribute was not set by the client. When `max_selected_modifiers` is

      also -1, use the minimum and maximum selection values set on the `CatalogItemModifierList`.

      - &gt;0: The required minimum modifier selections. This can be larger than the total `CatalogModifiers` when `allow_quantities` is enabled.

      - &lt; -1: Invalid. Treated as no selection required.'
- target: $['components']['schemas']['CatalogItemModifierListInfo']['properties']['max_selected_modifiers']
  update:
    description: 'The maximum number of modifiers that can be selected.

      Values:


      - 0: No maximum limit.

      - -1: Default value, the attribute was not set by the client. When `min_selected_modifiers` is

      also -1, use the minimum and maximum selection values set on the `CatalogItemModifierList`.

      - &gt;0: The maximum total modifier selections. This can be larger than the total `CatalogModifiers` when `allow_quantities` is enabled.

      - &lt; -1: Invalid. Treated as no maximum limit.'
- target: $['components']['schemas']['CatalogModifier']
  update:
    description: A modifier that can be applied to items at the time of sale. For example, a cheese modifier for a burger, or a flavor modifier for a serving of ice cream.
- target: $['components']['schemas']['CatalogModifierList']
  update:
    description: 'A container for a list of modifiers, or a text-based modifier.

      For text-based modifiers, this represents text configuration for an item. (For example, custom text to print on a t-shirt).

      For non text-based modifiers, this represents a list of modifiers that can be applied to items at the time of sale.

      (For example, a list of condiments for a hot dog, or a list of ice cream flavors).

      Each element of the modifier list is a `CatalogObject` instance of the `MODIFIER` type.'
- target: $['components']['schemas']['CatalogModifierList']['properties']['selection_type']
  update:
    description: '__Deprecated__: Indicates whether a single (`SINGLE`) modifier or multiple (`MULTIPLE`) modifiers can be selected. Use

      `min_selected_modifiers` and `max_selected_modifiers` instead.

      See [CatalogModifierListSelectionType](#type-catalogmodifierlistselectiontype) for possible values'
- target: $['components']['schemas']['CatalogModifierOverride']['properties']['on_by_default']
  update:
    description: '__Deprecated__: Use `on_by_default_override` instead.'
- target: $['components']['schemas']['CompletePaymentRequest']
  update:
    description: 'Describes a request to complete (capture) a payment using

      [CompletePayment](api-endpoint:Payments-CompletePayment).


      By default, payments are set to `autocomplete` immediately after they are created.

      To complete payments manually, set `autocomplete` to `false`.'
- target: $['components']['schemas']['CompletePaymentRequest']['properties']['version_token']
  update:
    description: 'Used for optimistic concurrency. This opaque token identifies the current `Payment`

      version that the caller expects. If the server has a different version of the Payment,

      the update fails and a response with a VERSION_MISMATCH error is returned.'
