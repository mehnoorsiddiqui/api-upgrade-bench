- target: $['components']['schemas']['CreatePaymentRequest']
  update:
    description: 'Describes a request to create a payment using

      [CreatePayment](api-endpoint:Payments-CreatePayment).'
- target: $['components']['schemas']['CreatePaymentRequest']['properties']['source_id']
  update:
    description: 'The ID for the source of funds for this payment.

      This could be a payment token generated by the Web Payments SDK for any of its

      [supported methods](https://developer.squareup.com/docs/web-payments/overview#explore-payment-methods),

      including cards, bank transfers, Afterpay or Cash App Pay. If recording a payment

      that the seller received outside of Square, specify either "CASH" or "EXTERNAL".

      For more information, see

      [Take Payments](https://developer.squareup.com/docs/payments-api/take-payments).'
- target: $['components']['schemas']['CreatePaymentRequest']['properties']['delay_duration']
  update:
    description: 'The duration of time after the payment''s creation when Square automatically

      either completes or cancels the payment depending on the `delay_action` field value.

      For more information, see

      [Time threshold](https://developer.squareup.com/docs/payments-api/take-payments/card-payments/delayed-capture#time-threshold).


      This parameter should be specified as a time duration, in RFC 3339 format.


      Note: This feature is only supported for card payments. This parameter can only be set for a delayed

      capture payment (`autocomplete=false`).


      Default:


      - Card-present payments: "PT36H" (36 hours) from the creation time.

      - Card-not-present payments: "P7D" (7 days) from the creation time.'
- target: $['components']['schemas']['CreatePaymentRequest']['properties']['delay_action']
  update:
    description: 'The action to be applied to the payment when the `delay_duration` has elapsed. The action must be

      CANCEL or COMPLETE. For more information, see

      [Time Threshold](https://developer.squareup.com/docs/payments-api/take-payments/card-payments/delayed-capture#time-threshold).


      Default: CANCEL'
- target: $['components']['schemas']['CreatePaymentRequest']['properties']['team_member_id']
  update:
    description: 'An optional [TeamMember](entity:TeamMember) ID to associate with

      this payment.'
- target: $['components']['schemas']['CreatePaymentRequest']['properties']['reference_id']
  update:
    description: 'A user-defined ID to associate with the payment.


      You can use this field to associate the payment to an entity in an external system

      (for example, you might specify an order ID that is generated by a third-party shopping cart).'
- target: $['components']['schemas']['CreateSubscriptionRequest']['properties']['canceled_date']
  update:
    description: "The `YYYY-MM-DD`-formatted date when the newly created subscription is scheduled for cancellation. \n\nThis date overrides the cancellation date set in the plan variation configuration.\nIf the cancellation date is earlier than the end date of a subscription cycle, the subscription stops\nat the canceled date and the subscriber is sent a prorated invoice at the beginning of the canceled cycle. \n\nWhen the subscription plan of the newly created subscription has a fixed number of cycles and the `canceled_date`\noccurs before the subscription plan completes, the specified `canceled_date` sets the date when the subscription\nstops through the end of the last cycle."
