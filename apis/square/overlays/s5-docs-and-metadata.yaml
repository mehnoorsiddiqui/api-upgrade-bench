    x-enum-elements:
    - name: PENDING
      description: The subscription is pending to start in the future.
    - name: ACTIVE
      description: The subscription is active.
    - name: CANCELED
      description: The subscription is canceled.
    - name: DEACTIVATED
      description: The subscription is deactivated.
    - name: PAUSED
      description: The subscription is paused.
    - name: COMPLETED
      description: The subscription has completed all of its phases.
- target: $['components']['schemas']['TeamMemberWage']
  update:
    description: 'Job and wage information for a [team member](entity:TeamMember).

      This convenience object provides details needed to specify the `wage`

      field for a [timecard](entity:Timecard).'
- target: $['components']['schemas']['TeamMemberWage']['properties']['job_id']
  update:
    description: An identifier for the [job](entity:Job) that this wage relates to.
- target: $['components']['schemas']['TerminalCheckout']['properties']['order_id']
  update:
    description: The reference to the Square order ID for the checkout request.
- target: $['components']['schemas']['TerminalCheckout']['properties']['payment_options']
  update:
    description: Payment-specific options for the checkout request.
- target: $['components']['schemas']['TerminalCheckout']['properties']['app_fee_money']
  update:
    description: 'The amount the developer is taking as a fee for facilitating the payment on behalf

      of the seller.


      The amount cannot be more than 90% of the total amount of the payment.


      The amount must be specified in the smallest denomination of the applicable currency (for example, US dollar amounts are specified in cents). For more information, see [Working with Monetary Amounts](https://developer.squareup.com/docs/build-basics/working-with-monetary-amounts).


      The fee currency code must match the currency associated with the seller that is accepting the payment. The application must be from a developer account in the same country and using the same currency code as the seller.


      For more information about the application fee scenario, see [Take Payments and Collect Fees](https://developer.squareup.com/docs/payments-api/take-payments-and-collect-fees).


      To set this field, PAYMENTS_WRITE_ADDITIONAL_RECIPIENTS OAuth permission is required. For more information, see [Permissions](https://developer.squareup.com/docs/payments-api/take-payments-and-collect-fees#permissions).'
- target: $['components']['schemas']['TerminalCheckout']['properties']['statement_description_identifier']
  update:
    description: 'Optional additional payment information to include on the customer''s card statement as

      part of the statement description. This can be, for example, an invoice number, ticket number,

      or short description that uniquely identifies the purchase.'
- target: $['components']['schemas']['TerminalCheckout']['properties']['tip_money']
  update:
    description: 'The amount designated as a tip, in addition to `amount_money`. This may only be set for a

      checkout that has tipping disabled (`tip_settings.allow_tipping` is `false`).'
- target: $['components']['schemas']['UpdateTeamMemberRequest']['example']
  remove: true
