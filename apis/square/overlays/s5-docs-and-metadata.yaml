- target: $['components']['schemas']['LoyaltyAccount']['properties']['enrolled_at']
  update:
    description: "The timestamp when the buyer joined the loyalty program, in RFC 3339 format. This field is used to display the **Enrolled On** or **Member Since** date in first-party Square products.\n\nIf this field is not set in a `CreateLoyaltyAccount` request, Square populates it after the buyer's first action on their account \n(when `AccumulateLoyaltyPoints` or `CreateLoyaltyReward` is called). In first-party flows, Square populates the field when the buyer agrees to the terms of service on Square Point of Sale. \n\nIf this field is set in a `CreateLoyaltyAccount` request, it is meant to be used when there is a loyalty migration from another system and into Square.\nIn that case, the timestamp can reflect when the buyer originally enrolled in the previous system. It may represent a current or past date, but cannot be set in the future.\nNote: Setting this field in this scenario does not, by itself, impact the first-party enrollment flow on Square Point of Sale."
- target: $['components']['schemas']['ObtainTokenRequest']['properties']['client_id']
  update:
    description: 'The Square-issued ID of your application, which is available as the **Application ID**

      on the **OAuth** page in the [Developer Console](https://developer.squareup.com/apps).


      Required for the code flow and PKCE flow for any grant type.'
- target: $['components']['schemas']['ObtainTokenRequest']['properties']['client_secret']
  update:
    description: 'The secret key for your application, which is available as the **Application secret**

      on the **OAuth** page in the [Developer Console](https://developer.squareup.com/apps).


      Required for the code flow for any grant type. Don''t confuse your client secret with your

      personal access token.'
- target: $['components']['schemas']['ObtainTokenRequest']['properties']['code']
  update:
    description: 'The authorization code to exchange for an OAuth access token. This is the `code`

      value that Square sent to your redirect URL in the authorization response.


      Required for the code flow and PKCE flow if `grant_type` is `authorization_code`.'
- target: $['components']['schemas']['ObtainTokenRequest']['properties']['redirect_uri']
  update:
    description: 'The redirect URL for your application, which you registered as the **Redirect URL**

      on the **OAuth** page in the [Developer Console](https://developer.squareup.com/apps).


      Required for the code flow and PKCE flow if `grant_type` is `authorization_code` and

      you provided the `redirect_uri` parameter in your authorization URL.'
- target: $['components']['schemas']['ObtainTokenRequest']['properties']['grant_type']
  update:
    description: 'The method used to obtain an OAuth access token. The request must include the

      credential that corresponds to the specified grant type. Valid values are:

      - `authorization_code` - Requires the `code` field.

      - `refresh_token` - Requires the `refresh_token` field.

      - `migration_token` - LEGACY for access tokens obtained using a Square API version prior

      to 2019-03-13. Requires the `migration_token` field.'
- target: $['components']['schemas']['ObtainTokenRequest']['properties']['refresh_token']
  update:
    description: 'A valid refresh token used to generate a new OAuth access token. This is a

      refresh token that was returned in a previous `ObtainToken` response.


      Required for the code flow and PKCE flow if `grant_type` is `refresh_token`.'
- target: $['components']['schemas']['ObtainTokenRequest']['properties']['migration_token']
  update:
    description: '__LEGACY__ A valid access token (obtained using a Square API version prior to 2019-03-13)

      used to generate a new OAuth access token.


      Required if `grant_type` is `migration_token`. For more information, see

      [Migrate to Using Refresh Tokens](https://developer.squareup.com/docs/oauth-api/migrate-to-refresh-tokens).'
- target: $['components']['schemas']['ObtainTokenRequest']['properties']['scopes']
  update:
    description: 'The list of permissions that are explicitly requested for the access token.

      For example, ["MERCHANT_PROFILE_READ","PAYMENTS_READ","BANK_ACCOUNTS_READ"].


      The returned access token is limited to the permissions that are the intersection

      of these requested permissions and those authorized by the provided `refresh_token`.


      Optional for the code flow and PKCE flow if `grant_type` is `refresh_token`.'
- target: $['components']['schemas']['ObtainTokenRequest']['properties']['short_lived']
  update:
    description: 'Indicates whether the returned access token should expire in 24 hours.


      Optional for the code flow and PKCE flow for any grant type. The default value is `false`.'
- target: $['components']['schemas']['ObtainTokenRequest']['properties']['code_verifier']
  update:
    description: 'The secret your application generated for the authorization request used to

      obtain the authorization code. This is the source of the `code_challenge` hash you

      provided in your authorization URL.


      Required for the PKCE flow if `grant_type` is `authorization_code`.'
