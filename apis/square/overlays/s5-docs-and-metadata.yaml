- target: $['components']['schemas']['Invoice']['properties']['public_url']
  update:
    description: "A temporary link to the Square-hosted payment page where the customer can pay the\ninvoice. If the link expires, customers can provide the email address or phone number\nassociated with the invoice and request a new link directly from the expired payment page. \n\nThis field is added after the invoice is published and reaches the scheduled date\n(if one is defined)."
- target: $['components']['schemas']['InvoiceStatus']['x-enum-elements']
  remove: true
- target: $['components']['schemas']['InvoiceStatus']
  update:
    x-enum-elements:
    - name: DRAFT
      description: 'The invoice is a draft. You must publish a draft invoice before Square can process it.

        A draft invoice has no `public_url`, so it is not available to customers.'
    - name: UNPAID
      description: The invoice is published but not yet paid.
    - name: SCHEDULED
      description: 'The invoice is scheduled to be processed. On the scheduled date,

        Square sends the invoice, initiates an automatic payment, or takes no action, depending on

        the delivery method and payment request settings. Square also sets the invoice status to the

        appropriate state: `UNPAID`, `PAID`, `PARTIALLY_PAID`, or `PAYMENT_PENDING`.'
    - name: PARTIALLY_PAID
      description: A partial payment is received for the invoice.
    - name: PAID
      description: The customer paid the invoice in full.
    - name: PARTIALLY_REFUNDED
      description: 'The invoice is paid (or partially paid) and some but not all the amount paid is

        refunded.'
    - name: REFUNDED
      description: The full amount that the customer paid for the invoice is refunded.
    - name: CANCELED
      description: 'The invoice is canceled. Square no longer requests payments from the customer.

        The Square-hosted payment page is still accessible using the temporary `public_url`

        link, but the invoice is shown as canceled and does not accept payment.'
    - name: FAILED
      description: Square canceled the invoice due to suspicious activity.
    - name: PAYMENT_PENDING
      description: 'A payment on the invoice was initiated but has not yet been processed.


        When in this state, invoices cannot be updated and other payments cannot be initiated.'
- target: $['components']['schemas']['InvoiceStatus']
  update:
    description: Indicates the status of an [invoice](entity:Invoice).
