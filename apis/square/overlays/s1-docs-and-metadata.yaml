- target: $['paths']['/v2/inventory/{catalog_object_id}']['get']
  update:
    description: 'Retrieves the current calculated stock count for a given

      [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) at a given set of

      [Location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location)s. Responses are paginated and unsorted.

      For more sophisticated queries, use a batch endpoint.'
- target: $['paths']['/v2/inventory/{catalog_object_id}']['get']['parameters'][?(@.name == 'catalog_object_id' && @.in == 'path')]
  update:
    description: ID of the [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) to retrieve.
- target: $['paths']['/v2/inventory/{catalog_object_id}']['get']['parameters'][?(@.name == 'location_ids' && @.in == 'query')]
  update:
    description: 'The [Location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location) IDs to look up as a comma-separated

      list. An empty list queries all locations.'
- target: $['paths']['/v2/inventory/{catalog_object_id}/changes']['get']
  update:
    description: 'Returns a set of physical counts and inventory adjustments for the

      provided [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) at the requested

      [Location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location)s.


      You can achieve the same result by calling [BatchRetrieveInventoryChanges](https://developer.squareup.com/reference/square_2024-05-15/inventory-api/batch-retrieve-inventory-changes)

      and having the `catalog_object_ids` list contain a single element of the `CatalogObject` ID.


      Results are paginated and sorted in descending order according to their

      `occurred_at` timestamp (newest first).


      There are no limits on how far back the caller can page. This endpoint can be

      used to display recent changes for a specific item. For more

      sophisticated queries, use a batch endpoint.'
- target: $['paths']['/v2/inventory/{catalog_object_id}/changes']['get']['parameters'][?(@.name == 'catalog_object_id' && @.in == 'path')]
  update:
    description: ID of the [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) to retrieve.
- target: $['paths']['/v2/inventory/{catalog_object_id}/changes']['get']['parameters'][?(@.name == 'location_ids' && @.in == 'query')]
