- target: $['paths']['/v2/locations/{location_id}/custom-attributes/{key}']['delete']['parameters'][?(@.name == 'location_id' && @.in == 'path')]
  update:
    description: The ID of the target [location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location).
- target: $['paths']['/v2/locations/{location_id}/custom-attributes/{key}']['get']
  update:
    description: 'Retrieves a [custom attribute](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) associated with a location.

      You can use the `with_definition` query parameter to also retrieve the custom attribute definition

      in the same call.

      To retrieve a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/locations/{location_id}/custom-attributes/{key}']['get']['parameters'][?(@.name == 'location_id' && @.in == 'path')]
  update:
    description: The ID of the target [location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location).
- target: $['paths']['/v2/locations/{location_id}/custom-attributes/{key}']['get']['parameters'][?(@.name == 'with_definition' && @.in == 'query')]
  update:
    description: 'Indicates whether to return the [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) in the `definition` field of

      the custom attribute. Set this parameter to `true` to get the name and description of the custom

      attribute, information about the data type, or other definition details. The default value is `false`.'
- target: $['paths']['/v2/locations/{location_id}/custom-attributes/{key}']['post']
  update:
    description: 'Creates or updates a [custom attribute](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) for a location.

      Use this endpoint to set the value of a custom attribute for a specified location.

      A custom attribute is based on a custom attribute definition in a Square seller account, which

      is created using the [CreateLocationCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/location-custom-attributes-api/create-location-custom-attribute-definition) endpoint.

      To create or update a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/locations/{location_id}/custom-attributes/{key}']['post']['parameters'][?(@.name == 'location_id' && @.in == 'path')]
  update:
    description: The ID of the target [location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location).
- target: $['paths']['/v2/locations/{location_id}/transactions/{transaction_id}/capture']['post']
  update:
    description: 'Captures a transaction that was created with the [Charge](https://developer.squareup.com/reference/square_2024-05-15/transactions-api/charge)

      endpoint with a `delay_capture` value of `true`.



      See [Delayed capture transactions](https://developer.squareup.com/docs/payments/transactions/overview#delayed-capture)

      for more information.'
- target: $['paths']['/v2/locations/{location_id}/transactions/{transaction_id}/void']['post']
  update:
    description: 'Cancels a transaction that was created with the [Charge](https://developer.squareup.com/reference/square_2024-05-15/transactions-api/charge)

      endpoint with a `delay_capture` value of `true`.



      See [Delayed capture transactions](https://developer.squareup.com/docs/payments/transactions/overview#delayed-capture)

      for more information.'
- target: $['paths']['/v2/loyalty/accounts/{account_id}']['get']['parameters'][?(@.name == 'account_id' && @.in == 'path')]
  update:
    description: The ID of the [loyalty account](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyAccount) to retrieve.
- target: $['paths']['/v2/loyalty/accounts/{account_id}/accumulate']['post']
  update:
    description: 'Adds points earned from a purchase to a [loyalty account](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyAccount).


      - If you are using the Orders API to manage orders, provide the `order_id`. Square reads the order

      to compute the points earned from both the base loyalty program and an associated

      [loyalty promotion](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyPromotion). For purchases that qualify for multiple accrual

      rules, Square computes points based on the accrual rule that grants the most points.

      For purchases that qualify for multiple promotions, Square computes points based on the most

      recently created promotion. A purchase must first qualify for program points to be eligible for promotion points.


      - If you are not using the Orders API to manage orders, provide `points` with the number of points to add.

      You must first perform a client-side computation of the points earned from the loyalty program and

      loyalty promotion. For spend-based and visit-based programs, you can call [CalculateLoyaltyPoints](https://developer.squareup.com/reference/square_2024-05-15/loyalty-api/calculate-loyalty-points)

      to compute the points earned from the base loyalty program. For information about computing points earned from a loyalty promotion, see

      [Calculating promotion points](https://developer.squareup.com/docs/loyalty-api/loyalty-promotions#calculate-promotion-points).'
- target: $['paths']['/v2/loyalty/accounts/{account_id}/accumulate']['post']['parameters'][?(@.name == 'account_id' && @.in == 'path')]
  update:
    description: The ID of the target [loyalty account](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyAccount).
- target: $['paths']['/v2/loyalty/accounts/{account_id}/adjust']['post']
  update:
    description: 'Adds points to or subtracts points from a buyer''s account.


      Use this endpoint only when you need to manually adjust points. Otherwise, in your application flow, you call

      [AccumulateLoyaltyPoints](https://developer.squareup.com/reference/square_2024-05-15/loyalty-api/accumulate-loyalty-points)

      to add points when a buyer pays for the purchase.'
- target: $['paths']['/v2/loyalty/accounts/{account_id}/adjust']['post']['parameters'][?(@.name == 'account_id' && @.in == 'path')]
  update:
    description: The ID of the target [loyalty account](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyAccount).
- target: $['paths']['/v2/loyalty/programs']['get']
  update:
    description: 'Returns a list of loyalty programs in the seller''s account.

      Loyalty programs define how buyers can earn points and redeem points for rewards. Square sellers can have only one loyalty program, which is created and managed from the Seller Dashboard. For more information, see [Loyalty Program Overview](https://developer.squareup.com/docs/loyalty/overview).



      Replaced with [RetrieveLoyaltyProgram](https://developer.squareup.com/reference/square_2024-05-15/loyalty-api/retrieve-loyalty-program) when used with the keyword `main`.'
- target: $['paths']['/v2/loyalty/programs/{program_id}/calculate']['post']
  update:
    description: 'Calculates the number of points a buyer can earn from a purchase. Applications might call this endpoint

      to display the points to the buyer.


      - If you are using the Orders API to manage orders, provide the `order_id` and (optional) `loyalty_account_id`.

      Square reads the order to compute the points earned from the base loyalty program and an associated

      [loyalty promotion](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyPromotion).


      - If you are not using the Orders API to manage orders, provide `transaction_amount_money` with the

      purchase amount. Square uses this amount to calculate the points earned from the base loyalty program,

      but not points earned from a loyalty promotion. For spend-based and visit-based programs, the `tax_mode`

      setting of the accrual rule indicates how taxes should be treated for loyalty points accrual.

      If the purchase qualifies for program points, call

      [ListLoyaltyPromotions](https://developer.squareup.com/reference/square_2024-05-15/loyalty-api/list-loyalty-promotions) and perform a client-side computation

      to calculate whether the purchase also qualifies for promotion points. For more information, see

      [Calculating promotion points](https://developer.squareup.com/docs/loyalty-api/loyalty-promotions#calculate-promotion-points).'
- target: $['paths']['/v2/loyalty/programs/{program_id}/calculate']['post']['parameters'][?(@.name == 'program_id' && @.in == 'path')]
  update:
    description: The ID of the [loyalty program](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyProgram), which defines the rules for accruing points.
- target: $['paths']['/v2/loyalty/programs/{program_id}/promotions']['get']
  update:
    description: 'Lists the loyalty promotions associated with a [loyalty program](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyProgram).

      Results are sorted by the `created_at` date in descending order (newest to oldest).'
- target: $['paths']['/v2/loyalty/programs/{program_id}/promotions']['get']['parameters'][?(@.name == 'program_id' && @.in == 'path')]
  update:
    description: 'The ID of the base [loyalty program](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyProgram). To get the program ID,

      call [RetrieveLoyaltyProgram](https://developer.squareup.com/reference/square_2024-05-15/loyalty-api/retrieve-loyalty-program) using the `main` keyword.'
- target: $['paths']['/v2/loyalty/programs/{program_id}/promotions']['post']
  update:
    description: 'Creates a loyalty promotion for a [loyalty program](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyProgram). A loyalty promotion

      enables buyers to earn points in addition to those earned from the base loyalty program.


      This endpoint sets the loyalty promotion to the `ACTIVE` or `SCHEDULED` status, depending on the

      `available_time` setting. A loyalty program can have a maximum of 10 loyalty promotions with an

      `ACTIVE` or `SCHEDULED` status.'
- target: $['paths']['/v2/loyalty/programs/{program_id}/promotions']['post']['parameters'][?(@.name == 'program_id' && @.in == 'path')]
  update:
    description: 'The ID of the [loyalty program](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyProgram) to associate with the promotion.

      To get the program ID, call [RetrieveLoyaltyProgram](https://developer.squareup.com/reference/square_2024-05-15/loyalty-api/retrieve-loyalty-program)

      using the `main` keyword.'
- target: $['paths']['/v2/loyalty/programs/{program_id}/promotions/{promotion_id}']['get']['parameters'][?(@.name == 'promotion_id' && @.in == 'path')]
  update:
    description: The ID of the [loyalty promotion](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyPromotion) to retrieve.
- target: $['paths']['/v2/loyalty/programs/{program_id}/promotions/{promotion_id}']['get']['parameters'][?(@.name == 'program_id' && @.in == 'path')]
  update:
    description: 'The ID of the base [loyalty program](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyProgram). To get the program ID,

      call [RetrieveLoyaltyProgram](https://developer.squareup.com/reference/square_2024-05-15/loyalty-api/retrieve-loyalty-program) using the `main` keyword.'
- target: $['paths']['/v2/loyalty/programs/{program_id}/promotions/{promotion_id}/cancel']['post']['parameters'][?(@.name == 'promotion_id' && @.in == 'path')]
  update:
    description: 'The ID of the [loyalty promotion](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyPromotion) to cancel. You can cancel a

      promotion that has an `ACTIVE` or `SCHEDULED` status.'
- target: $['paths']['/v2/loyalty/programs/{program_id}/promotions/{promotion_id}/cancel']['post']['parameters'][?(@.name == 'program_id' && @.in == 'path')]
  update:
    description: The ID of the base [loyalty program](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyProgram).
- target: $['paths']['/v2/loyalty/rewards/search']['post']
  update:
    description: 'Searches for loyalty rewards. This endpoint accepts a request with no query filters and returns results for all loyalty accounts.

      If you include a `query` object, `loyalty_account_id` is required and `status` is  optional.


      If you know a reward ID, use the

      [RetrieveLoyaltyReward](https://developer.squareup.com/reference/square_2024-05-15/loyalty-api/retrieve-loyalty-reward) endpoint.


      Search results are sorted by `updated_at` in descending order.'
- target: $['paths']['/v2/loyalty/rewards/{reward_id}']['delete']
  update:
    description: 'Deletes a loyalty reward by doing the following:


      - Returns the loyalty points back to the loyalty account.

      - If an order ID was specified when the reward was created

      (see [CreateLoyaltyReward](https://developer.squareup.com/reference/square_2024-05-15/loyalty-api/create-loyalty-reward)),

      it updates the order by removing the reward and related

      discounts.


      You cannot delete a reward that has reached the terminal state (REDEEMED).'
- target: $['paths']['/v2/loyalty/rewards/{reward_id}']['delete']['parameters'][?(@.name == 'reward_id' && @.in == 'path')]
  update:
    description: The ID of the [loyalty reward](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyReward) to delete.
- target: $['paths']['/v2/loyalty/rewards/{reward_id}']['get']['parameters'][?(@.name == 'reward_id' && @.in == 'path')]
  update:
    description: The ID of the [loyalty reward](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyReward) to retrieve.
- target: $['paths']['/v2/loyalty/rewards/{reward_id}/redeem']['post']['parameters'][?(@.name == 'reward_id' && @.in == 'path')]
  update:
    description: The ID of the [loyalty reward](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyReward) to redeem.
- target: $['paths']['/v2/merchants']['get']
  update:
    description: 'Provides details about the merchant associated with a given access token.


      The access token used to connect your application to a Square seller is associated

      with a single merchant. That means that `ListMerchants` returns a list

      with a single `Merchant` object. You can specify your personal access token

      to get your own merchant information or specify an OAuth token to get the

      information for the merchant that granted your application access.


      If you know the merchant ID, you can also use the [RetrieveMerchant](https://developer.squareup.com/reference/square_2024-05-15/merchants-api/retrieve-merchant)

      endpoint to retrieve the merchant information.'
- target: $['paths']['/v2/merchants/custom-attribute-definitions']['get']
  update:
    description: 'Lists the merchant-related [custom attribute definitions](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) that belong to a Square seller account.

      When all response pages are retrieved, the results include all custom attribute definitions

      that are visible to the requesting application, including those that are created by other

      applications and set to `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/merchants/custom-attribute-definitions']['post']
  update:
    description: 'Creates a merchant-related [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) for a Square seller account.

      Use this endpoint to define a custom attribute that can be associated with a merchant connecting to your application.

      A custom attribute definition specifies the `key`, `visibility`, `schema`, and other properties

      for a custom attribute. After the definition is created, you can call

      [UpsertMerchantCustomAttribute](https://developer.squareup.com/reference/square_2024-05-15/merchant-custom-attributes-api/upsert-merchant-custom-attribute) or

      [BulkUpsertMerchantCustomAttributes](https://developer.squareup.com/reference/square_2024-05-15/merchant-custom-attributes-api/bulk-upsert-merchant-custom-attributes)

      to set the custom attribute for a merchant.'
- target: $['paths']['/v2/merchants/custom-attribute-definitions/{key}']['delete']
  update:
    description: 'Deletes a merchant-related [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) from a Square seller account.

      Deleting a custom attribute definition also deletes the corresponding custom attribute from

      the merchant.

      Only the definition owner can delete a custom attribute definition.'
- target: $['paths']['/v2/merchants/custom-attribute-definitions/{key}']['get']
  update:
    description: 'Retrieves a merchant-related [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) from a Square seller account.

      To retrieve a custom attribute definition created by another application, the `visibility`

      setting must be `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/merchants/custom-attribute-definitions/{key}']['put']
  update:
    description: 'Updates a merchant-related [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) for a Square seller account.

      Use this endpoint to update the following fields: `name`, `description`, `visibility`, or the

      `schema` for a `Selection` data type.

      Only the definition owner can update a custom attribute definition.'
- target: $['paths']['/v2/merchants/custom-attributes/bulk-delete']['post']
  update:
    description: 'Deletes [custom attributes](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) for a merchant as a bulk operation.

      To delete a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/merchants/custom-attributes/bulk-upsert']['post']
  update:
    description: 'Creates or updates [custom attributes](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) for a merchant as a bulk operation.

      Use this endpoint to set the value of one or more custom attributes for a merchant.

      A custom attribute is based on a custom attribute definition in a Square seller account, which is

      created using the [CreateMerchantCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/merchant-custom-attributes-api/create-merchant-custom-attribute-definition) endpoint.

      This `BulkUpsertMerchantCustomAttributes` endpoint accepts a map of 1 to 25 individual upsert

      requests and returns a map of individual upsert responses. Each upsert request has a unique ID

      and provides a merchant ID and custom attribute. Each upsert response is returned with the ID

      of the corresponding request.

      To create or update a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/merchants/{merchant_id}/custom-attributes']['get']
  update:
    description: 'Lists the [custom attributes](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) associated with a merchant.

      You can use the `with_definitions` query parameter to also retrieve custom attribute definitions

      in the same call.

      When all response pages are retrieved, the results include all custom attributes that are

      visible to the requesting application, including those that are owned by other applications

      and set to `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/merchants/{merchant_id}/custom-attributes']['get']['parameters'][?(@.name == 'merchant_id' && @.in == 'path')]
  update:
    description: The ID of the target [merchant](https://developer.squareup.com/reference/square_2024-05-15/objects/Merchant).
- target: $['paths']['/v2/merchants/{merchant_id}/custom-attributes']['get']['parameters'][?(@.name == 'with_definitions' && @.in == 'query')]
  update:
    description: 'Indicates whether to return the [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) in the `definition` field of each

      custom attribute. Set this parameter to `true` to get the name and description of each custom

      attribute, information about the data type, or other definition details. The default value is `false`.'
- target: $['paths']['/v2/merchants/{merchant_id}/custom-attributes/{key}']['delete']
  update:
    description: 'Deletes a [custom attribute](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) associated with a merchant.

      To delete a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/merchants/{merchant_id}/custom-attributes/{key}']['delete']['parameters'][?(@.name == 'merchant_id' && @.in == 'path')]
  update:
    description: The ID of the target [merchant](https://developer.squareup.com/reference/square_2024-05-15/objects/Merchant).
- target: $['paths']['/v2/merchants/{merchant_id}/custom-attributes/{key}']['get']
  update:
    description: 'Retrieves a [custom attribute](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) associated with a merchant.

      You can use the `with_definition` query parameter to also retrieve the custom attribute definition

      in the same call.

      To retrieve a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/merchants/{merchant_id}/custom-attributes/{key}']['get']['parameters'][?(@.name == 'merchant_id' && @.in == 'path')]
  update:
    description: The ID of the target [merchant](https://developer.squareup.com/reference/square_2024-05-15/objects/Merchant).
- target: $['paths']['/v2/merchants/{merchant_id}/custom-attributes/{key}']['get']['parameters'][?(@.name == 'with_definition' && @.in == 'query')]
  update:
    description: 'Indicates whether to return the [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) in the `definition` field of

      the custom attribute. Set this parameter to `true` to get the name and description of the custom

      attribute, information about the data type, or other definition details. The default value is `false`.'
- target: $['paths']['/v2/merchants/{merchant_id}/custom-attributes/{key}']['post']
  update:
    description: 'Creates or updates a [custom attribute](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) for a merchant.

      Use this endpoint to set the value of a custom attribute for a specified merchant.

      A custom attribute is based on a custom attribute definition in a Square seller account, which

      is created using the [CreateMerchantCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/merchant-custom-attributes-api/create-merchant-custom-attribute-definition) endpoint.

      To create or update a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/merchants/{merchant_id}/custom-attributes/{key}']['post']['parameters'][?(@.name == 'merchant_id' && @.in == 'path')]
  update:
    description: The ID of the target [merchant](https://developer.squareup.com/reference/square_2024-05-15/objects/Merchant).
- target: $['paths']['/v2/orders']['post']
  update:
    description: 'Creates a new [order](https://developer.squareup.com/reference/square_2024-05-15/objects/Order) that can include information about products for

      purchase and settings to apply to the purchase.


      To pay for a created order, see

      [Pay for Orders](https://developer.squareup.com/docs/orders-api/pay-for-orders).


      You can modify open orders using the [UpdateOrder](https://developer.squareup.com/reference/square_2024-05-15/orders-api/update-order) endpoint.'
- target: $['paths']['/v2/orders/batch-retrieve']['post']
  update:
    description: 'Retrieves a set of [orders](https://developer.squareup.com/reference/square_2024-05-15/objects/Order) by their IDs.


      If a given order ID does not exist, the ID is ignored instead of generating an error.'
- target: $['paths']['/v2/orders/custom-attribute-definitions']['get']
  update:
    description: 'Lists the order-related [custom attribute definitions](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) that belong to a Square seller account.


      When all response pages are retrieved, the results include all custom attribute definitions

      that are visible to the requesting application, including those that are created by other

      applications and set to `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`. Note that

      seller-defined custom attributes (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders/custom-attribute-definitions/{key}']['delete']
  update:
    description: 'Deletes an order-related [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) from a Square seller account.


      Only the definition owner can delete a custom attribute definition.'
- target: $['paths']['/v2/orders/custom-attribute-definitions/{key}']['get']
  update:
    description: 'Retrieves an order-related [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) from a Square seller account.


      To retrieve a custom attribute definition created by another application, the `visibility`

      setting must be `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders/custom-attributes/bulk-delete']['post']
  update:
    description: 'Deletes order [custom attributes](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) as a bulk operation.


      Use this endpoint to delete one or more custom attributes from one or more orders.

      A custom attribute is based on a custom attribute definition in a Square seller account.  (To create a

      custom attribute definition, use the [CreateOrderCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/order-custom-attributes-api/create-order-custom-attribute-definition) endpoint.)


      This `BulkDeleteOrderCustomAttributes` endpoint accepts a map of 1 to 25 individual delete

      requests and returns a map of individual delete responses. Each delete request has a unique ID

      and provides an order ID and custom attribute. Each delete response is returned with the ID

      of the corresponding request.


      To delete a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders/custom-attributes/bulk-upsert']['post']
  update:
    description: 'Creates or updates order [custom attributes](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) as a bulk operation.


      Use this endpoint to delete one or more custom attributes from one or more orders.

      A custom attribute is based on a custom attribute definition in a Square seller account.  (To create a

      custom attribute definition, use the [CreateOrderCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/order-custom-attributes-api/create-order-custom-attribute-definition) endpoint.)


      This `BulkUpsertOrderCustomAttributes` endpoint accepts a map of 1 to 25 individual upsert

      requests and returns a map of individual upsert responses. Each upsert request has a unique ID

      and provides an order ID and custom attribute. Each upsert response is returned with the ID

      of the corresponding request.


      To create or update a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders/search']['post']
  update:
    description: "Search all orders for one or more locations. Orders include all sales,\nreturns, and exchanges regardless of how or when they entered the Square\necosystem (such as Point of Sale, Invoices, and Connect APIs).\n\n`SearchOrders` requests need to specify which locations to search and define a\n[SearchOrdersQuery](https://developer.squareup.com/reference/square_2024-05-15/objects/SearchOrdersQuery) object that controls\nhow to sort or filter the results. Your `SearchOrdersQuery` can:\n\n  Set filter criteria.\n  Set the sort order.\n  Determine whether to return results as complete `Order` objects or as\n[OrderEntry](https://developer.squareup.com/reference/square_2024-05-15/objects/OrderEntry) objects.\n\nNote that details for orders processed with Square Point of Sale while in\noffline mode might not be transmitted to Square for up to 72 hours. Offline\norders have a `created_at` value that reflects the time the order was created,\nnot the time it was subsequently transmitted to Square."
- target: $['paths']['/v2/orders/{order_id}']['get']
  update:
    description: Retrieves an [Order](https://developer.squareup.com/reference/square_2024-05-15/objects/Order) by ID.
- target: $['paths']['/v2/orders/{order_id}']['put']
  update:
    description: 'Updates an open [order](https://developer.squareup.com/reference/square_2024-05-15/objects/Order) by adding, replacing, or deleting

      fields. Orders with a `COMPLETED` or `CANCELED` state cannot be updated.


      An `UpdateOrder` request requires the following:


      - The `order_id` in the endpoint path, identifying the order to update.

      - The latest `version` of the order to update.

      - The [sparse order](https://developer.squareup.com/docs/orders-api/manage-orders/update-orders#sparse-order-objects)

      containing only the fields to update and the version to which the update is

      being applied.

      - If deleting fields, the [dot notation paths](https://developer.squareup.com/docs/orders-api/manage-orders/update-orders#identifying-fields-to-delete)

      identifying the fields to clear.


      To pay for an order, see

      [Pay for Orders](https://developer.squareup.com/docs/orders-api/pay-for-orders).'
- target: $['paths']['/v2/orders/{order_id}/custom-attributes']['get']
  update:
    description: 'Lists the [custom attributes](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) associated with an order.


      You can use the `with_definitions` query parameter to also retrieve custom attribute definitions

      in the same call.


      When all response pages are retrieved, the results include all custom attributes that are

      visible to the requesting application, including those that are owned by other applications

      and set to `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders/{order_id}/custom-attributes']['get']['parameters'][?(@.name == 'order_id' && @.in == 'path')]
  update:
    description: The ID of the target [order](https://developer.squareup.com/reference/square_2024-05-15/objects/Order).
- target: $['paths']['/v2/orders/{order_id}/custom-attributes']['get']['parameters'][?(@.name == 'with_definitions' && @.in == 'query')]
  update:
    description: "Indicates whether to return the [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) in the `definition` field of each\ncustom attribute. Set this parameter to `true` to get the name and description of each custom attribute, \ninformation about the data type, or other definition details. The default value is `false`."
- target: $['paths']['/v2/orders/{order_id}/custom-attributes/{custom_attribute_key}']['delete']
  update:
    description: 'Deletes a [custom attribute](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) associated with a customer profile.


      To delete a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders/{order_id}/custom-attributes/{custom_attribute_key}']['delete']['parameters'][?(@.name == 'order_id' && @.in == 'path')]
  update:
    description: The ID of the target [order](https://developer.squareup.com/reference/square_2024-05-15/objects/Order).
- target: $['paths']['/v2/orders/{order_id}/custom-attributes/{custom_attribute_key}']['get']
  update:
    description: 'Retrieves a [custom attribute](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) associated with an order.


      You can use the `with_definition` query parameter to also retrieve the custom attribute definition

      in the same call.


      To retrieve a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders/{order_id}/custom-attributes/{custom_attribute_key}']['get']['parameters'][?(@.name == 'order_id' && @.in == 'path')]
  update:
    description: The ID of the target [order](https://developer.squareup.com/reference/square_2024-05-15/objects/Order).
- target: $['paths']['/v2/orders/{order_id}/custom-attributes/{custom_attribute_key}']['get']['parameters'][?(@.name == 'with_definition' && @.in == 'query')]
  update:
    description: "Indicates whether to return the [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) in the `definition` field of each \ncustom attribute. Set this parameter to `true` to get the name and description of each custom attribute, \ninformation about the data type, or other definition details. The default value is `false`."
- target: $['paths']['/v2/orders/{order_id}/custom-attributes/{custom_attribute_key}']['post']
  update:
    description: 'Creates or updates a [custom attribute](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) for an order.


      Use this endpoint to set the value of a custom attribute for a specific order.

      A custom attribute is based on a custom attribute definition in a Square seller account. (To create a

      custom attribute definition, use the [CreateOrderCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/order-custom-attributes-api/create-order-custom-attribute-definition) endpoint.)


      To create or update a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/orders/{order_id}/custom-attributes/{custom_attribute_key}']['post']['parameters'][?(@.name == 'order_id' && @.in == 'path')]
  update:
    description: The ID of the target [order](https://developer.squareup.com/reference/square_2024-05-15/objects/Order).
- target: $['paths']['/v2/orders/{order_id}/pay']['post']
  update:
    description: 'Pay for an [order](https://developer.squareup.com/reference/square_2024-05-15/objects/Order) using one or more approved [payments](https://developer.squareup.com/reference/square_2024-05-15/objects/Payment)

      or settle an order with a total of `0`.


      The total of the `payment_ids` listed in the request must be equal to the order

      total. Orders with a total amount of `0` can be marked as paid by specifying an empty

      array of `payment_ids` in the request.


      To be used with `PayOrder`, a payment must:


      - Reference the order by specifying the `order_id` when [creating the payment](https://developer.squareup.com/reference/square_2024-05-15/payments-api/create-payment).

      Any approved payments that reference the same `order_id` not specified in the

      `payment_ids` is canceled.

      - Be approved with [delayed capture](https://developer.squareup.com/docs/payments-api/take-payments/card-payments/delayed-capture).

      Using a delayed capture payment with `PayOrder` completes the approved payment.'
- target: $['paths']['/v2/refunds']['get']['parameters'][?(@.name == 'status' && @.in == 'query')]
  update:
    description: 'If provided, only refunds with the given status are returned.

      For a list of refund status values, see [PaymentRefund](https://developer.squareup.com/reference/square_2024-05-15/objects/PaymentRefund).


      Default: If omitted, refunds are returned regardless of their status.'
- target: $['paths']['/v2/sites/{site_id}/snippet']['delete']
  update:
    description: 'Removes your snippet from a Square Online site.


      You can call [ListSites](https://developer.squareup.com/reference/square_2024-05-15/sites-api/list-sites) to get the IDs of the sites that belong to a seller.



      __Note:__ Square Online APIs are publicly available as part of an early access program. For more information, see [Early access program for Square Online APIs](https://developer.squareup.com/docs/online-api#early-access-program-for-square-online-apis).'
- target: $['paths']['/v2/sites/{site_id}/snippet']['get']
  update:
    description: 'Retrieves your snippet from a Square Online site. A site can contain snippets from multiple snippet applications, but you can retrieve only the snippet that was added by your application.


      You can call [ListSites](https://developer.squareup.com/reference/square_2024-05-15/sites-api/list-sites) to get the IDs of the sites that belong to a seller.



      __Note:__ Square Online APIs are publicly available as part of an early access program. For more information, see [Early access program for Square Online APIs](https://developer.squareup.com/docs/online-api#early-access-program-for-square-online-apis).'
- target: $['paths']['/v2/sites/{site_id}/snippet']['post']
  update:
    description: "Adds a snippet to a Square Online site or updates the existing snippet on the site. \nThe snippet code is appended to the end of the `head` element on every page of the site, except checkout pages. A snippet application can add one snippet to a given site. \n\nYou can call [ListSites](https://developer.squareup.com/reference/square_2024-05-15/sites-api/list-sites) to get the IDs of the sites that belong to a seller.\n\n\n__Note:__ Square Online APIs are publicly available as part of an early access program. For more information, see [Early access program for Square Online APIs](https://developer.squareup.com/docs/online-api#early-access-program-for-square-online-apis)."
- target: $['paths']['/v2/terminals/refunds']['post']
  update:
    description: Creates a request to refund an Interac payment completed on a Square Terminal. Refunds for Interac payments on a Square Terminal are supported only for Interac debit cards in Canada. Other refunds for Terminal payments should use the Refunds API. For more information, see [Refunds API](https://developer.squareup.com/reference/square_2024-05-15/refunds-api).
- target: $['paths']['/v2/vendors/bulk-create']['post']
  update:
    description: Creates one or more [Vendor](https://developer.squareup.com/reference/square_2024-05-15/objects/Vendor) objects to represent suppliers to a seller.
- target: $['paths']['/v2/vendors/bulk-retrieve']['post']
  update:
    description: Retrieves one or more vendors of specified [Vendor](https://developer.squareup.com/reference/square_2024-05-15/objects/Vendor) IDs.
- target: $['paths']['/v2/vendors/bulk-update']['put']
  update:
    description: Updates one or more of existing [Vendor](https://developer.squareup.com/reference/square_2024-05-15/objects/Vendor) objects as suppliers to a seller.
- target: $['paths']['/v2/vendors/create']['post']
  update:
    description: Creates a single [Vendor](https://developer.squareup.com/reference/square_2024-05-15/objects/Vendor) object to represent a supplier to a seller.
- target: $['paths']['/v2/vendors/search']['post']
  update:
    description: Searches for vendors using a filter against supported [Vendor](https://developer.squareup.com/reference/square_2024-05-15/objects/Vendor) properties and a supported sorter.
- target: $['paths']['/v2/vendors/{vendor_id}']['get']
  update:
    description: Retrieves the vendor of a specified [Vendor](https://developer.squareup.com/reference/square_2024-05-15/objects/Vendor) ID.
- target: $['paths']['/v2/vendors/{vendor_id}']['get']['parameters'][?(@.name == 'vendor_id' && @.in == 'path')]
  update:
    description: ID of the [Vendor](https://developer.squareup.com/reference/square_2024-05-15/objects/Vendor) to retrieve.
- target: $['paths']['/v2/vendors/{vendor_id}']['put']
  update:
    description: Updates an existing [Vendor](https://developer.squareup.com/reference/square_2024-05-15/objects/Vendor) object as a supplier to a seller.
- target: $['paths']['/v2/webhooks/subscriptions']['get']['parameters'][?(@.name == 'include_disabled' && @.in == 'query')]
  update:
    description: 'Includes disabled [Subscription](https://developer.squareup.com/reference/square_2024-05-15/objects/WebhookSubscription)s.

      By default, all enabled [Subscription](https://developer.squareup.com/reference/square_2024-05-15/objects/WebhookSubscription)s are returned.'
- target: $['paths']['/v2/webhooks/subscriptions']['get']['parameters'][?(@.name == 'sort_order' && @.in == 'query')]
  update:
    description: 'Sorts the returned list by when the [Subscription](https://developer.squareup.com/reference/square_2024-05-15/objects/WebhookSubscription) was created with the specified order.

      This field defaults to ASC.'
- target: $['paths']['/v2/webhooks/subscriptions/{subscription_id}']['delete']['parameters'][?(@.name == 'subscription_id' && @.in == 'path')]
  update:
    description: '[REQUIRED] The ID of the [Subscription](https://developer.squareup.com/reference/square_2024-05-15/objects/WebhookSubscription) to delete.'
- target: $['paths']['/v2/webhooks/subscriptions/{subscription_id}']['get']['parameters'][?(@.name == 'subscription_id' && @.in == 'path')]
  update:
    description: '[REQUIRED] The ID of the [Subscription](https://developer.squareup.com/reference/square_2024-05-15/objects/WebhookSubscription) to retrieve.'
- target: $['paths']['/v2/webhooks/subscriptions/{subscription_id}']['put']['parameters'][?(@.name == 'subscription_id' && @.in == 'path')]
  update:
    description: '[REQUIRED] The ID of the [Subscription](https://developer.squareup.com/reference/square_2024-05-15/objects/WebhookSubscription) to update.'
- target: $['paths']['/v2/webhooks/subscriptions/{subscription_id}/signature-key']['post']['parameters'][?(@.name == 'subscription_id' && @.in == 'path')]
  update:
    description: '[REQUIRED] The ID of the [Subscription](https://developer.squareup.com/reference/square_2024-05-15/objects/WebhookSubscription) to update.'
- target: $['paths']['/v2/webhooks/subscriptions/{subscription_id}/test']['post']['parameters'][?(@.name == 'subscription_id' && @.in == 'path')]
  update:
    description: '[REQUIRED] The ID of the [Subscription](https://developer.squareup.com/reference/square_2024-05-15/objects/WebhookSubscription) to test.'
