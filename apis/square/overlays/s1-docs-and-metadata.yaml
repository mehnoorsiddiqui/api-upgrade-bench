- target: $['components']['schemas']['LoyaltyProgram']['properties']['accrual_rules']
  update:
    description: 'Defines how buyers can earn loyalty points from the base loyalty program.

      To check for associated [loyalty promotions](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyPromotion) that enable

      buyers to earn extra points, call [ListLoyaltyPromotions](https://developer.squareup.com/reference/square_2024-05-15/loyalty-api/list-loyalty-promotions).'
- target: $['components']['schemas']['LoyaltyProgramAccrualRule']
  update:
    description: Represents an accrual rule, which defines how buyers can earn points from the base [loyalty program](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyProgram).
- target: $['components']['schemas']['LoyaltyProgramAccrualRuleCategoryData']['properties']['category_id']
  update:
    description: 'The ID of the `CATEGORY` [catalog object](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) that buyers can purchase to earn

      points.'
- target: $['components']['schemas']['LoyaltyProgramAccrualRuleItemVariationData']['properties']['item_variation_id']
  update:
    description: 'The ID of the `ITEM_VARIATION` [catalog object](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) that buyers can purchase to earn

      points.'
- target: $['components']['schemas']['LoyaltyProgramAccrualRuleSpendData']['properties']['excluded_category_ids']
  update:
    description: 'The IDs of any `CATEGORY` catalog objects that are excluded from points accrual.


      You can use the [BatchRetrieveCatalogObjects](https://developer.squareup.com/reference/square_2024-05-15/catalog-api/batch-retrieve-catalog-objects)

      endpoint to retrieve information about the excluded categories.'
- target: $['components']['schemas']['LoyaltyProgramAccrualRuleSpendData']['properties']['excluded_item_variation_ids']
  update:
    description: 'The IDs of any `ITEM_VARIATION` catalog objects that are excluded from points accrual.


      You can use the [BatchRetrieveCatalogObjects](https://developer.squareup.com/reference/square_2024-05-15/catalog-api/batch-retrieve-catalog-objects)

      endpoint to retrieve information about the excluded item variations.'
- target: $['components']['schemas']['LoyaltyProgramRewardTier']['properties']['pricing_rule_reference']
  update:
    description: 'A reference to the specific version of a `PRICING_RULE` catalog object that contains information about the reward tier discount.


      Use `object_id` and `catalog_version` with the [RetrieveCatalogObject](https://developer.squareup.com/reference/square_2024-05-15/catalog-api/retrieve-catalog-object) endpoint

      to get discount details. Make sure to set `include_related_objects` to true in the request to retrieve all catalog objects

      that define the discount. For more information, see [Getting discount details for a reward tier](https://developer.squareup.com/docs/loyalty-api/loyalty-rewards#get-discount-details).'
- target: $['components']['schemas']['LoyaltyPromotion']['properties']['loyalty_program_id']
  update:
    description: The ID of the [loyalty program](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyProgram) associated with the promotion.
- target: $['components']['schemas']['LoyaltyPromotion']['properties']['qualifying_item_variation_ids']
  update:
    description: 'The IDs of any qualifying `ITEM_VARIATION` [catalog objects](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject). If specified,

      the purchase must include at least one of these items to qualify for the promotion.


      This option is valid only if the base loyalty program uses a `VISIT` or `SPEND` accrual rule.

      With `SPEND` accrual rules, make sure that qualifying promotional items are not excluded.


      You can specify `qualifying_item_variation_ids` or `qualifying_category_ids` for a given promotion, but not both.'
- target: $['components']['schemas']['LoyaltyPromotion']['properties']['qualifying_category_ids']
  update:
    description: 'The IDs of any qualifying `CATEGORY` [catalog objects](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject). If specified,

      the purchase must include at least one item from one of these categories to qualify for the promotion.


      This option is valid only if the base loyalty program uses a `VISIT` or `SPEND` accrual rule.

      With `SPEND` accrual rules, make sure that qualifying promotional items are not excluded.


      You can specify `qualifying_category_ids` or `qualifying_item_variation_ids` for a promotion, but not both.'
- target: $['components']['schemas']['LoyaltyPromotion']
  update:
    description: 'Represents a promotion for a [loyalty program](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyProgram). Loyalty promotions enable buyers

      to earn extra points on top of those earned from the base program.


      A loyalty program can have a maximum of 10 loyalty promotions with an `ACTIVE` or `SCHEDULED` status.'
- target: $['components']['schemas']['LoyaltyPromotionAvailableTimeData']
  update:
    description: 'Represents scheduling information that determines when purchases can qualify to earn points

      from a [loyalty promotion](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyPromotion).'
- target: $['components']['schemas']['LoyaltyPromotionIncentive']
  update:
    description: 'Represents how points for a [loyalty promotion](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyPromotion) are calculated,

      either by multiplying the points earned from the base program or by adding a specified number

      of points to the points earned from the base program.'
- target: $['components']['schemas']['LoyaltyPromotionIncentivePointsAdditionData']
  update:
    description: Represents the metadata for a `POINTS_ADDITION` type of [loyalty promotion incentive](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyPromotionIncentive).
- target: $['components']['schemas']['LoyaltyPromotionIncentivePointsMultiplierData']
  update:
    description: Represents the metadata for a `POINTS_MULTIPLIER` type of [loyalty promotion incentive](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyPromotionIncentive).
- target: $['components']['schemas']['LoyaltyPromotionTriggerLimit']
  update:
    description: 'Represents the number of times a buyer can earn points during a [loyalty promotion](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyPromotion).

      If this field is not set, buyers can trigger the promotion an unlimited number of times to earn points during

      the time that the promotion is available.


      A purchase that is disqualified from earning points because of this limit might qualify for another active promotion.'
- target: $['components']['schemas']['LoyaltyReward']['properties']['loyalty_account_id']
  update:
    description: The Square-assigned ID of the [loyalty account](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyAccount) to which the reward belongs.
- target: $['components']['schemas']['LoyaltyReward']['properties']['reward_tier_id']
  update:
    description: The Square-assigned ID of the [reward tier](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyProgramRewardTier) used to create the reward.
- target: $['components']['schemas']['LoyaltyReward']['properties']['order_id']
  update:
    description: The Square-assigned ID of the [order](https://developer.squareup.com/reference/square_2024-05-15/objects/Order) to which the reward is attached.
- target: $['components']['schemas']['LoyaltyReward']
  update:
    description: "Represents a contract to redeem loyalty points for a [reward tier](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyProgramRewardTier) discount. Loyalty rewards can be in an ISSUED, REDEEMED, or DELETED state. \nFor more information, see [Manage loyalty rewards](https://developer.squareup.com/docs/loyalty-api/loyalty-rewards)."
- target: $['components']['schemas']['Money']['properties']['currency']
  update:
    description: 'The type of currency, in __ISO 4217 format__. For example, the currency

      code for US dollars is `USD`.


      See [Currency](https://developer.squareup.com/reference/square_2024-05-15/enums/Currency) for possible values.'
- target: $['components']['schemas']['Order']['properties']['customer_id']
  update:
    description: 'The ID of the [customer](https://developer.squareup.com/reference/square_2024-05-15/objects/Customer) associated with the order.


      You should specify a `customer_id` on the order (or the payment) to ensure that transactions

      are reliably linked to customers. Omitting this field might result in the creation of new

      [instant profiles](https://developer.squareup.com/docs/customers-api/what-it-does#instant-profiles).'
- target: $['components']['schemas']['Order']['properties']['closed_at']
  update:
    description: The timestamp for when the order reached a terminal [state](https://developer.squareup.com/reference/square_2024-05-15/enums/OrderState), in RFC 3339 format (for example "2016-09-04T23:59:33.123Z").
- target: $['components']['schemas']['Order']['properties']['pricing_options']
  update:
    description: 'Pricing options for an order. The options affect how the order''s price is calculated.

      They can be used, for example, to apply automatic price adjustments that are based on

      preconfigured [pricing rules](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogPricingRule).'
- target: $['components']['schemas']['OrderEntry']
  update:
    description: 'A lightweight description of an [order](https://developer.squareup.com/reference/square_2024-05-15/objects/Order) that is returned when

      `returned_entries` is `true` on a [SearchOrdersRequest](https://developer.squareup.com/reference/square_2024-05-15/orders-api/search-orders).'
- target: $['components']['schemas']['OrderLineItem']['properties']['catalog_object_id']
  update:
    description: The [CatalogItemVariation](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItemVariation) ID applied to this line item.
- target: $['components']['schemas']['OrderLineItem']['properties']['modifiers']
  update:
    description: The [CatalogModifier](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogModifier)s applied to this line item.
- target: $['components']['schemas']['OrderLineItemDiscount']['properties']['catalog_object_id']
  update:
    description: The catalog object ID referencing [CatalogDiscount](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogDiscount).
- target: $['components']['schemas']['OrderLineItemDiscount']['properties']['pricing_rule_id']
  update:
    description: 'The object ID of a [pricing rule](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogPricingRule) to be applied

      automatically to this discount. The specification and application of the discounts, to

      which a `pricing_rule_id` is assigned, are completely controlled by the corresponding

      pricing rule.'
- target: $['components']['schemas']['OrderLineItemModifier']['properties']['catalog_object_id']
  update:
    description: The catalog object ID referencing [CatalogModifier](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogModifier).
- target: $['components']['schemas']['OrderLineItemModifier']['properties']['base_price_money']
  update:
    description: 'The base price for the modifier.


      `base_price_money` is required for ad hoc modifiers.

      If both `catalog_object_id` and `base_price_money` are set, `base_price_money` will

      override the predefined [CatalogModifier](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogModifier) price.'
- target: $['components']['schemas']['OrderLineItemModifier']
  update:
    description: A [CatalogModifier](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogModifier).
- target: $['components']['schemas']['OrderLineItemTax']['properties']['catalog_object_id']
  update:
    description: The catalog object ID referencing [CatalogTax](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogTax).
- target: $['components']['schemas']['OrderPricingOptions']
  update:
    description: 'Pricing options for an order. The options affect how the order''s price is calculated.

      They can be used, for example, to apply automatic price adjustments that are based on preconfigured

      [pricing rules](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogPricingRule).'
- target: $['components']['schemas']['OrderQuantityUnit']['properties']['measurement_unit']
  update:
    description: 'A [MeasurementUnit](https://developer.squareup.com/reference/square_2024-05-15/objects/MeasurementUnit) that represents the

      unit of measure for the quantity.'
- target: $['components']['schemas']['OrderQuantityUnit']['properties']['catalog_object_id']
  update:
    description: 'The catalog object ID referencing the

      [CatalogMeasurementUnit](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogMeasurementUnit).


      This field is set when this is a catalog-backed measurement unit.'
- target: $['components']['schemas']['OrderReturnDiscount']['properties']['catalog_object_id']
  update:
    description: The catalog object ID referencing [CatalogDiscount](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogDiscount).
- target: $['components']['schemas']['OrderReturnLineItem']['properties']['catalog_object_id']
  update:
    description: The [CatalogItemVariation](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItemVariation) ID applied to this return line item.
- target: $['components']['schemas']['OrderReturnLineItem']['properties']['return_modifiers']
  update:
    description: The [CatalogModifier](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogModifier)s applied to this line item.
- target: $['components']['schemas']['OrderReturnLineItemModifier']['properties']['catalog_object_id']
  update:
    description: The catalog object ID referencing [CatalogModifier](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogModifier).
- target: $['components']['schemas']['OrderReturnLineItemModifier']['properties']['base_price_money']
  update:
    description: 'The base price for the modifier.


      `base_price_money` is required for ad hoc modifiers.

      If both `catalog_object_id` and `base_price_money` are set, `base_price_money` overrides the predefined [CatalogModifier](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogModifier) price.'
- target: $['components']['schemas']['OrderReturnServiceCharge']['properties']['catalog_object_id']
  update:
    description: The catalog object ID of the associated [OrderServiceCharge](https://developer.squareup.com/reference/square_2024-05-15/objects/OrderServiceCharge).
- target: $['components']['schemas']['OrderReturnTax']['properties']['catalog_object_id']
  update:
    description: The catalog object ID referencing [CatalogTax](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogTax).
- target: $['components']['schemas']['OrderServiceCharge']['properties']['catalog_object_id']
  update:
    description: The catalog object ID referencing the service charge [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject).
- target: $['components']['schemas']['PauseSubscriptionRequest']
  update:
    description: 'Defines input parameters in a request to the

      [PauseSubscription](https://developer.squareup.com/reference/square_2024-05-15/subscriptions-api/pause-subscription) endpoint.'
- target: $['components']['schemas']['PauseSubscriptionResponse']
  update:
    description: 'Defines output parameters in a response from the

      [PauseSubscription](https://developer.squareup.com/reference/square_2024-05-15/subscriptions-api/pause-subscription) endpoint.'
- target: $['components']['schemas']['PayOrderRequest']['properties']['payment_ids']
  update:
    description: 'The IDs of the [payments](https://developer.squareup.com/reference/square_2024-05-15/objects/Payment) to collect.

      The payment total must match the order total.'
- target: $['components']['schemas']['PayOrderRequest']
  update:
    description: 'Defines the fields that are included in requests to the

      [PayOrder](https://developer.squareup.com/reference/square_2024-05-15/orders-api/pay-order) endpoint.'
- target: $['components']['schemas']['PayOrderResponse']['properties']['order']
  update:
    description: The paid, updated [order](https://developer.squareup.com/reference/square_2024-05-15/objects/Order).
- target: $['components']['schemas']['PayOrderResponse']
  update:
    description: 'Defines the fields that are included in the response body of a request to the

      [PayOrder](https://developer.squareup.com/reference/square_2024-05-15/orders-api/pay-order) endpoint.'
- target: $['components']['schemas']['Payment']['properties']['approved_money']
  update:
    description: 'The amount of money approved for this payment. This value may change if Square chooses to

      obtain reauthorization as part of a call to [UpdatePayment](https://developer.squareup.com/reference/square_2024-05-15/payments-api/update-payment).'
- target: $['components']['schemas']['Payment']['properties']['team_member_id']
  update:
    description: An optional ID of the [TeamMember](https://developer.squareup.com/reference/square_2024-05-15/objects/TeamMember) associated with taking the payment.
- target: $['components']['schemas']['PublishInvoiceRequest']['properties']['version']
  update:
    description: 'The version of the [invoice](https://developer.squareup.com/reference/square_2024-05-15/objects/Invoice) to publish.

      This must match the current version of the invoice; otherwise, the request is rejected.'
- target: $['components']['schemas']['RedeemLoyaltyRewardRequest']['properties']['location_id']
  update:
    description: The ID of the [location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location) where the reward is redeemed.
- target: $['components']['schemas']['RefundPaymentRequest']['properties']['customer_id']
  update:
    description: 'The [Customer](https://developer.squareup.com/reference/square_2024-05-15/objects/Customer) ID of the customer associated with the refund.

      This is required if the `destination_id` refers to a card on file created using the Cards

      API. Only allowed when `unlinked=true`.'
- target: $['components']['schemas']['RefundPaymentRequest']['properties']['team_member_id']
  update:
    description: An optional [TeamMember](https://developer.squareup.com/reference/square_2024-05-15/objects/TeamMember) ID to associate with this refund.
- target: $['components']['schemas']['RefundPaymentRequest']
  update:
    description: Describes a request to refund a payment using [RefundPayment](https://developer.squareup.com/reference/square_2024-05-15/refunds-api/refund-payment).
- target: $['components']['schemas']['RefundPaymentResponse']
  update:
    description: 'Defines the response returned by

      [RefundPayment](https://developer.squareup.com/reference/square_2024-05-15/refunds-api/refund-payment).


      If there are errors processing the request, the `refund` field might not be

      present, or it might be present with a status of `FAILED`.'
- target: $['components']['schemas']['RegisterDomainRequest']
  update:
    description: 'Defines the parameters that can be included in the body of

      a request to the [RegisterDomain](https://developer.squareup.com/reference/square_2024-05-15/apple-pay-api/register-domain) endpoint.'
- target: $['components']['schemas']['RegisterDomainResponse']['properties']['status']
  update:
    description: 'The status of the domain registration.


      See [RegisterDomainResponseStatus](https://developer.squareup.com/reference/square_2024-05-15/enums/RegisterDomainResponseStatus) for possible values.'
- target: $['components']['schemas']['RegisterDomainResponse']
  update:
    description: 'Defines the fields that are included in the response body of

      a request to the [RegisterDomain](https://developer.squareup.com/reference/square_2024-05-15/apple-pay-api/register-domain) endpoint.


      Either `errors` or `status` are present in a given response (never both).'
- target: $['components']['schemas']['RemoveGroupFromCustomerRequest']
  update:
    description: 'Defines the fields that are included in the request body of

      a request to the [RemoveGroupFromCustomer](https://developer.squareup.com/reference/square_2024-05-15/customers-api/remove-group-from-customer) endpoint.'
- target: $['components']['schemas']['RemoveGroupFromCustomerResponse']
  update:
    description: 'Defines the fields that are included in the response body of

      a request to the [RemoveGroupFromCustomer](https://developer.squareup.com/reference/square_2024-05-15/customers-api/remove-group-from-customer)

      endpoint.'
- target: $['components']['schemas']['ResumeSubscriptionRequest']
  update:
    description: 'Defines input parameters in a request to the

      [ResumeSubscription](https://developer.squareup.com/reference/square_2024-05-15/subscriptions-api/resume-subscription) endpoint.'
- target: $['components']['schemas']['ResumeSubscriptionResponse']
  update:
    description: "Defines output parameters in a response from the \n[ResumeSubscription](https://developer.squareup.com/reference/square_2024-05-15/subscriptions-api/resume-subscription) endpoint."
- target: $['components']['schemas']['RetrieveBookingCustomAttributeDefinitionRequest']
  update:
    description: Represents a [RetrieveBookingCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/booking-custom-attributes-api/retrieve-booking-custom-attribute-definition) request.
- target: $['components']['schemas']['RetrieveBookingCustomAttributeDefinitionResponse']
  update:
    description: 'Represents a [RetrieveBookingCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/booking-custom-attributes-api/retrieve-booking-custom-attribute-definition) response.

      Either `custom_attribute_definition` or `errors` is present in the response.'
- target: $['components']['schemas']['RetrieveBookingCustomAttributeRequest']['properties']['with_definition']
  update:
    description: 'Indicates whether to return the [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) in the `definition` field of

      the custom attribute. Set this parameter to `true` to get the name and description of the custom

      attribute, information about the data type, or other definition details. The default value is `false`.'
- target: $['components']['schemas']['RetrieveBookingCustomAttributeRequest']
  update:
    description: Represents a [RetrieveBookingCustomAttribute](https://developer.squareup.com/reference/square_2024-05-15/booking-custom-attributes-api/retrieve-booking-custom-attribute) request.
- target: $['components']['schemas']['RetrieveBookingCustomAttributeResponse']
  update:
    description: 'Represents a [RetrieveBookingCustomAttribute](https://developer.squareup.com/reference/square_2024-05-15/booking-custom-attributes-api/retrieve-booking-custom-attribute) response.

      Either `custom_attribute_definition` or `errors` is present in the response.'
- target: $['components']['schemas']['RetrieveCardResponse']
  update:
    description: 'Defines the fields that are included in the response body of

      a request to the [RetrieveCard](https://developer.squareup.com/reference/square_2024-05-15/cards-api/retrieve-card) endpoint.


      Note: if there are errors processing the request, the card field will not be

      present.'
- target: $['components']['schemas']['RetrieveCatalogObjectRequest']['properties']['catalog_version']
  update:
    description: 'Requests objects as of a specific version of the catalog. This allows you to retrieve historical

      versions of objects. The value to retrieve a specific version of an object can be found

      in the version field of [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject)s. If not included, results will

      be from the current version of the catalog.'
- target: $['components']['schemas']['RetrieveCustomerCustomAttributeDefinitionRequest']
  update:
    description: Represents a [RetrieveCustomerCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/customer-custom-attributes-api/retrieve-customer-custom-attributeDefinition) request.
- target: $['components']['schemas']['RetrieveCustomerCustomAttributeDefinitionResponse']
  update:
    description: 'Represents a [RetrieveCustomerCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/customer-custom-attributes-api/retrieve-customer-custom-attributeDefinition) response.

      Either `custom_attribute_definition` or `errors` is present in the response.'
- target: $['components']['schemas']['RetrieveCustomerCustomAttributeRequest']['properties']['with_definition']
  update:
    description: 'Indicates whether to return the [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) in the `definition` field of

      the custom attribute. Set this parameter to `true` to get the name and description of the custom

      attribute, information about the data type, or other definition details. The default value is `false`.'
- target: $['components']['schemas']['RetrieveCustomerCustomAttributeRequest']
  update:
    description: Represents a [RetrieveCustomerCustomAttribute](https://developer.squareup.com/reference/square_2024-05-15/customer-custom-attributes-api/retrieve-customer-custom-attribute) request.
- target: $['components']['schemas']['RetrieveCustomerCustomAttributeResponse']
  update:
    description: 'Represents a [RetrieveCustomerCustomAttribute](https://developer.squareup.com/reference/square_2024-05-15/customer-custom-attributes-api/retrieve-customer-custom-attribute) response.

      Either `custom_attribute_definition` or `errors` is present in the response.'
- target: $['components']['schemas']['RetrieveCustomerGroupRequest']
  update:
    description: 'Defines the fields that can be included in a request to the

      [RetrieveCustomerGroup](https://developer.squareup.com/reference/square_2024-05-15/customer-groups-api/retrieve-customer-group) endpoint.'
- target: $['components']['schemas']['RetrieveCustomerGroupResponse']
  update:
    description: 'Defines the fields that are included in the response body of

      a request to the [RetrieveCustomerGroup](https://developer.squareup.com/reference/square_2024-05-15/customer-groups-api/retrieve-customer-group) endpoint.


      Either `errors` or `group` is present in a given response (never both).'
- target: $['components']['schemas']['RetrieveInventoryAdjustmentResponse']['properties']['adjustment']
  update:
    description: The requested [InventoryAdjustment](https://developer.squareup.com/reference/square_2024-05-15/objects/InventoryAdjustment).
- target: $['components']['schemas']['RetrieveInventoryChangesRequest']['properties']['location_ids']
  update:
    description: 'The [Location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location) IDs to look up as a comma-separated

      list. An empty list queries all locations.'
- target: $['components']['schemas']['RetrieveInventoryCountRequest']['properties']['location_ids']
  update:
    description: 'The [Location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location) IDs to look up as a comma-separated

      list. An empty list queries all locations.'
- target: $['components']['schemas']['RetrieveInventoryPhysicalCountResponse']['properties']['count']
  update:
    description: The requested [InventoryPhysicalCount](https://developer.squareup.com/reference/square_2024-05-15/objects/InventoryPhysicalCount).
- target: $['components']['schemas']['RetrieveInventoryTransferResponse']['properties']['transfer']
  update:
    description: The requested [InventoryTransfer](https://developer.squareup.com/reference/square_2024-05-15/objects/InventoryTransfer).
- target: $['components']['schemas']['RetrieveLocationCustomAttributeDefinitionRequest']
  update:
    description: Represents a [RetrieveLocationCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/location-custom-attributes-api/retrieve-location-custom-attributeDefinition) request.
- target: $['components']['schemas']['RetrieveLocationCustomAttributeDefinitionResponse']
  update:
    description: 'Represents a [RetrieveLocationCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/location-custom-attributes-api/retrieve-location-custom-attributeDefinition) response.

