  update:
    description: 'Represents a [BulkUpsertMerchantCustomAttributes](https://developer.squareup.com/reference/square_2024-05-15/merchant-custom-attributes-api/bulk-upsert-merchant-custom-attributes) response,

      which contains a map of responses that each corresponds to an individual upsert request.'
- target: $['components']['schemas']['BulkUpsertMerchantCustomAttributesResponseMerchantCustomAttributeUpsertResponse']
  update:
    description: Represents a response for an individual upsert request in a [BulkUpsertMerchantCustomAttributes](https://developer.squareup.com/reference/square_2024-05-15/merchant-custom-attributes-api/bulk-upsert-merchant-custom-attributes) operation.
- target: $['components']['schemas']['BulkUpsertOrderCustomAttributesRequestUpsertCustomAttribute']['properties']['order_id']
  update:
    description: The ID of the target [order](https://developer.squareup.com/reference/square_2024-05-15/objects/Order).
- target: $['components']['schemas']['CalculateLoyaltyPointsRequest']['properties']['order_id']
  update:
    description: 'The [order](https://developer.squareup.com/reference/square_2024-05-15/objects/Order) ID for which to calculate the points.

      Specify this field if your application uses the Orders API to process orders.

      Otherwise, specify the `transaction_amount_money`.'
- target: $['components']['schemas']['CalculateLoyaltyPointsRequest']['properties']['loyalty_account_id']
  update:
    description: 'The ID of the target [loyalty account](https://developer.squareup.com/reference/square_2024-05-15/objects/LoyaltyAccount). Optionally specify this field

      if your application uses the Orders API to process orders.


      If specified, the `promotion_points` field in the response shows the number of points the buyer would

      earn from the purchase. In this case, Square uses the account ID to determine whether the promotion''s

      `trigger_limit` (the maximum number of times that a buyer can trigger the promotion) has been reached.

      If not specified, the `promotion_points` field shows the number of points the purchase qualifies

      for regardless of the trigger limit.'
- target: $['components']['schemas']['CalculateLoyaltyPointsRequest']
  update:
    description: Represents a [CalculateLoyaltyPoints](https://developer.squareup.com/reference/square_2024-05-15/loyalty-api/calculate-loyalty-points) request.
- target: $['components']['schemas']['CalculateLoyaltyPointsResponse']
  update:
    description: Represents a [CalculateLoyaltyPoints](https://developer.squareup.com/reference/square_2024-05-15/loyalty-api/calculate-loyalty-points) response.
- target: $['components']['schemas']['CancelInvoiceRequest']['properties']['version']
  update:
    description: "The version of the [invoice](https://developer.squareup.com/reference/square_2024-05-15/objects/Invoice) to cancel.\nIf you do not know the version, you can call \n[GetInvoice](https://developer.squareup.com/reference/square_2024-05-15/invoices-api/get-invoice) or [ListInvoices](https://developer.squareup.com/reference/square_2024-05-15/invoices-api/list-invoices)."
- target: $['components']['schemas']['CancelLoyaltyPromotionRequest']
  update:
    description: Represents a [CancelLoyaltyPromotion](https://developer.squareup.com/reference/square_2024-05-15/loyalty-api/cancel-loyalty-promotion) request.
- target: $['components']['schemas']['CancelLoyaltyPromotionResponse']
  update:
    description: 'Represents a [CancelLoyaltyPromotion](https://developer.squareup.com/reference/square_2024-05-15/loyalty-api/cancel-loyalty-promotion) response.

      Either `loyalty_promotion` or `errors` is present in the response.'
- target: $['components']['schemas']['CancelPaymentByIdempotencyKeyRequest']
  update:
    description: "Describes a request to cancel a payment using \n[CancelPaymentByIdempotencyKey](https://developer.squareup.com/reference/square_2024-05-15/payments-api/cancel-payment-by-idempotency-key)."
- target: $['components']['schemas']['CancelPaymentByIdempotencyKeyResponse']
  update:
    description: "Defines the response returned by \n[CancelPaymentByIdempotencyKey](https://developer.squareup.com/reference/square_2024-05-15/payments-api/cancel-payment-by-idempotency-key).\nOn success, `errors` is empty."
- target: $['components']['schemas']['CancelPaymentRequest']
  update:
    description: 'Describes the request to cancel (void) a payment using

      [CancelPayment](https://developer.squareup.com/reference/square_2024-05-15/payments-api/cancel-payment).

      You can only cancel a payment that is approved (not completed).

      For more information, see

      [Delayed capture of a payment](https://developer.squareup.com/docs/payments-api/take-payments/card-payments#delayed-capture-of-a-card-payment).'
- target: $['components']['schemas']['CancelPaymentResponse']
  update:
    description: Defines the response returned by [CancelPayment](https://developer.squareup.com/reference/square_2024-05-15/payments-api/cancel-payment).
- target: $['components']['schemas']['CancelSubscriptionRequest']
  update:
    description: "Defines input parameters in a request to the \n[CancelSubscription](https://developer.squareup.com/reference/square_2024-05-15/subscriptions-api/cancel-subscription) endpoint."
- target: $['components']['schemas']['CancelSubscriptionResponse']
  update:
    description: "Defines output parameters in a response from the \n[CancelSubscription](https://developer.squareup.com/reference/square_2024-05-15/subscriptions-api/cancel-subscription) endpoint."
- target: $['components']['schemas']['CaptureTransactionResponse']
  update:
    description: 'Defines the fields that are included in the response body of

      a request to the [CaptureTransaction](https://developer.squareup.com/reference/square_2024-05-15/transactions-api/capture-transaction) endpoint.'
- target: $['components']['schemas']['CashAppDetails']['properties']['buyer_country_code']
  update:
    description: 'The country of the Cash App account holder, in ISO 3166-1-alpha-2 format.


      For possible values, see [Country](https://developer.squareup.com/reference/square_2024-05-15/enums/Country).'
- target: $['components']['schemas']['CatalogCustomAttributeValue']['properties']['custom_attribute_definition_id']
  update:
    description: The id of the [CatalogCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogCustomAttributeDefinition) this value belongs to.
- target: $['components']['schemas']['CatalogIdMapping']
  update:
    description: 'A mapping between a temporary client-supplied ID and a permanent server-generated ID.


      When calling [UpsertCatalogObject](https://developer.squareup.com/reference/square_2024-05-15/catalog-api/upsert-catalog-object) or

      [BatchUpsertCatalogObjects](https://developer.squareup.com/reference/square_2024-05-15/catalog-api/batch-upsert-catalog-objects) to

      create a [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) instance, you can supply

      a temporary ID for the to-be-created object, especially when the object is to be referenced

      elsewhere in the same request body. This temporary ID can be any string unique within

      the call, but must be prefixed by "#".


      After the request is submitted and the object created, a permanent server-generated ID is assigned

      to the new object. The permanent ID is unique across the Square catalog.'
- target: $['components']['schemas']['CatalogImage']['properties']['name']
  update:
    description: 'The internal name to identify this image in calls to the Square API.

      This is a searchable attribute for use in applicable query filters

      using the [SearchCatalogObjects](https://developer.squareup.com/reference/square_2024-05-15/catalog-api/search-catalog-objects).

      It is not unique and should not be shown in a buyer facing context.'
- target: $['components']['schemas']['CatalogImage']['properties']['url']
  update:
    description: 'The URL of this image, generated by Square after an image is uploaded

      using the [CreateCatalogImage](https://developer.squareup.com/reference/square_2024-05-15/catalog-api/create-catalog-image) endpoint.

      To modify the image, use the UpdateCatalogImage endpoint. Do not change the URL field.'
- target: $['components']['schemas']['CatalogImage']['properties']['caption']
  update:
    description: 'A caption that describes what is shown in the image. Displayed in the

      Square Online Store. This is a searchable attribute for use in applicable query filters

      using the [SearchCatalogObjects](https://developer.squareup.com/reference/square_2024-05-15/catalog-api/search-catalog-objects).'
- target: $['components']['schemas']['CatalogItem']['properties']['description']
  update:
    description: 'The item''s description. This is a searchable attribute for use in applicable query filters, and its value length is of Unicode code points.


      Deprecated at 2022-07-20, this field is planned to retire in 6 months. You should migrate to use `description_html` to set the description

      of the [CatalogItem](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItem) instance.  The `description` and `description_html` field values are kept in sync. If you try to

      set the both fields, the `description_html` text value overwrites the `description` value. Updates in one field are also reflected in the other,

      except for when you use an early version before Square API 2022-07-20 and `description_html` is set to blank, setting the `description` value to null

      does not nullify `description_html`.'
- target: $['components']['schemas']['CatalogItem']['properties']['variations']
  update:
    description: 'A list of [CatalogItemVariation](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItemVariation) objects for this item. An item must have

      at least one variation.'
- target: $['components']['schemas']['CatalogItem']
  update:
    description: A [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) instance of the `ITEM` type, also referred to as an item, in the catalog.
- target: $['components']['schemas']['CatalogItemVariation']['properties']['name']
  update:
    description: 'The item variation''s name. This is a searchable attribute for use in applicable query filters.


      Its value has a maximum length of 255 Unicode code points. However, when the parent [item](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItem)

      uses [item options](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItemOption), this attribute is auto-generated, read-only, and can be

      longer than 255 Unicode code points.'
- target: $['components']['schemas']['CatalogItemVariation']['properties']['stockable_conversion']
  update:
    description: 'The unit conversion rule, as prescribed by the [CatalogStockConversion](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogStockConversion) type,

      that describes how this non-stockable (i.e., sellable/receivable) item variation is converted

      to/from the stockable item variation sharing the same parent item. With the stock conversion,

      you can accurately track inventory when an item variation is sold in one unit, but stocked in

      another unit.'
- target: $['components']['schemas']['CatalogItemVariation']
  update:
    description: 'An item variation, representing a product for sale, in the Catalog object model. Each [item](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItem) must have at least one

      item variation and can have at most 250 item variations.


      An item variation can be sellable, stockable, or both if it has a unit of measure for its count for the sold number of the variation, the stocked

      number of the variation, or both. For example, when a variation representing wine is stocked and sold by the bottle, the variation is both

      stockable and sellable. But when a variation of the wine is sold by the glass, the sold units cannot be used as a measure of the stocked units. This by-the-glass

      variation is sellable, but not stockable. To accurately keep track of the wine''s inventory count at any time, the sellable count must be

      converted to stockable count. Typically, the seller defines this unit conversion. For example, 1 bottle equals 5 glasses. The Square API exposes

      the `stockable_conversion` property on the variation to specify the conversion. Thus, when two glasses of the wine are sold, the sellable count

      decreases by 2, and the stockable count automatically decreases by 0.4 bottle according to the conversion.'
- target: $['components']['schemas']['CatalogObject']['properties']['custom_attribute_values']
  update:
    description: 'A map (key-value pairs) of application-defined custom attribute values. The value of a key-value pair

      is a [CatalogCustomAttributeValue](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogCustomAttributeValue) object. The key is the `key` attribute

      value defined in the associated [CatalogCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogCustomAttributeDefinition)

      object defined by the application making the request.


      If the `CatalogCustomAttributeDefinition` object is

      defined by another application, the `CatalogCustomAttributeDefinition`''s key attribute value is prefixed by

      the defining application ID. For example, if the `CatalogCustomAttributeDefinition` has a `key` attribute of

      `"cocoa_brand"` and the defining application ID is `"abcd1234"`, the key in the map is `"abcd1234:cocoa_brand"`

      if the application making the request is different from the application defining the custom attribute definition.

      Otherwise, the key used in the map is simply `"cocoa_brand"`.


      Application-defined custom attributes are set at a global (location-independent) level.

      Custom attribute values are intended to store additional information about a catalog object

      or associations with an entity in another system. Do not use custom attributes

      to store any sensitive information (personally identifiable information, card details, etc.).'
- target: $['components']['schemas']['CatalogQuery']['properties']['item_variations_for_item_option_values_query']
  update:
    description: 'A query expression to return item variations (of the [CatalogItemVariation](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItemVariation) type) that

      contain all of the specified `CatalogItemOption` IDs.'
- target: $['components']['schemas']['CatalogQuery']
  update:
    description: 'A query composed of one or more different types of filters to narrow the scope of targeted objects when calling the `SearchCatalogObjects` endpoint.


      Although a query can have multiple filters, only certain query types can be combined per call to [SearchCatalogObjects](https://developer.squareup.com/reference/square_2024-05-15/catalog-api/search-catalog-objects).

      Any combination of the following types may be used together:

      - [exact_query](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogQueryExact)

      - [prefix_query](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogQueryPrefix)

      - [range_query](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogQueryRange)

      - [sorted_attribute_query](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogQuerySortedAttribute)

      - [text_query](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogQueryText)


      All other query types cannot be combined with any others.


      When a query filter is based on an attribute, the attribute must be searchable.

      Searchable attributes are listed as follows, along their parent types that can be searched for with applicable query filters.


      Searchable attribute and objects queryable by searchable attributes:

      - `name`:  `CatalogItem`, `CatalogItemVariation`, `CatalogCategory`, `CatalogTax`, `CatalogDiscount`, `CatalogModifier`, `CatalogModifierList`, `CatalogItemOption`, `CatalogItemOptionValue`

      - `description`: `CatalogItem`, `CatalogItemOptionValue`

      - `abbreviation`: `CatalogItem`

      - `upc`: `CatalogItemVariation`

      - `sku`: `CatalogItemVariation`

      - `caption`: `CatalogImage`

      - `display_name`: `CatalogItemOption`


      For example, to search for [CatalogItem](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItem) objects by searchable attributes, you can use

      the `"name"`, `"description"`, or `"abbreviation"` attribute in an applicable query filter.'
- target: $['components']['schemas']['CatalogStockConversion']['properties']['stockable_item_variation_id']
  update:
    description: 'References to the stockable [CatalogItemVariation](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItemVariation)

      for this stock conversion. Selling, receiving or recounting the non-stockable `CatalogItemVariation`

      defined with a stock conversion results in adjustments of this stockable `CatalogItemVariation`.

      This immutable field must reference a stockable `CatalogItemVariation`

      that shares the parent [CatalogItem](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItem) of the converted `CatalogItemVariation.`'
- target: $['components']['schemas']['CatalogStockConversion']['properties']['nonstockable_quantity']
  update:
    description: 'The converted equivalent quantity of the non-stockable [CatalogItemVariation](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItemVariation)

      in its measurement unit. The `stockable_quantity` value and this `nonstockable_quantity` value together

      define the conversion ratio between stockable item variation and the non-stockable item variation.

      It accepts a decimal number in a string format that can take up to 10 digits before the decimal point

      and up to 5 digits after the decimal point.'
- target: $['components']['schemas']['CatalogStockConversion']
  update:
    description: 'Represents the rule of conversion between a stockable [CatalogItemVariation](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItemVariation)

      and a non-stockable sell-by or receive-by `CatalogItemVariation` that

      share the same underlying stock.'
- target: $['components']['schemas']['CatalogSubscriptionPlan']['properties']['phases']
  update:
    description: 'A list of SubscriptionPhase containing the [SubscriptionPhase](https://developer.squareup.com/reference/square_2024-05-15/objects/SubscriptionPhase) for this plan.

      This field it required. Not including this field will throw a REQUIRED_FIELD_MISSING error'
- target: $['components']['schemas']['CatalogSubscriptionPlanVariation']['properties']['phases']
  update:
    description: A list containing each [SubscriptionPhase](https://developer.squareup.com/reference/square_2024-05-15/objects/SubscriptionPhase) for this plan variation.
- target: $['components']['schemas']['ChangeBillingAnchorDateRequest']
  update:
    description: 'Defines input parameters in a request to the

      [ChangeBillingAnchorDate](https://developer.squareup.com/reference/square_2024-05-15/subscriptions-api/change-billing-anchor-date) endpoint.'
- target: $['components']['schemas']['ChangeBillingAnchorDateResponse']
  update:
    description: 'Defines output parameters in a request to the

      [ChangeBillingAnchorDate](https://developer.squareup.com/reference/square_2024-05-15/subscriptions-api/change-billing-anchor-date) endpoint.'
- target: $['components']['schemas']['ChargeRequest']['properties']['delay_capture']
  update:
    description: 'If `true`, the request will only perform an Auth on the provided

      card. You can then later perform either a Capture (with the

      [CaptureTransaction](https://developer.squareup.com/reference/square_2024-05-15/transactions-api/capture-transaction) endpoint) or a Void

      (with the [VoidTransaction](https://developer.squareup.com/reference/square_2024-05-15/transactions-api/void-transaction) endpoint).


      Default value: `false`'
- target: $['components']['schemas']['ChargeRequest']
  update:
    description: 'Defines the parameters that can be included in the body of

      a request to the [Charge](https://developer.squareup.com/reference/square_2024-05-15/transactions-api/charge) endpoint.


      Deprecated - recommend using [CreatePayment](https://developer.squareup.com/reference/square_2024-05-15/payments-api/create-payment)'
- target: $['components']['schemas']['ChargeResponse']
  update:
    description: 'Defines the fields that are included in the response body of

      a request to the [Charge](https://developer.squareup.com/reference/square_2024-05-15/transactions-api/charge) endpoint.


      One of `errors` or `transaction` is present in a given response (never both).'
- target: $['components']['schemas']['CloneOrderRequest']
  update:
    description: 'Defines the fields that are included in requests to the

      [CloneOrder](https://developer.squareup.com/reference/square_2024-05-15/orders-api/clone-order) endpoint.'
- target: $['components']['schemas']['CloneOrderResponse']
  update:
    description: 'Defines the fields that are included in the response body of

      a request to the [CloneOrder](https://developer.squareup.com/reference/square_2024-05-15/orders-api/clone-order) endpoint.'
- target: $['components']['schemas']['CompletePaymentRequest']
  update:
    description: "Describes a request to complete (capture) a payment using \n[CompletePayment](https://developer.squareup.com/reference/square_2024-05-15/payments-api/complete-payment).\n\nBy default, payments are set to `autocomplete` immediately after they are created.\nTo complete payments manually, set `autocomplete` to `false`."
- target: $['components']['schemas']['CompletePaymentResponse']
  update:
    description: Defines the response returned by[CompletePayment](https://developer.squareup.com/reference/square_2024-05-15/payments-api/complete-payment).
- target: $['components']['schemas']['CreateBookingCustomAttributeDefinitionRequest']
  update:
    description: Represents a [CreateBookingCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/booking-custom-attributes-api/create-booking-custom-attribute-definition) request.
- target: $['components']['schemas']['CreateBookingCustomAttributeDefinitionResponse']
  update:
    description: 'Represents a [CreateBookingCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/booking-custom-attributes-api/create-booking-custom-attribute-definition) response.

      Either `custom_attribute_definition` or `errors` is present in the response.'
- target: $['components']['schemas']['CreateCardResponse']
  update:
    description: 'Defines the fields that are included in the response body of

