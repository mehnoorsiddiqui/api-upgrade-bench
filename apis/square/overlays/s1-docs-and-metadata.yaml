- target: $['components']['schemas']['BulkUpsertMerchantCustomAttributesRequest']
  update:
    description: Represents a [BulkUpsertMerchantCustomAttributes](https://developer.squareup.com/reference/square_2024-05-15/merchant-custom-attributes-api/bulk-upsert-merchant-custom-attributes) request.
