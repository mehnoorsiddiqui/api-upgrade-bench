      [ListCashDrawerShiftEvents](https://developer.squareup.com/reference/square_2024-05-15/cash-drawers-api/list-cash-drawer-shift-events) for a list of cash drawer shift events.'
- target: $['paths']['/v2/catalog/batch-delete']['post']
  update:
    description: "Deletes a set of [CatalogItem](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItem)s based on the\nprovided list of target IDs and returns a set of successfully deleted IDs in\nthe response. Deletion is a cascading event such that all children of the\ntargeted object are also deleted. For example, deleting a CatalogItem will\nalso delete all of its [CatalogItemVariation](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItemVariation)\nchildren.\n\n`BatchDeleteCatalogObjects` succeeds even if only a portion of the targeted\nIDs can be deleted. The response will only include IDs that were\nactually deleted.\n\nTo ensure consistency, only one delete request is processed at a time per seller account.  \nWhile one (batch or non-batch) delete request is being processed, other (batched and non-batched) \ndelete requests are rejected with the `429` error code."
- target: $['paths']['/v2/catalog/batch-retrieve']['post']
  update:
    description: 'Returns a set of objects based on the provided ID.

      Each [CatalogItem](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItem) returned in the set includes all of its

      child information including: all of its

      [CatalogItemVariation](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItemVariation) objects, references to

      its [CatalogModifierList](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogModifierList) objects, and the ids of

      any [CatalogTax](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogTax) objects that apply to it.'
- target: $['paths']['/v2/catalog/list']['get']
  update:
    description: "Returns a list of all [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject)s of the specified types in the catalog. \n\nThe `types` parameter is specified as a comma-separated list of the [CatalogObjectType](https://developer.squareup.com/reference/square_2024-05-15/enums/CatalogObjectType) values, \nfor example, \"`ITEM`, `ITEM_VARIATION`, `MODIFIER`, `MODIFIER_LIST`, `CATEGORY`, `DISCOUNT`, `TAX`, `IMAGE`\".\n\n__Important:__ ListCatalog does not return deleted catalog items. To retrieve\ndeleted catalog items, use [SearchCatalogObjects](https://developer.squareup.com/reference/square_2024-05-15/catalog-api/search-catalog-objects)\nand set the `include_deleted_objects` attribute value to `true`."
- target: $['paths']['/v2/catalog/list']['get']['parameters'][?(@.name == 'types' && @.in == 'query')]
  update:
    description: "An optional case-insensitive, comma-separated list of object types to retrieve.\n\nThe valid values are defined in the [CatalogObjectType](https://developer.squareup.com/reference/square_2024-05-15/enums/CatalogObjectType) enum, for example,\n`ITEM`, `ITEM_VARIATION`, `CATEGORY`, `DISCOUNT`, `TAX`,\n`MODIFIER`, `MODIFIER_LIST`, `IMAGE`, etc.\n\nIf this is unspecified, the operation returns objects of all the top level types at the version\nof the Square API used to make the request. Object types that are nested onto other object types\nare not included in the defaults.\n\nAt the current API version the default object types are:\nITEM, CATEGORY, TAX, DISCOUNT, MODIFIER_LIST, \nPRICING_RULE, PRODUCT_SET, TIME_PERIOD, MEASUREMENT_UNIT,\nSUBSCRIPTION_PLAN, ITEM_OPTION, CUSTOM_ATTRIBUTE_DEFINITION, QUICK_AMOUNT_SETTINGS."
- target: $['paths']['/v2/catalog/list']['get']['parameters'][?(@.name == 'catalog_version' && @.in == 'query')]
  update:
    description: 'The specific version of the catalog objects to be included in the response.

      This allows you to retrieve historical versions of objects. The specified version value is matched against

      the [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject)s'' `version` attribute.  If not included, results will be from the

      current version of the catalog.'
- target: $['paths']['/v2/catalog/object']['post']
  update:
    description: "Creates a new or updates the specified [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject).\n\nTo ensure consistency, only one update request is processed at a time per seller account.  \nWhile one (batch or non-batch) update request is being processed, other (batched and non-batched) \nupdate requests are rejected with the `429` error code."
- target: $['paths']['/v2/catalog/object/{object_id}']['delete']
  update:
    description: "Deletes a single [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) based on the\nprovided ID and returns the set of successfully deleted IDs in the response.\nDeletion is a cascading event such that all children of the targeted object\nare also deleted. For example, deleting a [CatalogItem](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItem)\nwill also delete all of its\n[CatalogItemVariation](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItemVariation) children.\n\nTo ensure consistency, only one delete request is processed at a time per seller account.  \nWhile one (batch or non-batch) delete request is being processed, other (batched and non-batched) \ndelete requests are rejected with the `429` error code."
- target: $['paths']['/v2/catalog/object/{object_id}']['get']
  update:
    description: 'Returns a single [CatalogItem](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItem) as a

      [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) based on the provided ID. The returned

      object includes all of the relevant [CatalogItem](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItem)

      information including: [CatalogItemVariation](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItemVariation)

      children, references to its

      [CatalogModifierList](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogModifierList) objects, and the ids of

      any [CatalogTax](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogTax) objects that apply to it.'
- target: $['paths']['/v2/catalog/object/{object_id}']['get']['parameters'][?(@.name == 'catalog_version' && @.in == 'query')]
  update:
    description: 'Requests objects as of a specific version of the catalog. This allows you to retrieve historical

      versions of objects. The value to retrieve a specific version of an object can be found

      in the version field of [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject)s. If not included, results will

      be from the current version of the catalog.'
- target: $['paths']['/v2/catalog/search']['post']
  update:
    description: 'Searches for [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) of any type by matching supported search attribute values,

      excluding custom attribute values on items or item variations, against one or more of the specified query filters.


      This (`SearchCatalogObjects`) endpoint differs from the [SearchCatalogItems](https://developer.squareup.com/reference/square_2024-05-15/catalog-api/search-catalog-items)

      endpoint in the following aspects:


      - `SearchCatalogItems` can only search for items or item variations, whereas `SearchCatalogObjects` can search for any type of catalog objects.

      - `SearchCatalogItems` supports the custom attribute query filters to return items or item variations that contain custom attribute values, where `SearchCatalogObjects` does not.

      - `SearchCatalogItems` does not support the `include_deleted_objects` filter to search for deleted items or item variations, whereas `SearchCatalogObjects` does.

      - The both endpoints have different call conventions, including the query filter formats.'
- target: $['paths']['/v2/catalog/search-catalog-items']['post']
  update:
    description: 'Searches for catalog items or item variations by matching supported search attribute values, including

      custom attribute values, against one or more of the specified query filters.


      This (`SearchCatalogItems`) endpoint differs from the [SearchCatalogObjects](https://developer.squareup.com/reference/square_2024-05-15/catalog-api/search-catalog-objects)

      endpoint in the following aspects:


      - `SearchCatalogItems` can only search for items or item variations, whereas `SearchCatalogObjects` can search for any type of catalog objects.

      - `SearchCatalogItems` supports the custom attribute query filters to return items or item variations that contain custom attribute values, where `SearchCatalogObjects` does not.

      - `SearchCatalogItems` does not support the `include_deleted_objects` filter to search for deleted items or item variations, whereas `SearchCatalogObjects` does.

      - The both endpoints use different call conventions, including the query filter formats.'
- target: $['paths']['/v2/catalog/update-item-modifier-lists']['post']
  update:
    description: 'Updates the [CatalogModifierList](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogModifierList) objects

      that apply to the targeted [CatalogItem](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItem) without having

      to perform an upsert on the entire item.'
- target: $['paths']['/v2/catalog/update-item-taxes']['post']
  update:
    description: 'Updates the [CatalogTax](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogTax) objects that apply to the

      targeted [CatalogItem](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItem) without having to perform an

      upsert on the entire item.'
- target: $['paths']['/v2/customers/bulk-create']['post']
  update:
    description: 'Creates multiple [customer profiles](https://developer.squareup.com/reference/square_2024-05-15/objects/Customer) for a business.


      This endpoint takes a map of individual create requests and returns a map of responses.


      You must provide at least one of the following values in each create request:


      - `given_name`

      - `family_name`

      - `company_name`

      - `email_address`

      - `phone_number`'
- target: $['paths']['/v2/customers/bulk-update']['post']
  update:
    description: 'Updates multiple customer profiles.


      This endpoint takes a map of individual update requests and returns a map of responses.


      You cannot use this endpoint to change cards on file. To make changes, use the [Cards API](https://developer.squareup.com/reference/square_2024-05-15/cards-api) or [Gift Cards API](https://developer.squareup.com/reference/square_2024-05-15/gift-cards-api).'
- target: $['paths']['/v2/customers/custom-attribute-definitions']['get']
  update:
    description: 'Lists the customer-related [custom attribute definitions](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) that belong to a Square seller account.


      When all response pages are retrieved, the results include all custom attribute definitions

      that are visible to the requesting application, including those that are created by other

      applications and set to `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`. Note that

      seller-defined custom attributes (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/customers/custom-attribute-definitions']['post']
  update:
    description: 'Creates a customer-related [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) for a Square seller account.

      Use this endpoint to define a custom attribute that can be associated with customer profiles.


      A custom attribute definition specifies the `key`, `visibility`, `schema`, and other properties

      for a custom attribute. After the definition is created, you can call

      [UpsertCustomerCustomAttribute](https://developer.squareup.com/reference/square_2024-05-15/customer-custom-attributes-api/upsert-customer-custom-attribute) or

      [BulkUpsertCustomerCustomAttributes](https://developer.squareup.com/reference/square_2024-05-15/customer-custom-attributes-api/bulk-upsert-customer-custom-attributes)

      to set the custom attribute for customer profiles in the seller''s Customer Directory.


      Sellers can view all custom attributes in exported customer data, including those set to

      `VISIBILITY_HIDDEN`.'
- target: $['paths']['/v2/customers/custom-attribute-definitions/{key}']['delete']
  update:
    description: 'Deletes a customer-related [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) from a Square seller account.


      Deleting a custom attribute definition also deletes the corresponding custom attribute from

      all customer profiles in the seller''s Customer Directory.


      Only the definition owner can delete a custom attribute definition.'
- target: $['paths']['/v2/customers/custom-attribute-definitions/{key}']['get']
  update:
    description: 'Retrieves a customer-related [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) from a Square seller account.


      To retrieve a custom attribute definition created by another application, the `visibility`

      setting must be `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/customers/custom-attribute-definitions/{key}']['put']
  update:
    description: 'Updates a customer-related [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) for a Square seller account.


      Use this endpoint to update the following fields: `name`, `description`, `visibility`, or the

      `schema` for a `Selection` data type.


      Only the definition owner can update a custom attribute definition. Note that sellers can view

      all custom attributes in exported customer data, including those set to `VISIBILITY_HIDDEN`.'
- target: $['paths']['/v2/customers/custom-attributes/bulk-upsert']['post']
  update:
    description: 'Creates or updates [custom attributes](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) for customer profiles as a bulk operation.


      Use this endpoint to set the value of one or more custom attributes for one or more customer profiles.

      A custom attribute is based on a custom attribute definition in a Square seller account, which is

      created using the [CreateCustomerCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/customer-custom-attributes-api/create-customer-custom-attribute-definition) endpoint.


      This `BulkUpsertCustomerCustomAttributes` endpoint accepts a map of 1 to 25 individual upsert

      requests and returns a map of individual upsert responses. Each upsert request has a unique ID

      and provides a customer ID and custom attribute. Each upsert response is returned with the ID

      of the corresponding request.


      To create or update a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/customers/{customer_id}']['put']
  update:
    description: 'Updates a customer profile. This endpoint supports sparse updates, so only new or changed fields are required in the request.

      To add or update a field, specify the new value. To remove a field, specify `null`.


      To update a customer profile that was created by merging existing profiles, you must use the ID of the newly created profile.


      You cannot use this endpoint to change cards on file. To make changes, use the [Cards API](https://developer.squareup.com/reference/square_2024-05-15/cards-api) or [Gift Cards API](https://developer.squareup.com/reference/square_2024-05-15/gift-cards-api).'
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes']['get']
  update:
    description: 'Lists the [custom attributes](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) associated with a customer profile.


      You can use the `with_definitions` query parameter to also retrieve custom attribute definitions

      in the same call.


      When all response pages are retrieved, the results include all custom attributes that are

      visible to the requesting application, including those that are owned by other applications

      and set to `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes']['get']['parameters'][?(@.name == 'customer_id' && @.in == 'path')]
  update:
    description: The ID of the target [customer profile](https://developer.squareup.com/reference/square_2024-05-15/objects/Customer).
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes']['get']['parameters'][?(@.name == 'with_definitions' && @.in == 'query')]
  update:
    description: 'Indicates whether to return the [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) in the `definition` field of each

      custom attribute. Set this parameter to `true` to get the name and description of each custom

      attribute, information about the data type, or other definition details. The default value is `false`.'
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes/{key}']['delete']
  update:
    description: 'Deletes a [custom attribute](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) associated with a customer profile.


      To delete a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes/{key}']['delete']['parameters'][?(@.name == 'customer_id' && @.in == 'path')]
  update:
    description: The ID of the target [customer profile](https://developer.squareup.com/reference/square_2024-05-15/objects/Customer).
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes/{key}']['get']
  update:
    description: 'Retrieves a [custom attribute](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) associated with a customer profile.


      You can use the `with_definition` query parameter to also retrieve the custom attribute definition

      in the same call.


      To retrieve a custom attribute owned by another application, the `visibility` setting must be

      `VISIBILITY_READ_ONLY` or `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes/{key}']['get']['parameters'][?(@.name == 'customer_id' && @.in == 'path')]
  update:
    description: The ID of the target [customer profile](https://developer.squareup.com/reference/square_2024-05-15/objects/Customer).
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes/{key}']['get']['parameters'][?(@.name == 'with_definition' && @.in == 'query')]
  update:
    description: 'Indicates whether to return the [custom attribute definition](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttributeDefinition) in the `definition` field of

      the custom attribute. Set this parameter to `true` to get the name and description of the custom

      attribute, information about the data type, or other definition details. The default value is `false`.'
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes/{key}']['post']
  update:
    description: 'Creates or updates a [custom attribute](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) for a customer profile.


      Use this endpoint to set the value of a custom attribute for a specified customer profile.

      A custom attribute is based on a custom attribute definition in a Square seller account, which

      is created using the [CreateCustomerCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/customer-custom-attributes-api/create-customer-custom-attribute-definition) endpoint.


      To create or update a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes/{key}']['post']['parameters'][?(@.name == 'customer_id' && @.in == 'path')]
  update:
    description: The ID of the target [customer profile](https://developer.squareup.com/reference/square_2024-05-15/objects/Customer).
- target: $['paths']['/v2/disputes/{dispute_id}/submit-evidence']['post']
  update:
    description: 'Submits evidence to the cardholder''s bank.


      The evidence submitted by this endpoint includes evidence uploaded

      using the [CreateDisputeEvidenceFile](https://developer.squareup.com/reference/square_2024-05-15/disputes-api/create-dispute-evidence-file) and

      [CreateDisputeEvidenceText](https://developer.squareup.com/reference/square_2024-05-15/disputes-api/create-dispute-evidence-text) endpoints and

      evidence automatically provided by Square, when available. Evidence cannot be removed from

      a dispute after submission.'
- target: $['paths']['/v2/gift-cards']['get']['parameters'][?(@.name == 'type' && @.in == 'query')]
  update:
    description: 'If a [type](https://developer.squareup.com/reference/square_2024-05-15/enums/GiftCardType) is provided, the endpoint returns gift cards of the specified type.

      Otherwise, the endpoint returns gift cards of all types.'
- target: $['paths']['/v2/gift-cards']['get']['parameters'][?(@.name == 'state' && @.in == 'query')]
  update:
    description: 'If a [state](https://developer.squareup.com/reference/square_2024-05-15/enums/GiftCardStatus) is provided, the endpoint returns the gift cards in the specified state.

      Otherwise, the endpoint returns the gift cards of all states.'
- target: $['paths']['/v2/gift-cards']['post']
  update:
    description: "Creates a digital gift card or registers a physical (plastic) gift card. After the gift card \nis created, you must call [CreateGiftCardActivity](https://developer.squareup.com/reference/square_2024-05-15/gift-card-activities-api/create-gift-card-activity) \nto activate the card with an initial balance before it can be used for payment."
- target: $['paths']['/v2/gift-cards/activities']['get']['parameters'][?(@.name == 'type' && @.in == 'query')]
  update:
    description: "If a [type](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivityType) is provided, the endpoint returns gift card activities of the specified type. \nOtherwise, the endpoint returns all types of gift card activities."
- target: $['paths']['/v2/gift-cards/activities']['post']
  update:
    description: "Creates a gift card activity to manage the balance or state of a [gift card](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCard). \nFor example, you create an `ACTIVATE` activity to activate a gift card with an initial balance \nbefore the gift card can be used."
