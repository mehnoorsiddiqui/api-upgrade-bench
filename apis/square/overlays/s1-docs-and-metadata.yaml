    description: "A set of [UpdateVendorResponse](https://developer.squareup.com/reference/square_2024-05-15/objects/UpdateVendorResponse) objects encapsulating successfully created [Vendor](https://developer.squareup.com/reference/square_2024-05-15/objects/Vendor)\nobjects or error responses for failed attempts. The set is represented by a collection of `Vendor`-ID/`UpdateVendorResponse`-object or \n`Vendor`-ID/error-object pairs."
- target: $['components']['schemas']['BulkUpdateVendorsResponse']
  update:
    description: Represents an output from a call to [BulkUpdateVendors](https://developer.squareup.com/reference/square_2024-05-15/vendors-api/bulk-update-vendors).
