- target: $['components']['schemas']['BulkUpsertMerchantCustomAttributesRequestMerchantCustomAttributeUpsertRequest']
  update:
    description: 'Represents an individual upsert request in a [BulkUpsertMerchantCustomAttributes](https://developer.squareup.com/reference/square_2024-05-15/merchant-custom-attributes-api/bulk-upsert-merchant-custom-attributes)

      request. An individual request contains a merchant ID, the custom attribute to create or update,

