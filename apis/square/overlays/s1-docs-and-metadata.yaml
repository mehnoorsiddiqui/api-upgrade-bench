actions:
- target: $['components']['securitySchemes']['bearerAuth']['x-additional-headers']
  remove: true
- target: $['components']['securitySchemes']['bearerAuth']
  update:
    x-additional-headers:
    - name: Square-Version
      description: Square Connect API versions
      schema:
        default: '2024-05-15'
- target: $['components']['schemas']['ArchivedState']
  update:
    description: "Defines the values for the `archived_state` query expression \nused in [SearchCatalogItems](https://developer.squareup.com/reference/square_2024-05-15/catalog-api/search-catalog-items) \nto return the archived, not archived or either type of catalog items."
- target: $['components']['schemas']['CatalogObjectType']['x-enum-elements']
  remove: true
- target: $['components']['schemas']['CatalogObjectType']
  update:
    x-enum-elements:
    - name: ITEM
      description: 'The `CatalogObject` instance is of the [CatalogItem](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItem) type and represents an item. The item-specific data

        must be set on the `item_data` field.'
    - name: IMAGE
      description: 'The `CatalogObject` instance is of the [CatalogImage](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogImage) type and represents an image. The image-specific data

        must be set on the `image_data` field.'
    - name: CATEGORY
      description: 'The `CatalogObject` instance is of the [CatalogCategory](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogCategory) type and represents a category. The category-specific data

        must be set on the `category_data` field.'
    - name: ITEM_VARIATION
      description: 'The `CatalogObject` instance is of the  [CatalogItemVariation](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItemVariation) type and represents an item variation, also referred to as variation.

        The item variation-specific data must be set on the `item_variation_data` field.'
    - name: TAX
      description: 'The `CatalogObject` instance is of the [CatalogTax](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogTax) type and represents a tax. The tax-specific data

        must be set on the `tax_data` field.'
    - name: DISCOUNT
      description: 'The `CatalogObject` instance is of the [CatalogDiscount](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogDiscount) type and represents a discount. The discount-specific data

        must be set on the `discount_data` field.'
    - name: MODIFIER_LIST
      description: 'The `CatalogObject` instance is of the [CatalogModifierList](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogModifierList) type and represents a modifier list.

        The modifier-list-specific data must be set on the `modifier_list_data` field.'
    - name: MODIFIER
      description: 'The `CatalogObject` instance is of the [CatalogModifier](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogModifier) type and represents a modifier. The modifier-specific data

        must be set on the `modifier_data` field.'
    - name: PRICING_RULE
      description: 'The `CatalogObject` instance is of the [CatalogPricingRule](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogPricingRule) type and represents a pricing rule. The pricing-rule-specific data

        must be set on the `pricing_rule_data` field.'
    - name: PRODUCT_SET
      description: 'The `CatalogObject` instance is of the [CatalogProductSet](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogProductSet) type and represents a product set.

        The product-set-specific data will be stored in the `product_set_data` field.'
    - name: TIME_PERIOD
      description: 'The `CatalogObject` instance is of the [CatalogTimePeriod](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogTimePeriod) type and represents a time period.

        The time-period-specific data must be set on the `time_period_data` field.'
    - name: MEASUREMENT_UNIT
      description: 'The `CatalogObject` instance is of the [CatalogMeasurementUnit](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogMeasurementUnit) type and represents a measurement unit specifying the unit of

        measure and precision in which an item variation is sold. The measurement-unit-specific data must set on the `measurement_unit_data` field.'
    - name: SUBSCRIPTION_PLAN_VARIATION
      description: 'The `CatalogObject` instance is of the [CatalogSubscriptionPlan](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogSubscriptionPlan) type and represents a subscription plan.

        The subscription-plan-specific data must be stored on the `subscription_plan_data` field.'
    - name: ITEM_OPTION
      description: 'The `CatalogObject` instance is of the [CatalogItemOption](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItemOption) type and represents a list of options (such as a color or size of a T-shirt)

        that can be assigned to item variations. The item-option-specific data must be on the `item_option_data` field.'
    - name: ITEM_OPTION_VAL
      description: 'The `CatalogObject` instance is of the [CatalogItemOptionValue](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogItemOptionValue) type and represents a value associated with one or more item options.

        For example, an item option of "Size" may have item option values such as "Small" or "Medium".

        The item-option-value-specific data must be on the `item_option_value_data` field.'
    - name: CUSTOM_ATTRIBUTE_DEFINITION
      description: 'The `CatalogObject` instance is of the [CatalogCustomAttributeDefinition](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogCustomAttributeDefinition) type and represents the definition of a custom attribute.

        The custom-attribute-definition-specific data must be set on the `custom_attribute_definition_data` field.'
    - name: QUICK_AMOUNTS_SETTINGS
      description: 'The `CatalogObject` instance is of the [CatalogQuickAmountsSettings](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogQuickAmountsSettings) type and represents settings to configure preset charges for quick payments at each location.

        For example, a location may have a list of both AUTO and MANUAL quick amounts that are set to DISABLED.

        The quick-amounts-settings-specific data must be set on the `quick_amounts_settings_data` field.'
    - name: SUBSCRIPTION_PLAN
      description: 'The `CatalogObject` instance is of the [CatalogSubscriptionPlan](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogSubscriptionPlan) type and represents a subscription plan.

        The subscription plan specific data must be stored on the `subscription_plan_data` field.'
    - name: AVAILABILITY_PERIOD
      description: 'The `CatalogObject` instance is of the [CatalogAvailabilityPeriod](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogAvailabilityPeriod) type and represents an availability period.

        The availability period specific data must be stored on the `availability_period_data` field.'
- target: $['components']['schemas']['EmployeeStatus']
  update:
    description: 'The status of the Employee being retrieved.


      DEPRECATED at version 2020-08-26. Replaced by [TeamMemberStatus](https://developer.squareup.com/reference/square_2024-05-15/objects/TeamMemberStatus).'
- target: $['components']['schemas']['FulfillmentType']['x-enum-elements']
  remove: true
- target: $['components']['schemas']['FulfillmentType']
  update:
    x-enum-elements:
    - name: PICKUP
      description: A recipient to pick up the fulfillment from a physical [location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location).
    - name: SHIPMENT
      description: A shipping carrier to ship the fulfillment.
    - name: DELIVERY
      description: A courier to deliver the fulfillment.
- target: $['components']['schemas']['GiftCardActivityAdjustDecrementReason']
  update:
    description: Indicates the reason for deducting money from a [gift card](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCard).
- target: $['components']['schemas']['GiftCardActivityAdjustIncrementReason']
  update:
    description: Indicates the reason for adding money to a [gift card](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCard).
- target: $['components']['schemas']['GiftCardActivityBlockReason']
  update:
    description: Indicates the reason for blocking a [gift card](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCard).
- target: $['components']['schemas']['GiftCardActivityClearBalanceReason']
  update:
    description: Indicates the reason for clearing the balance of a [gift card](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCard).
- target: $['components']['schemas']['GiftCardActivityDeactivateReason']
  update:
    description: Indicates the reason for deactivating a [gift card](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCard).
- target: $['components']['schemas']['GiftCardActivityRedeemStatus']
  update:
    description: "Indicates the status of a [gift card](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCard) redemption. This status is relevant only for\nredemptions made from Square products (such as Square Point of Sale) because Square products use a \ntwo-state process. Gift cards redeemed using the Gift Card Activities API always have a `COMPLETED` status."
- target: $['components']['schemas']['GiftCardActivityType']
  update:
    description: Indicates the type of [gift card activity](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivity).
- target: $['components']['schemas']['GiftCardActivityUnblockReason']
  update:
    description: Indicates the reason for unblocking a [gift card](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCard).
- target: $['components']['schemas']['InvoiceAutomaticPaymentSource']
  update:
    description: Indicates the automatic payment method for an [invoice payment request](https://developer.squareup.com/reference/square_2024-05-15/objects/InvoicePaymentRequest).
- target: $['components']['schemas']['InvoiceDeliveryMethod']
  update:
    description: Indicates how Square delivers the [invoice](https://developer.squareup.com/reference/square_2024-05-15/objects/Invoice) to the customer.
- target: $['components']['schemas']['InvoiceRequestMethod']['x-enum-elements']
  remove: true
- target: $['components']['schemas']['InvoiceRequestMethod']
  update:
    x-enum-elements:
    - name: EMAIL
      description: 'Directs Square to send invoices, reminders, and receipts to the customer using email.

        Square sends the invoice after it is published (either immediately or at the `scheduled_at`

        time, if specified in the [invoice](https://developer.squareup.com/reference/square_2024-05-15/objects/Invoice)).'
    - name: CHARGE_CARD_ON_FILE
      description: 'Directs Square to charge the card on file on the `due_date` specified in the payment request

        and to use email to send invoices, reminders, and receipts.'
    - name: SHARE_MANUALLY
      description: "Directs Square to take no specific action on the invoice. In this case, the seller \n(or the application developer) follows up with the customer for payment. For example, \na seller might collect a payment in the Seller Dashboard or use the Point of Sale (POS) application. \nThe seller might also share the URL of the Square-hosted invoice page (`public_url`) with the customer requesting payment."
    - name: CHARGE_BANK_ON_FILE
      description: "Directs Square to charge the customer's bank account on file and to use email to send invoices, reminders, and receipts.\nThe customer must approve the payment.\n\nThe bank on file payment method applies only to invoices that sellers create in the Seller Dashboard or other\nSquare product. The bank account is provided by the customer during the payment flow. You \ncannot set `CHARGE_BANK_ON_FILE` as a request method using the Invoices API."
    - name: SMS
      description: "Directs Square to send invoices and receipts to the customer using SMS (text message). Square sends the invoice\nafter it is published (either immediately or at the `scheduled_at` time, if specified in the [invoice](https://developer.squareup.com/reference/square_2024-05-15/objects/Invoice)). \n\nYou cannot set `SMS` as a request method using the Invoices API."
    - name: SMS_CHARGE_CARD_ON_FILE
      description: "Directs Square to charge the card on file on the `due_date` specified in the payment request and to\nuse SMS (text message) to send invoices and receipts. \n\nYou cannot set `SMS_CHARGE_CARD_ON_FILE` as a request method using the Invoices API."
    - name: SMS_CHARGE_BANK_ON_FILE
      description: "Directs Square to charge the customer's bank account on file and to use SMS (text message) to send invoices and receipts.\nThe customer must approve the payment.\n\nThe bank on file payment method applies only to invoices that sellers create in the Seller Dashboard\nor other Square product. The bank account is provided by the customer during the payment flow. \nYou cannot set `SMS_CHARGE_BANK_ON_FILE` as a request method using the Invoices API."
