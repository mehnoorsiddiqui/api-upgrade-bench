- target: $['components']['schemas']['DisableCardResponse']
  update:
    description: 'Defines the fields that are included in the response body of

      a request to the [DisableCard](https://developer.squareup.com/reference/square_2024-05-15/cards-api/disable-card) endpoint.


      Note: if there are errors processing the request, the card field will not be

      present.'
- target: $['components']['schemas']['Employee']
  update:
    description: 'An employee object that is used by the external API.


      DEPRECATED at version 2020-08-26. Replaced by [TeamMember](https://developer.squareup.com/reference/square_2024-05-15/objects/TeamMember).'
- target: $['components']['schemas']['EmployeeWage']
  update:
    description: The hourly wage rate that an employee earns on a `Shift` for doing the job specified by the `title` property of this object. Deprecated at version 2020-08-26. Use [TeamMemberWage](https://developer.squareup.com/reference/square_2024-05-15/objects/TeamMemberWage).
- target: $['components']['schemas']['GetPaymentRefundRequest']
  update:
    description: 'Describes a request to retrieve a refund using

      [GetPaymentRefund](https://developer.squareup.com/reference/square_2024-05-15/refunds-api/get-payment-refund).'
- target: $['components']['schemas']['GetPaymentRefundResponse']
  update:
    description: 'Defines the response returned by [GetRefund](https://developer.squareup.com/reference/square_2024-05-15/refunds-api/get-payment-refund).


      Note: If there are errors processing the request, the refund field might not be

      present or it might be present in a FAILED state.'
- target: $['components']['schemas']['GetPaymentRequest']
  update:
    description: "Describes a request to retrieve a payment using \n[GetPayment](https://developer.squareup.com/reference/square_2024-05-15/payments-api/get-payment)."
- target: $['components']['schemas']['GetPaymentResponse']
  update:
    description: Defines the response returned by [GetPayment](https://developer.squareup.com/reference/square_2024-05-15/payments-api/get-payment).
- target: $['components']['schemas']['GiftCard']['properties']['customer_ids']
  update:
    description: The IDs of the [customer profiles](https://developer.squareup.com/reference/square_2024-05-15/objects/Customer) to whom this gift card is linked.
- target: $['components']['schemas']['GiftCardActivity']['properties']['location_id']
  update:
    description: The ID of the [business location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location) where the activity occurred.
- target: $['components']['schemas']['GiftCardActivity']['properties']['redeem_activity_details']
  update:
    description: "Additional details about a `REDEEM` activity, which is used to redeem a gift card for a purchase.\n\nFor applications that process payments using the Square Payments API, Square creates a `REDEEM` activity that \nupdates the gift card balance after the corresponding [CreatePayment](https://developer.squareup.com/reference/square_2024-05-15/payments-api/create-payment) \nrequest is completed. Applications that use a custom payment processing system must call \n[CreateGiftCardActivity](https://developer.squareup.com/reference/square_2024-05-15/gift-card-activities-api/create-gift-card-activity) to create the `REDEEM` activity."
- target: $['components']['schemas']['GiftCardActivity']['properties']['refund_activity_details']
  update:
    description: "Additional details about a `REFUND` activity, which is used to add money to a gift card when \nrefunding a payment.\n\nFor applications that process payments using the Square Payments API, Square creates a `REFUND` activity that \nupdates the gift card balance after the corresponding [RefundPayment](https://developer.squareup.com/reference/square_2024-05-15/refunds-api/refund-payment) \nrequest is completed. Applications that use a custom payment processing system must call \n[CreateGiftCardActivity](https://developer.squareup.com/reference/square_2024-05-15/gift-card-activities-api/create-gift-card-activity) to create the `REFUND` activity."
- target: $['components']['schemas']['GiftCardActivity']
  update:
    description: "Represents an action performed on a [gift card](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCard) that affects its state or balance. \nA gift card activity contains information about a specific activity type. For example, a `REDEEM` activity\nincludes a `redeem_activity_details` field that contains information about the redemption."
- target: $['components']['schemas']['GiftCardActivityActivate']['properties']['amount_money']
  update:
    description: "The amount added to the gift card. This value is a positive integer.\n\nApplications that use a custom order processing system must specify this amount in the \n[CreateGiftCardActivity](https://developer.squareup.com/reference/square_2024-05-15/gift-card-activities-api/create-gift-card-activity) request."
- target: $['components']['schemas']['GiftCardActivityActivate']['properties']['order_id']
  update:
    description: 'The ID of the [order](https://developer.squareup.com/reference/square_2024-05-15/objects/Order) that contains the `GIFT_CARD` line item.


      Applications that use the Square Orders API to process orders must specify the order ID

      [CreateGiftCardActivity](https://developer.squareup.com/reference/square_2024-05-15/gift-card-activities-api/create-gift-card-activity) request.'
- target: $['components']['schemas']['GiftCardActivityActivate']['properties']['line_item_uid']
  update:
    description: 'The UID of the `GIFT_CARD` line item in the order that represents the gift card purchase.


      Applications that use the Square Orders API to process orders must specify the line item UID

      in the [CreateGiftCardActivity](https://developer.squareup.com/reference/square_2024-05-15/gift-card-activities-api/create-gift-card-activity) request.'
- target: $['components']['schemas']['GiftCardActivityActivate']['properties']['buyer_payment_instrument_ids']
  update:
    description: "The payment instrument IDs used to process the gift card purchase, such as a credit card ID \nor bank account ID. \n\nApplications that use a custom order processing system must specify payment instrument IDs in \nthe [CreateGiftCardActivity](https://developer.squareup.com/reference/square_2024-05-15/gift-card-activities-api/create-gift-card-activity) request.\nSquare uses this information to perform compliance checks. \n\nFor applications that use the Square Orders API to process payments, Square has the necessary \ninstrument IDs to perform compliance checks."
- target: $['components']['schemas']['GiftCardActivityActivate']
  update:
    description: Represents details about an `ACTIVATE` [gift card activity type](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivityType).
- target: $['components']['schemas']['GiftCardActivityAdjustDecrement']
  update:
    description: Represents details about an `ADJUST_DECREMENT` [gift card activity type](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivityType).
- target: $['components']['schemas']['GiftCardActivityAdjustIncrement']
  update:
    description: Represents details about an `ADJUST_INCREMENT` [gift card activity type](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivityType).
- target: $['components']['schemas']['GiftCardActivityBlock']
  update:
    description: Represents details about a `BLOCK` [gift card activity type](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivityType).
- target: $['components']['schemas']['GiftCardActivityClearBalance']
  update:
    description: Represents details about a `CLEAR_BALANCE` [gift card activity type](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivityType).
- target: $['components']['schemas']['GiftCardActivityDeactivate']
  update:
    description: Represents details about a `DEACTIVATE` [gift card activity type](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivityType).
- target: $['components']['schemas']['GiftCardActivityImport']
  update:
    description: "Represents details about an `IMPORT` [gift card activity type](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivityType).\nThis activity type is used when Square imports a third-party gift card, in which case the \n`gan_source` of the gift card is set to `OTHER`."
- target: $['components']['schemas']['GiftCardActivityImportReversal']
  update:
    description: Represents details about an `IMPORT_REVERSAL` [gift card activity type](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivityType).
- target: $['components']['schemas']['GiftCardActivityLoad']['properties']['amount_money']
  update:
    description: "The amount added to the gift card. This value is a positive integer.\n\nApplications that use a custom order processing system must specify this amount in the \n[CreateGiftCardActivity](https://developer.squareup.com/reference/square_2024-05-15/gift-card-activities-api/create-gift-card-activity) request."
- target: $['components']['schemas']['GiftCardActivityLoad']['properties']['order_id']
  update:
    description: "The ID of the [order](https://developer.squareup.com/reference/square_2024-05-15/objects/Order) that contains the `GIFT_CARD` line item.\n\nApplications that use the Square Orders API to process orders must specify the order ID in the \n[CreateGiftCardActivity](https://developer.squareup.com/reference/square_2024-05-15/gift-card-activities-api/create-gift-card-activity) request."
- target: $['components']['schemas']['GiftCardActivityLoad']['properties']['line_item_uid']
  update:
    description: 'The UID of the `GIFT_CARD` line item in the order that represents the additional funds for the gift card.


      Applications that use the Square Orders API to process orders must specify the line item UID

      in the [CreateGiftCardActivity](https://developer.squareup.com/reference/square_2024-05-15/gift-card-activities-api/create-gift-card-activity) request.'
- target: $['components']['schemas']['GiftCardActivityLoad']['properties']['buyer_payment_instrument_ids']
  update:
    description: "The payment instrument IDs used to process the order for the additional funds, such as a credit card ID \nor bank account ID. \n\nApplications that use a custom order processing system must specify payment instrument IDs in \nthe [CreateGiftCardActivity](https://developer.squareup.com/reference/square_2024-05-15/gift-card-activities-api/create-gift-card-activity) request.\nSquare uses this information to perform compliance checks. \n\nFor applications that use the Square Orders API to process payments, Square has the necessary \ninstrument IDs to perform compliance checks."
- target: $['components']['schemas']['GiftCardActivityLoad']
  update:
    description: Represents details about a `LOAD` [gift card activity type](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivityType).
- target: $['components']['schemas']['GiftCardActivityRedeem']['properties']['amount_money']
  update:
    description: "The amount deducted from the gift card for the redemption. This value is a positive integer.\n\nApplications that use a custom payment processing system must specify this amount in the \n[CreateGiftCardActivity](https://developer.squareup.com/reference/square_2024-05-15/gift-card-activities-api/create-gift-card-activity) request."
- target: $['components']['schemas']['GiftCardActivityRedeem']
  update:
    description: Represents details about a `REDEEM` [gift card activity type](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivityType).
- target: $['components']['schemas']['GiftCardActivityRefund']['properties']['redeem_activity_id']
  update:
    description: "The ID of the refunded `REDEEM` gift card activity. Square populates this field if the \n`payment_id` in the corresponding [RefundPayment](https://developer.squareup.com/reference/square_2024-05-15/refunds-api/refund-payment) request \nrepresents a redemption made by the same gift card. Note that you must use `RefundPayment` \nto refund a gift card payment to the same gift card if the payment was processed by Square.\n\nFor applications that use a custom payment processing system, this field is required when creating\na `REFUND` activity. The provided `REDEEM` activity ID must be linked to the same gift card."
- target: $['components']['schemas']['GiftCardActivityRefund']
  update:
    description: Represents details about a `REFUND` [gift card activity type](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivityType).
- target: $['components']['schemas']['GiftCardActivityTransferBalanceFrom']
  update:
    description: Represents details about a `TRANSFER_BALANCE_FROM` [gift card activity type](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivityType).
- target: $['components']['schemas']['GiftCardActivityTransferBalanceTo']
  update:
    description: Represents details about a `TRANSFER_BALANCE_TO` [gift card activity type](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivityType).
- target: $['components']['schemas']['GiftCardActivityUnblock']
  update:
    description: Represents details about an `UNBLOCK` [gift card activity type](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivityType).
- target: $['components']['schemas']['GiftCardActivityUnlinkedActivityRefund']
  update:
    description: Represents details about an `UNLINKED_ACTIVITY_REFUND` [gift card activity type](https://developer.squareup.com/reference/square_2024-05-15/objects/GiftCardActivityType).
- target: $['components']['schemas']['InventoryAdjustment']['properties']['from_state']
  update:
    description: 'The [inventory state](https://developer.squareup.com/reference/square_2024-05-15/enums/InventoryState) of the related quantity

      of items before the adjustment.'
- target: $['components']['schemas']['InventoryAdjustment']['properties']['to_state']
  update:
    description: 'The [inventory state](https://developer.squareup.com/reference/square_2024-05-15/enums/InventoryState) of the related quantity

      of items after the adjustment.'
- target: $['components']['schemas']['InventoryAdjustment']['properties']['location_id']
  update:
    description: 'The Square-generated ID of the [Location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location) where the related

      quantity of items is being tracked.'
- target: $['components']['schemas']['InventoryAdjustment']['properties']['catalog_object_id']
  update:
    description: 'The Square-generated ID of the

      [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) being tracked.'
- target: $['components']['schemas']['InventoryAdjustment']['properties']['catalog_object_type']
  update:
    description: "The [type](https://developer.squareup.com/reference/square_2024-05-15/enums/CatalogObjectType) of the [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) being tracked. \n\nThe Inventory API supports setting and reading the `\"catalog_object_type\": \"ITEM_VARIATION\"` field value. \nIn addition, it can also read the `\"catalog_object_type\": \"ITEM\"` field value that is set by the Square Restaurants app."
- target: $['components']['schemas']['InventoryAdjustment']['properties']['employee_id']
  update:
    description: 'The Square-generated ID of the [Employee](https://developer.squareup.com/reference/square_2024-05-15/objects/Employee) responsible for the

      inventory adjustment.'
- target: $['components']['schemas']['InventoryAdjustment']['properties']['team_member_id']
  update:
    description: 'The Square-generated ID of the [Team Member](https://developer.squareup.com/reference/square_2024-05-15/objects/TeamMember) responsible for the

      inventory adjustment.'
- target: $['components']['schemas']['InventoryAdjustment']['properties']['transaction_id']
  update:
    description: 'The Square-generated ID of the [Transaction](https://developer.squareup.com/reference/square_2024-05-15/objects/Transaction) that

      caused the adjustment. Only relevant for payment-related state

      transitions.'
- target: $['components']['schemas']['InventoryAdjustment']['properties']['refund_id']
  update:
    description: 'The Square-generated ID of the [Refund](https://developer.squareup.com/reference/square_2024-05-15/objects/Refund) that

      caused the adjustment. Only relevant for refund-related state

      transitions.'
- target: $['components']['schemas']['InventoryChange']['properties']['type']
  update:
    description: 'Indicates how the inventory change is applied. See

      [InventoryChangeType](https://developer.squareup.com/reference/square_2024-05-15/enums/InventoryChangeType) for all possible values.'
- target: $['components']['schemas']['InventoryChange']['properties']['transfer']
  update:
    description: 'Contains details about the inventory transfer when `type` is

      `TRANSFER`, and is unset for all other change types.


      _Note:_ An [InventoryTransfer](https://developer.squareup.com/reference/square_2024-05-15/objects/InventoryTransfer) object can only be set in the input to the

      [BatchChangeInventory](https://developer.squareup.com/reference/square_2024-05-15/inventory-api/batch-change-inventory) endpoint when the seller has an active Retail Plus subscription.'
- target: $['components']['schemas']['InventoryChange']['properties']['measurement_unit']
  update:
    description: The [CatalogMeasurementUnit](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogMeasurementUnit) object representing the catalog measurement unit associated with the inventory change.
- target: $['components']['schemas']['InventoryChange']['properties']['measurement_unit_id']
  update:
    description: The ID of the [CatalogMeasurementUnit](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogMeasurementUnit) object representing the catalog measurement unit associated with the inventory change.
- target: $['components']['schemas']['InventoryChange']
  update:
    description: 'Represents a single physical count, inventory, adjustment, or transfer

      that is part of the history of inventory changes for a particular

      [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) instance.'
- target: $['components']['schemas']['InventoryCount']['properties']['catalog_object_id']
  update:
    description: 'The Square-generated ID of the

      [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) being tracked.'
- target: $['components']['schemas']['InventoryCount']['properties']['catalog_object_type']
  update:
    description: "The [type](https://developer.squareup.com/reference/square_2024-05-15/enums/CatalogObjectType) of the [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) being tracked. \n\nThe Inventory API supports setting and reading the `\"catalog_object_type\": \"ITEM_VARIATION\"` field value. \nIn addition, it can also read the `\"catalog_object_type\": \"ITEM\"` field value that is set by the Square Restaurants app."
- target: $['components']['schemas']['InventoryCount']['properties']['state']
  update:
    description: 'The current [inventory state](https://developer.squareup.com/reference/square_2024-05-15/enums/InventoryState) for the related

      quantity of items.'
- target: $['components']['schemas']['InventoryCount']['properties']['location_id']
  update:
    description: 'The Square-generated ID of the [Location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location) where the related

      quantity of items is being tracked.'
- target: $['components']['schemas']['InventoryCount']['properties']['is_estimated']
  update:
    description: 'Whether the inventory count is for composed variation (TRUE) or not (FALSE). If true, the inventory count will not be present in the response of

      any of these endpoints: [BatchChangeInventory](https://developer.squareup.com/reference/square_2024-05-15/inventory-api/batch-change-inventory),

      [BatchRetrieveInventoryChanges](https://developer.squareup.com/reference/square_2024-05-15/inventory-api/batch-retrieve-inventory-changes),

      [BatchRetrieveInventoryCounts](https://developer.squareup.com/reference/square_2024-05-15/inventory-api/batch-retrieve-inventory-counts), and

      [RetrieveInventoryChanges](https://developer.squareup.com/reference/square_2024-05-15/inventory-api/retrieve-inventory-changes).'
- target: $['components']['schemas']['InventoryPhysicalCount']['properties']['id']
  update:
    description: 'A unique Square-generated ID for the

      [InventoryPhysicalCount](https://developer.squareup.com/reference/square_2024-05-15/objects/InventoryPhysicalCount).'
- target: $['components']['schemas']['InventoryPhysicalCount']['properties']['reference_id']
  update:
    description: 'An optional ID provided by the application to tie the

      [InventoryPhysicalCount](https://developer.squareup.com/reference/square_2024-05-15/objects/InventoryPhysicalCount) to an external

      system.'
- target: $['components']['schemas']['InventoryPhysicalCount']['properties']['catalog_object_id']
  update:
    description: 'The Square-generated ID of the

      [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) being tracked.'
- target: $['components']['schemas']['InventoryPhysicalCount']['properties']['catalog_object_type']
  update:
    description: "The [type](https://developer.squareup.com/reference/square_2024-05-15/enums/CatalogObjectType) of the [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) being tracked. \n\nThe Inventory API supports setting and reading the `\"catalog_object_type\": \"ITEM_VARIATION\"` field value. \nIn addition, it can also read the `\"catalog_object_type\": \"ITEM\"` field value that is set by the Square Restaurants app."
- target: $['components']['schemas']['InventoryPhysicalCount']['properties']['state']
  update:
    description: 'The current [inventory state](https://developer.squareup.com/reference/square_2024-05-15/enums/InventoryState) for the related

      quantity of items.'
- target: $['components']['schemas']['InventoryPhysicalCount']['properties']['location_id']
  update:
    description: 'The Square-generated ID of the [Location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location) where the related

      quantity of items is being tracked.'
- target: $['components']['schemas']['InventoryPhysicalCount']['properties']['employee_id']
  update:
    description: 'The Square-generated ID of the [Employee](https://developer.squareup.com/reference/square_2024-05-15/objects/Employee) responsible for the

      physical count.'
- target: $['components']['schemas']['InventoryPhysicalCount']['properties']['team_member_id']
  update:
    description: 'The Square-generated ID of the [Team Member](https://developer.squareup.com/reference/square_2024-05-15/objects/TeamMember) responsible for the

      physical count.'
- target: $['components']['schemas']['InventoryTransfer']['properties']['state']
  update:
    description: 'The [inventory state](https://developer.squareup.com/reference/square_2024-05-15/enums/InventoryState) for the quantity of

      items being transferred.'
- target: $['components']['schemas']['InventoryTransfer']['properties']['from_location_id']
  update:
    description: 'The Square-generated ID of the [Location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location) where the related

      quantity of items was tracked before the transfer.'
- target: $['components']['schemas']['InventoryTransfer']['properties']['to_location_id']
  update:
    description: 'The Square-generated ID of the [Location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location) where the related

      quantity of items was tracked after the transfer.'
- target: $['components']['schemas']['InventoryTransfer']['properties']['catalog_object_id']
  update:
    description: 'The Square-generated ID of the

      [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) being tracked.'
- target: $['components']['schemas']['InventoryTransfer']['properties']['catalog_object_type']
  update:
    description: "The [type](https://developer.squareup.com/reference/square_2024-05-15/enums/CatalogObjectType) of the [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject) being tracked. \n\nThe Inventory API supports setting and reading the `\"catalog_object_type\": \"ITEM_VARIATION\"` field value. \nIn addition, it can also read the `\"catalog_object_type\": \"ITEM\"` field value that is set by the Square Restaurants app."
- target: $['components']['schemas']['InventoryTransfer']['properties']['employee_id']
  update:
    description: 'The Square-generated ID of the [Employee](https://developer.squareup.com/reference/square_2024-05-15/objects/Employee) responsible for the

      inventory transfer.'
- target: $['components']['schemas']['InventoryTransfer']['properties']['team_member_id']
  update:
    description: 'The Square-generated ID of the [Team Member](https://developer.squareup.com/reference/square_2024-05-15/objects/TeamMember) responsible for the

      inventory transfer.'
- target: $['components']['schemas']['Invoice']['properties']['order_id']
  update:
    description: "The ID of the [order](https://developer.squareup.com/reference/square_2024-05-15/objects/Order) for which the invoice is created. \nThis field is required when creating an invoice, and the order must be in the `OPEN` state.\n\nTo view the line items and other information for the associated order, call the \n[RetrieveOrder](https://developer.squareup.com/reference/square_2024-05-15/orders-api/retrieve-order) endpoint using the order ID."
- target: $['components']['schemas']['Invoice']['properties']['subscription_id']
  update:
    description: 'The ID of the [subscription](https://developer.squareup.com/reference/square_2024-05-15/objects/Subscription) associated with the invoice.

      This field is present only on subscription billing invoices.'
- target: $['components']['schemas']['Invoice']['properties']['attachments']
  update:
    description: 'Metadata about the attachments on the invoice. Invoice attachments are managed using the

      [CreateInvoiceAttachment](https://developer.squareup.com/reference/square_2024-05-15/invoices-api/create-invoice-attachment) and [DeleteInvoiceAttachment](https://developer.squareup.com/reference/square_2024-05-15/invoices-api/delete-invoice-attachment) endpoints.'
- target: $['components']['schemas']['InvoiceAcceptedPaymentMethods']['properties']['cash_app_pay']
  update:
    description: 'Indicates whether Cash App payments are accepted. The default value is `false`.


      This payment method is supported only for seller [locations](https://developer.squareup.com/reference/square_2024-05-15/objects/Location) in the United States.'
- target: $['components']['schemas']['InvoiceAcceptedPaymentMethods']
  update:
    description: The payment methods that customers can use to pay an [invoice](https://developer.squareup.com/reference/square_2024-05-15/objects/Invoice) on the Square-hosted invoice payment page.
- target: $['components']['schemas']['InvoiceAttachment']
  update:
    description: Represents a file attached to an [invoice](https://developer.squareup.com/reference/square_2024-05-15/objects/Invoice).
- target: $['components']['schemas']['InvoicePaymentRequest']['properties']['uid']
  update:
    description: The Square-generated ID of the payment request in an [invoice](https://developer.squareup.com/reference/square_2024-05-15/objects/Invoice).
- target: $['components']['schemas']['InvoicePaymentRequest']['properties']['card_id']
  update:
    description: 'The ID of the credit or debit card on file to charge for the payment request. To get the cards on file for a customer,

      call [ListCards](https://developer.squareup.com/reference/square_2024-05-15/cards-api/list-cards) and include the `customer_id` of the invoice recipient.'
- target: $['components']['schemas']['InvoicePaymentRequest']
  update:
