- target: $['paths']['/v2/inventory/batch-retrieve-counts']['post']
  update:
    description: 'Deprecated version of [BatchRetrieveInventoryCounts](https://developer.squareup.com/reference/square_2024-05-15/inventory-api/batch-retrieve-inventory-counts) after the endpoint URL

      is updated to conform to the standard convention.'
- target: $['paths']['/v2/inventory/counts/batch-retrieve']['post']
  update:
    description: 'Returns current counts for the provided

      [CatalogObject](https://developer.squareup.com/reference/square_2024-05-15/objects/CatalogObject)s at the requested

      [Location](https://developer.squareup.com/reference/square_2024-05-15/objects/Location)s.


      Results are paginated and sorted in descending order according to their

      `calculated_at` timestamp (newest first).


      When `updated_after` is specified, only counts that have changed since that

      time (based on the server timestamp for the most recent change) are

      returned. This allows clients to perform a "sync" operation, for example

      in response to receiving a Webhook notification.'
- target: $['paths']['/v2/inventory/physical-count/{physical_count_id}']['get']
