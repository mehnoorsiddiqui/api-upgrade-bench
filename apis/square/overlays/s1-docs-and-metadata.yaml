- target: $['components']['schemas']['CustomerCustomAttributeFilter']['properties']['key']
  update:
    description: 'The `key` of the [custom attribute](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) to filter by. The key is the identifier of the custom attribute

      (and the corresponding custom attribute definition) and can be retrieved using the [Customer Custom Attributes API](https://developer.squareup.com/reference/square_2024-05-15/customer-custom-attributes-api).'
- target: $['components']['schemas']['CustomerCustomAttributeFilter']['properties']['filter']
  update:
    description: 'A filter that corresponds to the data type of the target custom attribute. For example, provide the `phone` filter to

      search based on the value of a `PhoneNumber`-type custom attribute. The data type is specified by the schema field of the custom attribute definition,

      which can be retrieved using the [Customer Custom Attributes API](https://developer.squareup.com/reference/square_2024-05-15/customer-custom-attributes-api).


      You must provide this `filter` field, the `updated_at` field, or both.'
- target: $['components']['schemas']['CustomerCustomAttributeFilter']
  update:
    description: 'The custom attribute filter. Use this filter in a set of [custom attribute filters](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomerCustomAttributeFilters) to search

      based on the value or last updated date of a customer-related [custom attribute](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute).'
- target: $['components']['schemas']['CustomerCustomAttributeFilterValue']['properties']['selection']
  update:
    description: "A filter for a query based on the display name for a `Selection`-type custom attribute value. This filter is case-sensitive\nand can contain `any`, `all`, or both. The `none` condition is not supported.\n\nProvide the display name of each item that you want to search for. To find the display names for the selection, use the \n[Customer Custom Attributes API](https://developer.squareup.com/reference/square_2024-05-15/customer-custom-attributes-api) to retrieve the corresponding custom attribute definition\nand then check the `schema.items.names` field. For more information, see\n[Search based on selection](https://developer.squareup.com/docs/customers-api/use-the-api/search-customers#custom-attribute-value-filter-selection).\n\nNote that when a `Selection`-type custom attribute is assigned to a customer profile, the custom attribute value is a list of one\nor more UUIDs (sourced from the `schema.items.enum` field) that map to the item names. These UUIDs are unique per seller."
- target: $['components']['schemas']['CustomerCustomAttributeFilterValue']
  update:
    description: "A type-specific filter used in a [custom attribute filter](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomerCustomAttributeFilter) to search based on the value \nof a customer-related [custom attribute](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute)."
- target: $['components']['schemas']['CustomerCustomAttributeFilters']
  update:
    description: 'The custom attribute filters in a set of [customer filters](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomerFilter) used in a search query. Use this filter

      to search based on [custom attributes](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomAttribute) that are assigned to customer profiles. For more information, see

      [Search by custom attribute](https://developer.squareup.com/docs/customers-api/use-the-api/search-customers#search-by-custom-attribute).'
- target: $['components']['schemas']['CustomerFilter']['properties']['group_ids']
  update:
    description: 'A filter to select customers based on the [groups](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomerGroup) they belong to.

      Group membership is controlled by sellers and developers.


      The `group_ids` filter has the following syntax:

      ```

      "group_ids": {

      "any":  ["{group_a_id}", "{group_b_id}", ...],

      "all":  ["{group_1_id}", "{group_2_id}", ...],

      "none": ["{group_i_id}", "{group_ii_id}", ...]

      }

      ```


      You can use any combination of the `any`, `all`, and `none` fields in the filter.

      With `any`, the search returns customers in groups `a` or `b` or any other group specified in the list.

      With `all`, the search returns customers in groups `1` and `2` and all other groups specified in the list.

      With `none`, the search returns customers not in groups `i` or `ii` or any other group specified in the list.


      If any of the search conditions are not met, including when an invalid or non-existent group ID is provided,

      the result is an empty object (`{}`).'
- target: $['components']['schemas']['CustomerFilter']['properties']['custom_attribute']
  update:
    description: "A filter to select customers based on one or more custom attributes.  \nThis filter can contain up to 10 custom attribute filters. Each custom attribute filter specifies filtering criteria for a target custom\nattribute. If multiple custom attribute filters are provided, they are combined as an `AND` operation.\n\nTo be valid for a search, the custom attributes must be visible to the requesting application. For more information, including example queries,\nsee [Search by custom attribute](https://developer.squareup.com/docs/customers-api/use-the-api/search-customers#search-by-custom-attribute).\n\nSquare returns matching customer profiles, which do not contain custom attributes. To retrieve customer-related custom attributes,\nuse the [Customer Custom Attributes API](https://developer.squareup.com/reference/square_2024-05-15/customer-custom-attributes-api). For example, you can call\n[RetrieveCustomerCustomAttribute](https://developer.squareup.com/reference/square_2024-05-15/customer-custom-attributes-api/retrieve-customer-custom-attribute) using a customer ID from the result set."
- target: $['components']['schemas']['CustomerFilter']['properties']['segment_ids']
  update:
    description: ' A filter to select customers based on the [segments](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomerSegment) they belong to.

      Segment membership is dynamic and adjusts automatically based on whether customers meet the segment criteria.


      You can provide up to three segment IDs in the filter, using any combination of the `all`, `any`, and `none` fields.

      For the following example, the results include customers who belong to both segment A and segment B but do not belong to segment C.


      ```

      "segment_ids": {

      "all":  ["{segment_A_id}", "{segment_B_id}"],

      "none":  ["{segment_C_id}"]

      }

      ```


      If an invalid or non-existent segment ID is provided in the filter, Square stops processing the request

      and returns a `400 BAD_REQUEST` error that includes the segment ID.'
- target: $['components']['schemas']['CustomerFilter']
  update:
    description: 'Represents the filtering criteria in a [search query](https://developer.squareup.com/reference/square_2024-05-15/objects/CustomerQuery) that defines how to filter

      customer profiles returned in [SearchCustomers](https://developer.squareup.com/reference/square_2024-05-15/customers-api/search-customers) results.'
