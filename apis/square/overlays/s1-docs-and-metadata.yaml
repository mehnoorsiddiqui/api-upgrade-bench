      which contains a map of responses that each corresponds to an individual upsert request.'
- target: $['components']['schemas']['BulkUpsertCustomerCustomAttributesResponseCustomerCustomAttributeUpsertResponse']
  update:
    description: Represents a response for an individual upsert request in a [BulkUpsertCustomerCustomAttributes](https://developer.squareup.com/reference/square_2024-05-15/customer-custom-attributes-api/bulk-upsert-customer-custom-attributes) operation.
- target: $['components']['schemas']['BulkUpsertLocationCustomAttributesRequest']
  update:
    description: Represents a [BulkUpsertLocationCustomAttributes](https://developer.squareup.com/reference/square_2024-05-15/location-custom-attributes-api/bulk-upsert-location-custom-attributes) request.
