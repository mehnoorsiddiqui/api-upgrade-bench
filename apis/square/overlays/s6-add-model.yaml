    InventoryAdjustmentReasonIdType:
      type: string
      enum:
      - RECEIVED
      - DAMAGED
      - THEFT
      - LOST
      - RETURNED
      - SPOILAGE_WASTE
      - SAMPLES_PROMOTIONAL
      - INTERNAL_USE
      - VENDOR_RETURN
      - PRODUCTION_WASTE
      - SALE
      - RECOUNT
      - TRANSFER
      - IN_TRANSIT
