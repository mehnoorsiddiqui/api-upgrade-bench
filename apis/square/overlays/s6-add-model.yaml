        python: /sdk_samples/Inventory/UpdateInventoryAdjustment/UpdateInventoryAdjustmentRequest.python
        ruby: /sdk_samples/Inventory/UpdateInventoryAdjustment/UpdateInventoryAdjustmentRequest.ruby
