- target: $['components']['schemas']['SearchOrdersCustomerFilter']
  update:
    description: 'A filter based on the order `customer_id` and any tender `customer_id`

      associated with the order. It does not filter based on the

      [FulfillmentRecipient]($m/FulfillmentRecipient) `customer_id`.'
- target: $['components']['schemas']['SearchOrdersDateTimeFilter']
  update:
    description: 'Filter for `Order` objects based on whether their `CREATED_AT`,

      `CLOSED_AT`, or `UPDATED_AT` timestamps fall within a specified time range.

      You can specify the time range and which timestamp to filter for. You can filter

      for only one time range at a time.


      For each time range, the start time and end time are inclusive. If the end time

      is absent, it defaults to the time of the first request for the cursor.


      __Important:__ If you use the `DateTimeFilter` in a `SearchOrders` query,

      you must set the `sort_field` in [OrdersSort]($m/SearchOrdersSort)

      to the same field you filter for. For example, if you set the `CLOSED_AT` field

      in `DateTimeFilter`, you must set the `sort_field` in `SearchOrdersSort` to

      `CLOSED_AT`. Otherwise, `SearchOrders` throws an error.

      [Learn more about filtering orders by time range.](https://developer.squareup.com/docs/orders-api/manage-orders/search-orders#important-note-about-filtering-orders-by-time-range)'
- target: $['components']['schemas']['SearchOrdersFilter']['properties']['state_filter']
  update:
    description: Filter by [OrderState](entity:OrderState).
- target: $['components']['schemas']['SearchOrdersFulfillmentFilter']['properties']['fulfillment_types']
  update:
    description: 'A list of [fulfillment types](entity:FulfillmentType) to filter

      for. The list returns orders if any of its fulfillments match any of the fulfillment types

      listed in this field.

      See [FulfillmentType](#type-fulfillmenttype) for possible values'
- target: $['components']['schemas']['SearchOrdersFulfillmentFilter']['properties']['fulfillment_states']
  update:
    description: 'A list of [fulfillment states](entity:FulfillmentState) to filter

      for. The list returns orders if any of its fulfillments match any of the

      fulfillment states listed in this field.

      See [FulfillmentState](#type-fulfillmentstate) for possible values'
- target: $['components']['schemas']['SearchOrdersFulfillmentFilter']
  update:
    description: Filter based on [order fulfillment]($m/Fulfillment) information.
- target: $['components']['schemas']['SearchOrdersRequest']['properties']['return_entries']
  update:
    description: 'A Boolean that controls the format of the search results. If `true`,

      `SearchOrders` returns [OrderEntry](entity:OrderEntry) objects. If `false`, `SearchOrders`

      returns complete order objects.


      Default: `false`.'
- target: $['components']['schemas']['SearchOrdersRequest']['description']
  remove: true
- target: $['components']['schemas']['SearchOrdersRequest']['example']
  remove: true
- target: $['components']['schemas']['SearchOrdersRequest']
  update:
    example:
      limit: 3
      location_ids:
      - 057P5VYJ4A5X1
      - 18YC4JDH91E1H
      query:
        filter:
          date_time_filter:
            closed_at:
              end_at: '2019-03-04T21:54:45+00:00'
              start_at: '2018-03-03T20:00:00+00:00'
          state_filter:
            states:
            - COMPLETED
        sort:
          sort_field: CLOSED_AT
          sort_order: DESC
      return_entries: true
