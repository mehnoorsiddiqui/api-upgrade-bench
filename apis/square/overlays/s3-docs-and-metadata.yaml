  update:
    description: 'Indicates whether the item variation''s price is fixed or determined at the time

      of sale.

      See [CatalogPricingType](#type-catalogpricingtype) for possible values'
- target: $['components']['schemas']['CatalogItemVariation']['properties']['inventory_alert_type']
  update:
    description: 'Indicates whether the item variation displays an alert when its inventory quantity is less than or equal

      to its `inventory_alert_threshold`.

      See [InventoryAlertType](#type-inventoryalerttype) for possible values'
- target: $['components']['schemas']['CatalogItemVariation']['properties']['stockable_conversion']
  update:
    description: 'The unit conversion rule, as prescribed by the [CatalogStockConversion]($m/CatalogStockConversion) type,

      that describes how this non-stockable (i.e., sellable/receivable) item variation is converted

      to/from the stockable item variation sharing the same parent item. With the stock conversion,

      you can accurately track inventory when an item variation is sold in one unit, but stocked in

      another unit.'
- target: $['components']['schemas']['CatalogItemVariation']
  update:
    description: 'An item variation, representing a product for sale, in the Catalog object model. Each [item]($m/CatalogItem) must have at least one

      item variation and can have at most 250 item variations.


      An item variation can be sellable, stockable, or both if it has a unit of measure for its count for the sold number of the variation, the stocked

      number of the variation, or both. For example, when a variation representing wine is stocked and sold by the bottle, the variation is both

      stockable and sellable. But when a variation of the wine is sold by the glass, the sold units cannot be used as a measure of the stocked units. This by-the-glass

      variation is sellable, but not stockable. To accurately keep track of the wine''s inventory count at any time, the sellable count must be

      converted to stockable count. Typically, the seller defines this unit conversion. For example, 1 bottle equals 5 glasses. The Square API exposes

      the `stockable_conversion` property on the variation to specify the conversion. Thus, when two glasses of the wine are sold, the sellable count

      decreases by 2, and the stockable count automatically decreases by 0.4 bottle according to the conversion.'
- target: $['components']['schemas']['CatalogModifierList']['properties']['selection_type']
  update:
    description: 'Indicates whether a single (`SINGLE`) or multiple (`MULTIPLE`) modifiers from the list

      can be applied to a single `CatalogItem`.


      For text-based modifiers, the `selection_type` attribute is always `SINGLE`. The other value is ignored.

      See [CatalogModifierListSelectionType](#type-catalogmodifierlistselectiontype) for possible values'
- target: $['components']['schemas']['CatalogModifierList']['properties']['modifier_type']
  update:
    description: "The type of the modifier. \n\nWhen this `modifier_type` value is `TEXT`,  the `CatalogModifierList` represents a text-based modifier. \nWhen this `modifier_type` value is `LIST`, the `CatalogModifierList` contains a list of `CatalogModifier` objects.\nSee [CatalogModifierListModifierType](#type-catalogmodifierlistmodifiertype) for possible values"
- target: $['components']['schemas']['CatalogObject']['properties']['type']
  update:
    description: 'The type of this object. Each object type has expected

      properties expressed in a structured format within its corresponding `*_data` field below.

      See [CatalogObjectType](#type-catalogobjecttype) for possible values'
- target: $['components']['schemas']['CatalogObject']['properties']['custom_attribute_values']
  update:
    description: 'A map (key-value pairs) of application-defined custom attribute values. The value of a key-value pair

      is a [CatalogCustomAttributeValue](entity:CatalogCustomAttributeValue) object. The key is the `key` attribute

      value defined in the associated [CatalogCustomAttributeDefinition](entity:CatalogCustomAttributeDefinition)

      object defined by the application making the request.


      If the `CatalogCustomAttributeDefinition` object is

      defined by another application, the `CatalogCustomAttributeDefinition`''s key attribute value is prefixed by

      the defining application ID. For example, if the `CatalogCustomAttributeDefinition` has a `key` attribute of

      `"cocoa_brand"` and the defining application ID is `"abcd1234"`, the key in the map is `"abcd1234:cocoa_brand"`

      if the application making the request is different from the application defining the custom attribute definition.

      Otherwise, the key used in the map is simply `"cocoa_brand"`.


      Application-defined custom attributes are set at a global (location-independent) level.

      Custom attribute values are intended to store additional information about a catalog object

      or associations with an entity in another system. Do not use custom attributes

      to store any sensitive information (personally identifiable information, card details, etc.).'
- target: $['components']['schemas']['CatalogObjectType']['x-enum-elements']
  remove: true
- target: $['components']['schemas']['CatalogObjectType']
  update:
    x-enum-elements:
    - name: ITEM
      description: 'The `CatalogObject` instance is of the [CatalogItem]($m/CatalogItem) type and represents an item. The item-specific data

        must be set on the `item_data` field.'
    - name: IMAGE
      description: 'The `CatalogObject` instance is of the [CatalogImage]($m/CatalogImage) type and represents an image. The image-specific data

        must be set on the `image_data` field.'
    - name: CATEGORY
      description: 'The `CatalogObject` instance is of the [CatalogCategory]($m/CatalogCategory) type and represents a category. The category-specific data

        must be set on the `category_data` field.'
    - name: ITEM_VARIATION
      description: 'The `CatalogObject` instance is of the  [CatalogItemVariation]($m/CatalogItemVariation) type and represents an item variation, also referred to as variation.

        The item variation-specific data must be set on the `item_variation_data` field.'
    - name: TAX
      description: 'The `CatalogObject` instance is of the [CatalogTax]($m/CatalogTax) type and represents a tax. The tax-specific data

        must be set on the `tax_data` field.'
    - name: DISCOUNT
      description: 'The `CatalogObject` instance is of the [CatalogDiscount]($m/CatalogDiscount) type and represents a discount. The discount-specific data

        must be set on the `discount_data` field.'
    - name: MODIFIER_LIST
      description: 'The `CatalogObject` instance is of the [CatalogModifierList]($m/CatalogModifierList) type and represents a modifier list.

        The modifier-list-specific data must be set on the `modifier_list_data` field.'
    - name: MODIFIER
      description: 'The `CatalogObject` instance is of the [CatalogModifier]($m/CatalogModifier) type and represents a modifier. The modifier-specific data

        must be set on the `modifier_data` field.'
    - name: PRICING_RULE
      description: 'The `CatalogObject` instance is of the [CatalogPricingRule]($m/CatalogPricingRule) type and represents a pricing rule. The pricing-rule-specific data

        must be set on the `pricing_rule_data` field.'
    - name: PRODUCT_SET
      description: 'The `CatalogObject` instance is of the [CatalogProductSet]($m/CatalogProductSet) type and represents a product set.

        The product-set-specific data will be stored in the `product_set_data` field.'
    - name: TIME_PERIOD
      description: 'The `CatalogObject` instance is of the [CatalogTimePeriod]($m/CatalogTimePeriod) type and represents a time period.

        The time-period-specific data must be set on the `time_period_data` field.'
    - name: MEASUREMENT_UNIT
      description: 'The `CatalogObject` instance is of the [CatalogMeasurementUnit]($m/CatalogMeasurementUnit) type and represents a measurement unit specifying the unit of

        measure and precision in which an item variation is sold. The measurement-unit-specific data must set on the `measurement_unit_data` field.'
    - name: SUBSCRIPTION_PLAN_VARIATION
      description: 'The `CatalogObject` instance is of the [CatalogSubscriptionPlan]($m/CatalogSubscriptionPlan) type and represents a subscription plan.

        The subscription-plan-specific data must be stored on the `subscription_plan_data` field.'
    - name: ITEM_OPTION
      description: 'The `CatalogObject` instance is of the [CatalogItemOption]($m/CatalogItemOption) type and represents a list of options (such as a color or size of a T-shirt)

        that can be assigned to item variations. The item-option-specific data must be on the `item_option_data` field.'
    - name: ITEM_OPTION_VAL
      description: 'The `CatalogObject` instance is of the [CatalogItemOptionValue]($m/CatalogItemOptionValue) type and represents a value associated with one or more item options.

        For example, an item option of "Size" may have item option values such as "Small" or "Medium".

        The item-option-value-specific data must be on the `item_option_value_data` field.'
    - name: CUSTOM_ATTRIBUTE_DEFINITION
      description: 'The `CatalogObject` instance is of the [CatalogCustomAttributeDefinition]($m/CatalogCustomAttributeDefinition) type and represents the definition of a custom attribute.

        The custom-attribute-definition-specific data must be set on the `custom_attribute_definition_data` field.'
    - name: QUICK_AMOUNTS_SETTINGS
      description: 'The `CatalogObject` instance is of the [CatalogQuickAmountsSettings]($m/CatalogQuickAmountsSettings) type and represents settings to configure preset charges for quick payments at each location.

        For example, a location may have a list of both AUTO and MANUAL quick amounts that are set to DISABLED.

        The quick-amounts-settings-specific data must be set on the `quick_amounts_settings_data` field.'
    - name: SUBSCRIPTION_PLAN
      description: 'The `CatalogObject` instance is of the [CatalogSubscriptionPlan]($m/CatalogSubscriptionPlan) type and represents a subscription plan.

        The subscription plan specific data must be stored on the `subscription_plan_data` field.'
    - name: AVAILABILITY_PERIOD
      description: 'The `CatalogObject` instance is of the [CatalogAvailabilityPeriod]($m/CatalogAvailabilityPeriod) type and represents an availability period.

        The availability period specific data must be stored on the `availability_period_data` field.'
- target: $['components']['schemas']['CatalogPricingRule']['properties']['exclude_strategy']
  update:
    description: 'If an `exclude_products_id` was given, controls which subset of matched

      products is excluded from any discounts.


      Default value: `LEAST_EXPENSIVE`

      See [ExcludeStrategy](#type-excludestrategy) for possible values'
- target: $['components']['schemas']['CatalogQuery']['properties']['item_variations_for_item_option_values_query']
  update:
    description: 'A query expression to return item variations (of the [CatalogItemVariation](entity:CatalogItemVariation) type) that

      contain all of the specified `CatalogItemOption` IDs.'
- target: $['components']['schemas']['CatalogQuery']
  update:
    description: 'A query composed of one or more different types of filters to narrow the scope of targeted objects when calling the `SearchCatalogObjects` endpoint.


      Although a query can have multiple filters, only certain query types can be combined per call to [SearchCatalogObjects]($e/Catalog/SearchCatalogObjects).

      Any combination of the following types may be used together:

      - [exact_query]($m/CatalogQueryExact)

      - [prefix_query]($m/CatalogQueryPrefix)

      - [range_query]($m/CatalogQueryRange)

      - [sorted_attribute_query]($m/CatalogQuerySortedAttribute)

      - [text_query]($m/CatalogQueryText)


      All other query types cannot be combined with any others.


      When a query filter is based on an attribute, the attribute must be searchable.

      Searchable attributes are listed as follows, along their parent types that can be searched for with applicable query filters.


      Searchable attribute and objects queryable by searchable attributes:

      - `name`:  `CatalogItem`, `CatalogItemVariation`, `CatalogCategory`, `CatalogTax`, `CatalogDiscount`, `CatalogModifier`, `CatalogModifierList`, `CatalogItemOption`, `CatalogItemOptionValue`

      - `description`: `CatalogItem`, `CatalogItemOptionValue`

      - `abbreviation`: `CatalogItem`

      - `upc`: `CatalogItemVariation`

      - `sku`: `CatalogItemVariation`

      - `caption`: `CatalogImage`

      - `display_name`: `CatalogItemOption`


      For example, to search for [CatalogItem]($m/CatalogItem) objects by searchable attributes, you can use

      the `"name"`, `"description"`, or `"abbreviation"` attribute in an applicable query filter.'
- target: $['components']['schemas']['CatalogQuerySortedAttribute']['properties']['sort_order']
  update:
    description: 'The desired sort order, `"ASC"` (ascending) or `"DESC"` (descending).

      See [SortOrder](#type-sortorder) for possible values'
- target: $['components']['schemas']['CatalogQuickAmount']['properties']['type']
  update:
    description: 'Represents the type of the Quick Amount.

      See [CatalogQuickAmountType](#type-catalogquickamounttype) for possible values'
- target: $['components']['schemas']['CatalogQuickAmountsSettings']['properties']['option']
