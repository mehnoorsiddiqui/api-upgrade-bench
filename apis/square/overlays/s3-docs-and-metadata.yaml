- target: $['paths']['/v2/customers/{customer_id}/custom-attributes/{key}']['get']['parameters'][?(@.name == 'customer_id' && @.in == 'path')]
  update:
    description: The ID of the target [customer profile](entity:Customer).
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes/{key}']['get']['parameters'][?(@.name == 'with_definition' && @.in == 'query')]
  update:
    description: 'Indicates whether to return the [custom attribute definition](entity:CustomAttributeDefinition) in the `definition` field of

      the custom attribute. Set this parameter to `true` to get the name and description of the custom

      attribute, information about the data type, or other definition details. The default value is `false`.'
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes/{key}']['post']
  update:
    description: 'Creates or updates a [custom attribute]($m/CustomAttribute) for a customer profile.


      Use this endpoint to set the value of a custom attribute for a specified customer profile.

      A custom attribute is based on a custom attribute definition in a Square seller account, which

      is created using the [CreateCustomerCustomAttributeDefinition]($e/CustomerCustomAttributes/CreateCustomerCustomAttributeDefinition) endpoint.


      To create or update a custom attribute owned by another application, the `visibility` setting

      must be `VISIBILITY_READ_WRITE_VALUES`. Note that seller-defined custom attributes

      (also known as custom fields) are always set to `VISIBILITY_READ_WRITE_VALUES`.'
- target: $['paths']['/v2/customers/{customer_id}/custom-attributes/{key}']['post']['parameters'][?(@.name == 'customer_id' && @.in == 'path')]
