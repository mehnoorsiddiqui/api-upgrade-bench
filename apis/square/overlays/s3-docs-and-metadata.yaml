      the seller and other applications. If no value is specified, the value defaults to `VISIBILITY_HIDDEN`.

      See [Visibility](#type-visibility) for possible values'
- target: $['components']['schemas']['CustomAttributeFilter']
  update:
    description: 'Supported custom attribute query expressions for calling the

      [SearchCatalogItems]($e/Catalog/SearchCatalogItems)

      endpoint to search for items or item variations.'
- target: $['components']['schemas']['Customer']['properties']['id']
  update:
    description: "A unique Square-assigned ID for the customer profile.\n\nIf you need this ID for an API request, use the ID returned when you created the customer profile or call the [SearchCustomers](api-endpoint:Customers-SearchCustomers) \nor [ListCustomers](api-endpoint:Customers-ListCustomers) endpoint."
- target: $['components']['schemas']['Customer']['properties']['cards']
  update:
    description: "Payment details of the credit, debit, and gift cards stored on file for the customer profile. \n\nDEPRECATED at version 2021-06-16 and will be RETIRED at version 2024-12-18. Replaced by calling [ListCards](api-endpoint:Cards-ListCards) (for credit and debit cards on file) \nor [ListGiftCards](api-endpoint:GiftCards-ListGiftCards) (for gift cards on file) and including the `customer_id` query parameter. \nFor more information, see [Migration notes](https://developer.squareup.com/docs/customers-api/what-it-does#migrate-customer-cards)."
- target: $['components']['schemas']['Customer']['properties']['creation_source']
  update:
    description: 'The method used to create the customer profile.

      See [CustomerCreationSource](#type-customercreationsource) for possible values'
- target: $['components']['schemas']['Customer']['properties']['group_ids']
  update:
    description: The IDs of [customer groups](entity:CustomerGroup) the customer belongs to.
- target: $['components']['schemas']['Customer']['properties']['segment_ids']
  update:
    description: The IDs of [customer segments](entity:CustomerSegment) the customer belongs to.
- target: $['components']['schemas']['CustomerAddressFilter']['properties']['country']
  update:
    description: 'The country code to search for.

      See [Country](#type-country) for possible values'
- target: $['components']['schemas']['CustomerAddressFilter']
  update:
    description: 'The customer address filter. This filter is used in a [CustomerCustomAttributeFilterValue]($m/CustomerCustomAttributeFilterValue) filter when

      searching by an `Address`-type custom attribute.'
- target: $['components']['schemas']['CustomerCreationSourceFilter']['properties']['values']
  update:
    description: 'The list of creation sources used as filtering criteria.

      See [CustomerCreationSource](#type-customercreationsource) for possible values'
- target: $['components']['schemas']['CustomerCreationSourceFilter']['properties']['rule']
  update:
    description: 'Indicates whether a customer profile matching the filter criteria

      should be included in the result or excluded from the result.


      Default: `INCLUDE`.

      See [CustomerInclusionExclusion](#type-customerinclusionexclusion) for possible values'
- target: $['components']['schemas']['CustomerCustomAttributeFilter']['properties']['key']
  update:
    description: 'The `key` of the [custom attribute](entity:CustomAttribute) to filter by. The key is the identifier of the custom attribute

      (and the corresponding custom attribute definition) and can be retrieved using the [Customer Custom Attributes API](api:CustomerCustomAttributes).'
- target: $['components']['schemas']['CustomerCustomAttributeFilter']['properties']['filter']
  update:
    description: 'A filter that corresponds to the data type of the target custom attribute. For example, provide the `phone` filter to

      search based on the value of a `PhoneNumber`-type custom attribute. The data type is specified by the schema field of the custom attribute definition,

      which can be retrieved using the [Customer Custom Attributes API](api:CustomerCustomAttributes).


      You must provide this `filter` field, the `updated_at` field, or both.'
- target: $['components']['schemas']['CustomerCustomAttributeFilter']
  update:
    description: 'The custom attribute filter. Use this filter in a set of [custom attribute filters]($m/CustomerCustomAttributeFilters) to search

      based on the value or last updated date of a customer-related [custom attribute]($m/CustomAttribute).'
- target: $['components']['schemas']['CustomerCustomAttributeFilterValue']['properties']['email']
  update:
    description: 'A filter for a query based on the value of an `Email`-type custom attribute. This filter is case-insensitive and can

      include `exact` or `fuzzy`, but not both.


      For an `exact` match, provide the complete email address.


      For a `fuzzy` match, provide a query expression containing one or more query tokens to match against the email address. Square removes

      any punctuation (including periods (.), underscores (_), and the @ symbol) and tokenizes the email addresses on spaces. A match is found

      if a tokenized email address contains all the tokens in the search query, irrespective of the token order. For example, `Steven gmail`

      matches steven.jones@gmail.com and mygmail@stevensbakery.com.'
- target: $['components']['schemas']['CustomerCustomAttributeFilterValue']['properties']['selection']
  update:
    description: "A filter for a query based on the display name for a `Selection`-type custom attribute value. This filter is case-sensitive\nand can contain `any`, `all`, or both. The `none` condition is not supported.\n\nProvide the display name of each item that you want to search for. To find the display names for the selection, use the \n[Customer Custom Attributes API](api:CustomerCustomAttributes) to retrieve the corresponding custom attribute definition\nand then check the `schema.items.names` field. For more information, see\n[Search based on selection](https://developer.squareup.com/docs/customers-api/use-the-api/search-customers#custom-attribute-value-filter-selection).\n\nNote that when a `Selection`-type custom attribute is assigned to a customer profile, the custom attribute value is a list of one\nor more UUIDs (sourced from the `schema.items.enum` field) that map to the item names. These UUIDs are unique per seller."
- target: $['components']['schemas']['CustomerCustomAttributeFilterValue']
  update:
    description: "A type-specific filter used in a [custom attribute filter]($m/CustomerCustomAttributeFilter) to search based on the value \nof a customer-related [custom attribute]($m/CustomAttribute)."
- target: $['components']['schemas']['CustomerCustomAttributeFilters']
  update:
    description: 'The custom attribute filters in a set of [customer filters]($m/CustomerFilter) used in a search query. Use this filter

      to search based on [custom attributes]($m/CustomAttribute) that are assigned to customer profiles. For more information, see

      [Search by custom attribute](https://developer.squareup.com/docs/customers-api/use-the-api/search-customers#search-by-custom-attribute).'
- target: $['components']['schemas']['CustomerFilter']['properties']['email_address']
  update:
    description: "A filter to [select customers by their email address](https://developer.squareup.com/docs/customers-api/use-the-api/search-customers#search-by-email-address) \nvisible to the seller. \nThis filter is case-insensitive.\n\nFor [exact matching](https://developer.squareup.com/docs/customers-api/use-the-api/search-customers#exact-search-by-email-address), this\nfilter causes the search to return customer profiles \nwhose `email_address` field value are identical to the email address provided\nin the query.\n\nFor [fuzzy matching](https://developer.squareup.com/docs/customers-api/use-the-api/search-customers#fuzzy-search-by-email-address), \nthis filter causes the search to return customer profiles \nwhose `email_address` field value has a token-wise partial match against the filtering \nexpression in the query. For example, with `Steven gmail` provided in a search\nquery, the search returns customers whose email address is `steven.johnson@gmail.com` \nor `mygmail@stevensbakery.com`. Square removes any punctuation (including periods (.),\nunderscores (_), and the @ symbol) and tokenizes the email addresses on spaces. A match is\nfound if a tokenized email address contains all the tokens in the search query, \nirrespective of the token order."
- target: $['components']['schemas']['CustomerFilter']['properties']['group_ids']
  update:
    description: 'A filter to select customers based on the [groups](entity:CustomerGroup) they belong to.

      Group membership is controlled by sellers and developers.


      The `group_ids` filter has the following syntax:

      ```

      "group_ids": {

      "any":  ["{group_a_id}", "{group_b_id}", ...],

      "all":  ["{group_1_id}", "{group_2_id}", ...],

      "none": ["{group_i_id}", "{group_ii_id}", ...]

      }

      ```


      You can use any combination of the `any`, `all`, and `none` fields in the filter.

      With `any`, the search returns customers in groups `a` or `b` or any other group specified in the list.

      With `all`, the search returns customers in groups `1` and `2` and all other groups specified in the list.

      With `none`, the search returns customers not in groups `i` or `ii` or any other group specified in the list.


      If any of the search conditions are not met, including when an invalid or non-existent group ID is provided,

      the result is an empty object (`{}`).'
- target: $['components']['schemas']['CustomerFilter']['properties']['custom_attribute']
  update:
    description: "A filter to select customers based on one or more custom attributes.  \nThis filter can contain up to 10 custom attribute filters. Each custom attribute filter specifies filtering criteria for a target custom\nattribute. If multiple custom attribute filters are provided, they are combined as an `AND` operation.\n\nTo be valid for a search, the custom attributes must be visible to the requesting application. For more information, including example queries,\nsee [Search by custom attribute](https://developer.squareup.com/docs/customers-api/use-the-api/search-customers#search-by-custom-attribute).\n\nSquare returns matching customer profiles, which do not contain custom attributes. To retrieve customer-related custom attributes,\nuse the [Customer Custom Attributes API](api:CustomerCustomAttributes). For example, you can call\n[RetrieveCustomerCustomAttribute](api-endpoint:CustomerCustomAttributes-RetrieveCustomerCustomAttribute) using a customer ID from the result set."
- target: $['components']['schemas']['CustomerFilter']['properties']['segment_ids']
  update:
    description: ' A filter to select customers based on the [segments](entity:CustomerSegment) they belong to.

      Segment membership is dynamic and adjusts automatically based on whether customers meet the segment criteria.


      You can provide up to three segment IDs in the filter, using any combination of the `all`, `any`, and `none` fields.

      For the following example, the results include customers who belong to both segment A and segment B but do not belong to segment C.


      ```

      "segment_ids": {

      "all":  ["{segment_A_id}", "{segment_B_id}"],

      "none":  ["{segment_C_id}"]

      }

      ```


      If an invalid or non-existent segment ID is provided in the filter, Square stops processing the request

      and returns a `400 BAD_REQUEST` error that includes the segment ID.'
- target: $['components']['schemas']['CustomerFilter']
  update:
