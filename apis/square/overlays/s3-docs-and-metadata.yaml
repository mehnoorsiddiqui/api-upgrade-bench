- target: $['paths']['/v2/catalog/batch-delete']['post']
  update:
    description: 'Deletes a set of [CatalogItem]($m/CatalogItem)s based on the

      provided list of target IDs and returns a set of successfully deleted IDs in

      the response. Deletion is a cascading event such that all children of the

      targeted object are also deleted. For example, deleting a CatalogItem will

      also delete all of its [CatalogItemVariation]($m/CatalogItemVariation)

      children.


      `BatchDeleteCatalogObjects` succeeds even if only a portion of the targeted

      IDs can be deleted. The response will only include IDs that were

      actually deleted.


      To ensure consistency, only one delete request is processed at a time per seller account.

      While one (batch or non-batch) delete request is being processed, other (batched and non-batched)

      delete requests are rejected with the `429` error code.'
- target: $['paths']['/v2/catalog/batch-retrieve']['post']
  update:
    description: 'Returns a set of objects based on the provided ID.

      Each [CatalogItem]($m/CatalogItem) returned in the set includes all of its

      child information including: all of its

      [CatalogItemVariation]($m/CatalogItemVariation) objects, references to

      its [CatalogModifierList]($m/CatalogModifierList) objects, and the ids of

      any [CatalogTax]($m/CatalogTax) objects that apply to it.'
- target: $['paths']['/v2/catalog/batch-upsert']['post']
  update:
    x-endpoint-errors:
    - error-code: GENERIC_DECLINE
- target: $['paths']['/v2/catalog/list']['get']
  update:
    description: 'Returns a list of all [CatalogObject]($m/CatalogObject)s of the specified types in the catalog.


      The `types` parameter is specified as a comma-separated list of the [CatalogObjectType]($m/CatalogObjectType) values,

      for example, "`ITEM`, `ITEM_VARIATION`, `MODIFIER`, `MODIFIER_LIST`, `CATEGORY`, `DISCOUNT`, `TAX`, `IMAGE`".


      __Important:__ ListCatalog does not return deleted catalog items. To retrieve

      deleted catalog items, use [SearchCatalogObjects]($e/Catalog/SearchCatalogObjects)

      and set the `include_deleted_objects` attribute value to `true`.'
- target: $['paths']['/v2/catalog/list']['get']['parameters'][?(@.name == 'types' && @.in == 'query')]
  update:
    description: "An optional case-insensitive, comma-separated list of object types to retrieve.\n\nThe valid values are defined in the [CatalogObjectType](entity:CatalogObjectType) enum, for example,\n`ITEM`, `ITEM_VARIATION`, `CATEGORY`, `DISCOUNT`, `TAX`,\n`MODIFIER`, `MODIFIER_LIST`, `IMAGE`, etc.\n\nIf this is unspecified, the operation returns objects of all the top level types at the version\nof the Square API used to make the request. Object types that are nested onto other object types\nare not included in the defaults.\n\nAt the current API version the default object types are:\nITEM, CATEGORY, TAX, DISCOUNT, MODIFIER_LIST, \nPRICING_RULE, PRODUCT_SET, TIME_PERIOD, MEASUREMENT_UNIT,\nSUBSCRIPTION_PLAN, ITEM_OPTION, CUSTOM_ATTRIBUTE_DEFINITION, QUICK_AMOUNT_SETTINGS."
- target: $['paths']['/v2/catalog/list']['get']['parameters'][?(@.name == 'catalog_version' && @.in == 'query')]
  update:
    description: 'The specific version of the catalog objects to be included in the response.

      This allows you to retrieve historical versions of objects. The specified version value is matched against

      the [CatalogObject]($m/CatalogObject)s'' `version` attribute.  If not included, results will be from the

      current version of the catalog.'
- target: $['paths']['/v2/catalog/object']['post']
  update:
    description: 'Creates a new or updates the specified [CatalogObject]($m/CatalogObject).


      To ensure consistency, only one update request is processed at a time per seller account.

      While one (batch or non-batch) update request is being processed, other (batched and non-batched)

      update requests are rejected with the `429` error code.'
- target: $['paths']['/v2/catalog/object']['post']
  update:
    x-endpoint-errors:
    - error-code: GENERIC_DECLINE
    - error-code: INVALID_LOCATION
- target: $['paths']['/v2/catalog/object/{object_id}']['delete']
  update:
    description: 'Deletes a single [CatalogObject]($m/CatalogObject) based on the

      provided ID and returns the set of successfully deleted IDs in the response.

      Deletion is a cascading event such that all children of the targeted object

      are also deleted. For example, deleting a [CatalogItem]($m/CatalogItem)

      will also delete all of its

      [CatalogItemVariation]($m/CatalogItemVariation) children.


      To ensure consistency, only one delete request is processed at a time per seller account.

      While one (batch or non-batch) delete request is being processed, other (batched and non-batched)

      delete requests are rejected with the `429` error code.'
- target: $['paths']['/v2/catalog/object/{object_id}']['get']
  update:
    description: 'Returns a single [CatalogItem]($m/CatalogItem) as a

      [CatalogObject]($m/CatalogObject) based on the provided ID. The returned

      object includes all of the relevant [CatalogItem]($m/CatalogItem)

      information including: [CatalogItemVariation]($m/CatalogItemVariation)

      children, references to its

      [CatalogModifierList]($m/CatalogModifierList) objects, and the ids of

      any [CatalogTax]($m/CatalogTax) objects that apply to it.'
- target: $['paths']['/v2/catalog/object/{object_id}']['get']['parameters'][?(@.name == 'catalog_version' && @.in == 'query')]
  update:
    description: 'Requests objects as of a specific version of the catalog. This allows you to retrieve historical

      versions of objects. The value to retrieve a specific version of an object can be found

      in the version field of [CatalogObject]($m/CatalogObject)s. If not included, results will

      be from the current version of the catalog.'
- target: $['paths']['/v2/catalog/search']['post']
  update:
    description: 'Searches for [CatalogObject]($m/CatalogObject) of any type by matching supported search attribute values,

      excluding custom attribute values on items or item variations, against one or more of the specified query filters.


      This (`SearchCatalogObjects`) endpoint differs from the [SearchCatalogItems]($e/Catalog/SearchCatalogItems)

      endpoint in the following aspects:


      - `SearchCatalogItems` can only search for items or item variations, whereas `SearchCatalogObjects` can search for any type of catalog objects.

      - `SearchCatalogItems` supports the custom attribute query filters to return items or item variations that contain custom attribute values, where `SearchCatalogObjects` does not.

      - `SearchCatalogItems` does not support the `include_deleted_objects` filter to search for deleted items or item variations, whereas `SearchCatalogObjects` does.

      - The both endpoints have different call conventions, including the query filter formats.'
- target: $['paths']['/v2/catalog/search-catalog-items']['post']
  update:
    description: 'Searches for catalog items or item variations by matching supported search attribute values, including

      custom attribute values, against one or more of the specified query filters.


      This (`SearchCatalogItems`) endpoint differs from the [SearchCatalogObjects]($e/Catalog/SearchCatalogObjects)

      endpoint in the following aspects:


      - `SearchCatalogItems` can only search for items or item variations, whereas `SearchCatalogObjects` can search for any type of catalog objects.

      - `SearchCatalogItems` supports the custom attribute query filters to return items or item variations that contain custom attribute values, where `SearchCatalogObjects` does not.

      - `SearchCatalogItems` does not support the `include_deleted_objects` filter to search for deleted items or item variations, whereas `SearchCatalogObjects` does.

      - The both endpoints use different call conventions, including the query filter formats.'
- target: $['paths']['/v2/catalog/update-item-modifier-lists']['post']
  update:
    description: 'Updates the [CatalogModifierList]($m/CatalogModifierList) objects

      that apply to the targeted [CatalogItem]($m/CatalogItem) without having

      to perform an upsert on the entire item.'
- target: $['paths']['/v2/catalog/update-item-taxes']['post']
  update:
    description: 'Updates the [CatalogTax]($m/CatalogTax) objects that apply to the

      targeted [CatalogItem]($m/CatalogItem) without having to perform an

      upsert on the entire item.'
