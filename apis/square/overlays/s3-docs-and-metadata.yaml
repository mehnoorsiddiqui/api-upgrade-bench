  update:
    description: '[Errors](entity:Error) encountered during the search.'
- target: $['components']['schemas']['SearchOrdersResponse']
  update:
    description: 'Either the `order_entries` or `orders` field is set, depending on whether

      `return_entries` is set on the [SearchOrdersRequest]($e/Orders/SearchOrders).'
- target: $['components']['schemas']['SearchOrdersSort']['properties']['sort_field']
  update:
    description: 'The field to sort by.


      __Important:__ When using a [DateTimeFilter](entity:SearchOrdersFilter),

      `sort_field` must match the timestamp field that the `DateTimeFilter` uses to

      filter. For example, if you set your `sort_field` to `CLOSED_AT` and you use a

      `DateTimeFilter`, your `DateTimeFilter` must filter for orders by their `CLOSED_AT` date.

      If this field does not match the timestamp field in `DateTimeFilter`,

      `SearchOrders` returns an error.


      Default: `CREATED_AT`.

      See [SearchOrdersSortField](#type-searchorderssortfield) for possible values'
- target: $['components']['schemas']['SearchOrdersSort']['properties']['sort_order']
  update:
    description: 'The chronological order in which results are returned. Defaults to `DESC`.

      See [SortOrder](#type-sortorder) for possible values'
