- target: $['components']['schemas']['LoyaltyEventOrderFilter']['properties']['order_id']
  update:
    description: The ID of the [order](entity:Order) associated with the event.
- target: $['components']['schemas']['LoyaltyEventOther']['properties']['loyalty_program_id']
  update:
    description: The Square-assigned ID of the [loyalty program](entity:LoyaltyProgram).
- target: $['components']['schemas']['LoyaltyEventRedeemReward']['properties']['loyalty_program_id']
  update:
    description: The ID of the [loyalty program](entity:LoyaltyProgram).
- target: $['components']['schemas']['LoyaltyEventRedeemReward']['properties']['reward_id']
  update:
    description: 'The ID of the redeemed [loyalty reward](entity:LoyaltyReward).

      This field is returned only if the event source is `LOYALTY_API`.'
- target: $['components']['schemas']['LoyaltyEventRedeemReward']['properties']['order_id']
  update:
    description: 'The ID of the [order](entity:Order) that redeemed the reward.

      This field is returned only if the Orders API is used to process orders.'
- target: $['components']['schemas']['LoyaltyEventType']['x-enum-elements']
  remove: true
- target: $['components']['schemas']['LoyaltyEventType']
  update:
    x-enum-elements:
    - name: ACCUMULATE_POINTS
      description: 'Points are added to a loyalty account for a purchase that

        qualified for points based on an [accrual rule]($m/LoyaltyProgramAccrualRule).'
    - name: CREATE_REWARD
      description: A [loyalty reward]($m/LoyaltyReward) is created.
    - name: REDEEM_REWARD
      description: A loyalty reward is redeemed.
    - name: DELETE_REWARD
      description: A loyalty reward is deleted.
    - name: ADJUST_POINTS
      description: Loyalty points are manually adjusted.
    - name: EXPIRE_POINTS
      description: "Loyalty points are expired according to the \nexpiration policy of the loyalty program."
    - name: OTHER
      description: Some other loyalty event occurred.
    - name: ACCUMULATE_PROMOTION_POINTS
      description: ' Points are added to a loyalty account for a purchase that

        qualified for a [loyalty promotion]($m/LoyaltyPromotion).'
- target: $['components']['schemas']['LoyaltyEventTypeFilter']['properties']['types']
  update:
    description: "The loyalty event types used to filter the result.\nIf multiple values are specified, the endpoint uses a \nlogical OR to combine them.\nSee [LoyaltyEventType](#type-loyaltyeventtype) for possible values"
- target: $['components']['schemas']['LoyaltyProgram']['properties']['status']
  update:
    description: 'Whether the program is currently active.

      See [LoyaltyProgramStatus](#type-loyaltyprogramstatus) for possible values'
- target: $['components']['schemas']['LoyaltyProgram']['properties']['location_ids']
  update:
    description: The [locations](entity:Location) at which the program is active.
- target: $['components']['schemas']['LoyaltyProgram']['properties']['accrual_rules']
  update:
    description: 'Defines how buyers can earn loyalty points from the base loyalty program.

      To check for associated [loyalty promotions](entity:LoyaltyPromotion) that enable

      buyers to earn extra points, call [ListLoyaltyPromotions](api-endpoint:Loyalty-ListLoyaltyPromotions).'
- target: $['components']['schemas']['LoyaltyProgramAccrualRule']['properties']['accrual_type']
  update:
    description: 'The type of the accrual rule that defines how buyers can earn points.

      See [LoyaltyProgramAccrualRuleType](#type-loyaltyprogramaccrualruletype) for possible values'
- target: $['components']['schemas']['LoyaltyProgramAccrualRule']
  update:
    description: Represents an accrual rule, which defines how buyers can earn points from the base [loyalty program]($m/LoyaltyProgram).
- target: $['components']['schemas']['LoyaltyProgramAccrualRuleCategoryData']['properties']['category_id']
  update:
    description: 'The ID of the `CATEGORY` [catalog object](entity:CatalogObject) that buyers can purchase to earn

      points.'
- target: $['components']['schemas']['LoyaltyProgramAccrualRuleItemVariationData']['properties']['item_variation_id']
  update:
    description: 'The ID of the `ITEM_VARIATION` [catalog object](entity:CatalogObject) that buyers can purchase to earn

      points.'
- target: $['components']['schemas']['LoyaltyProgramAccrualRuleSpendData']['properties']['excluded_category_ids']
  update:
    description: 'The IDs of any `CATEGORY` catalog objects that are excluded from points accrual.


      You can use the [BatchRetrieveCatalogObjects](api-endpoint:Catalog-BatchRetrieveCatalogObjects)

      endpoint to retrieve information about the excluded categories.'
- target: $['components']['schemas']['LoyaltyProgramAccrualRuleSpendData']['properties']['excluded_item_variation_ids']
  update:
    description: 'The IDs of any `ITEM_VARIATION` catalog objects that are excluded from points accrual.


      You can use the [BatchRetrieveCatalogObjects](api-endpoint:Catalog-BatchRetrieveCatalogObjects)

      endpoint to retrieve information about the excluded item variations.'
- target: $['components']['schemas']['LoyaltyProgramAccrualRuleSpendData']['properties']['tax_mode']
  update:
    description: 'Indicates how taxes should be treated when calculating the purchase amount used for points accrual.

      See [LoyaltyProgramAccrualRuleTaxMode](#type-loyaltyprogramaccrualruletaxmode) for possible values'
- target: $['components']['schemas']['LoyaltyProgramAccrualRuleVisitData']['properties']['tax_mode']
  update:
    description: "Indicates how taxes should be treated when calculating the purchase amount to determine whether the visit qualifies for points. \nThis setting applies only if `minimum_amount_money` is specified.\nSee [LoyaltyProgramAccrualRuleTaxMode](#type-loyaltyprogramaccrualruletaxmode) for possible values"
- target: $['components']['schemas']['LoyaltyProgramRewardDefinition']['properties']['scope']
  update:
    description: 'Indicates the scope of the reward tier. DEPRECATED at version 2020-12-16. You can find this information in the

      `product_set_data` field of the `PRODUCT_SET` catalog object referenced by the pricing rule. For `ORDER` scopes,

      `all_products` is true. For `ITEM_VARIATION` or `CATEGORY` scopes, `product_ids_any` is a list of

      catalog object IDs of the given type.

      See [LoyaltyProgramRewardDefinitionScope](#type-loyaltyprogramrewarddefinitionscope) for possible values'
- target: $['components']['schemas']['LoyaltyProgramRewardDefinition']['properties']['discount_type']
  update:
    description: 'The type of discount the reward tier offers. DEPRECATED at version 2020-12-16. You can find this information

      in the `discount_data.discount_type` field of the `DISCOUNT` catalog object referenced by the pricing rule.

      See [LoyaltyProgramRewardDefinitionType](#type-loyaltyprogramrewarddefinitiontype) for possible values'
- target: $['components']['schemas']['LoyaltyProgramRewardTier']['properties']['pricing_rule_reference']
  update:
    description: 'A reference to the specific version of a `PRICING_RULE` catalog object that contains information about the reward tier discount.


      Use `object_id` and `catalog_version` with the [RetrieveCatalogObject](api-endpoint:Catalog-RetrieveCatalogObject) endpoint

      to get discount details. Make sure to set `include_related_objects` to true in the request to retrieve all catalog objects

      that define the discount. For more information, see [Getting discount details for a reward tier](https://developer.squareup.com/docs/loyalty-api/loyalty-rewards#get-discount-details).'
- target: $['components']['schemas']['LoyaltyPromotion']['properties']['status']
  update:
    description: 'The current status of the promotion.

      See [LoyaltyPromotionStatus](#type-loyaltypromotionstatus) for possible values'
- target: $['components']['schemas']['LoyaltyPromotion']['properties']['loyalty_program_id']
  update:
    description: The ID of the [loyalty program](entity:LoyaltyProgram) associated with the promotion.
- target: $['components']['schemas']['LoyaltyPromotion']['properties']['qualifying_item_variation_ids']
  update:
    description: 'The IDs of any qualifying `ITEM_VARIATION` [catalog objects](entity:CatalogObject). If specified,

      the purchase must include at least one of these items to qualify for the promotion.


      This option is valid only if the base loyalty program uses a `VISIT` or `SPEND` accrual rule.

      With `SPEND` accrual rules, make sure that qualifying promotional items are not excluded.


      You can specify `qualifying_item_variation_ids` or `qualifying_category_ids` for a given promotion, but not both.'
- target: $['components']['schemas']['LoyaltyPromotion']['properties']['qualifying_category_ids']
  update:
    description: 'The IDs of any qualifying `CATEGORY` [catalog objects](entity:CatalogObject). If specified,

      the purchase must include at least one item from one of these categories to qualify for the promotion.


      This option is valid only if the base loyalty program uses a `VISIT` or `SPEND` accrual rule.

      With `SPEND` accrual rules, make sure that qualifying promotional items are not excluded.


      You can specify `qualifying_category_ids` or `qualifying_item_variation_ids` for a promotion, but not both.'
- target: $['components']['schemas']['LoyaltyPromotion']
  update:
    description: 'Represents a promotion for a [loyalty program]($m/LoyaltyProgram). Loyalty promotions enable buyers

      to earn extra points on top of those earned from the base program.


      A loyalty program can have a maximum of 10 loyalty promotions with an `ACTIVE` or `SCHEDULED` status.'
- target: $['components']['schemas']['LoyaltyPromotionAvailableTimeData']
  update:
    description: 'Represents scheduling information that determines when purchases can qualify to earn points

      from a [loyalty promotion]($m/LoyaltyPromotion).'
- target: $['components']['schemas']['LoyaltyPromotionIncentive']['properties']['type']
  update:
    description: 'The type of points incentive.

      See [LoyaltyPromotionIncentiveType](#type-loyaltypromotionincentivetype) for possible values'
- target: $['components']['schemas']['LoyaltyPromotionIncentive']
  update:
    description: 'Represents how points for a [loyalty promotion]($m/LoyaltyPromotion) are calculated,

      either by multiplying the points earned from the base program or by adding a specified number

      of points to the points earned from the base program.'
- target: $['components']['schemas']['LoyaltyPromotionIncentivePointsAdditionData']
  update:
    description: Represents the metadata for a `POINTS_ADDITION` type of [loyalty promotion incentive]($m/LoyaltyPromotionIncentive).
- target: $['components']['schemas']['LoyaltyPromotionIncentivePointsMultiplierData']
  update:
    description: Represents the metadata for a `POINTS_MULTIPLIER` type of [loyalty promotion incentive]($m/LoyaltyPromotionIncentive).
- target: $['components']['schemas']['LoyaltyPromotionIncentiveType']
  update:
    description: 'Indicates the type of points incentive for a [loyalty promotion]($m/LoyaltyPromotion),

      which is used to determine how buyers can earn points from the promotion.'
- target: $['components']['schemas']['LoyaltyPromotionStatus']
  update:
    description: Indicates the status of a [loyalty promotion]($m/LoyaltyPromotion).
- target: $['components']['schemas']['LoyaltyPromotionTriggerLimit']['properties']['interval']
  update:
    description: 'The time period the limit applies to.

      See [LoyaltyPromotionTriggerLimitInterval](#type-loyaltypromotiontriggerlimitinterval) for possible values'
- target: $['components']['schemas']['LoyaltyPromotionTriggerLimit']
  update:
    description: 'Represents the number of times a buyer can earn points during a [loyalty promotion]($m/LoyaltyPromotion).

      If this field is not set, buyers can trigger the promotion an unlimited number of times to earn points during

      the time that the promotion is available.


      A purchase that is disqualified from earning points because of this limit might qualify for another active promotion.'
- target: $['components']['schemas']['LoyaltyPromotionTriggerLimitInterval']
  update:
    description: 'Indicates the time period that the [trigger limit]($m/LoyaltyPromotionTriggerLimit) applies to,

      which is used to determine the number of times a buyer can earn points for a [loyalty promotion]($m/LoyaltyPromotion).'
- target: $['components']['schemas']['LoyaltyReward']['properties']['status']
  update:
    description: 'The status of a loyalty reward.

      See [LoyaltyRewardStatus](#type-loyaltyrewardstatus) for possible values'
- target: $['components']['schemas']['LoyaltyReward']['properties']['loyalty_account_id']
  update:
    description: The Square-assigned ID of the [loyalty account](entity:LoyaltyAccount) to which the reward belongs.
- target: $['components']['schemas']['LoyaltyReward']['properties']['reward_tier_id']
  update:
    description: The Square-assigned ID of the [reward tier](entity:LoyaltyProgramRewardTier) used to create the reward.
- target: $['components']['schemas']['LoyaltyReward']['properties']['order_id']
  update:
    description: The Square-assigned ID of the [order](entity:Order) to which the reward is attached.
- target: $['components']['schemas']['LoyaltyReward']
  update:
    description: "Represents a contract to redeem loyalty points for a [reward tier]($m/LoyaltyProgramRewardTier) discount. Loyalty rewards can be in an ISSUED, REDEEMED, or DELETED state. \nFor more information, see [Manage loyalty rewards](https://developer.squareup.com/docs/loyalty-api/loyalty-rewards)."
- target: $['components']['schemas']['MeasurementUnit']['properties']['area_unit']
  update:
    description: 'Represents a standard area unit.

      See [MeasurementUnitArea](#type-measurementunitarea) for possible values'
- target: $['components']['schemas']['MeasurementUnit']['properties']['length_unit']
  update:
    description: 'Represents a standard length unit.

      See [MeasurementUnitLength](#type-measurementunitlength) for possible values'
- target: $['components']['schemas']['MeasurementUnit']['properties']['volume_unit']
  update:
    description: 'Represents a standard volume unit.

      See [MeasurementUnitVolume](#type-measurementunitvolume) for possible values'
- target: $['components']['schemas']['MeasurementUnit']['properties']['weight_unit']
  update:
    description: 'Represents a standard unit of weight or mass.

      See [MeasurementUnitWeight](#type-measurementunitweight) for possible values'
- target: $['components']['schemas']['MeasurementUnit']['properties']['generic_unit']
  update:
    description: 'Reserved for API integrations that lack the ability to specify a real measurement unit

      See [MeasurementUnitGeneric](#type-measurementunitgeneric) for possible values'
- target: $['components']['schemas']['MeasurementUnit']['properties']['time_unit']
  update:
    description: 'Represents a standard unit of time.

      See [MeasurementUnitTime](#type-measurementunittime) for possible values'
- target: $['components']['schemas']['MeasurementUnit']['properties']['type']
  update:
    description: 'Represents the type of the measurement unit.

      See [MeasurementUnitUnitType](#type-measurementunitunittype) for possible values'
- target: $['components']['schemas']['MeasurementUnitGeneric']['description']
  remove: true
- target: $['components']['schemas']['Merchant']['properties']['country']
  update:
    description: 'The country code associated with the merchant, in the two-letter format of ISO 3166. For example, `US` or `JP`.

      See [Country](#type-country) for possible values'
- target: $['components']['schemas']['Merchant']['properties']['currency']
  update:
    description: 'The currency associated with the merchant, in ISO 4217 format. For example, the currency code for US dollars is `USD`.

      See [Currency](#type-currency) for possible values'
- target: $['components']['schemas']['Merchant']['properties']['status']
  update:
    description: 'The merchant''s status.

      See [MerchantStatus](#type-merchantstatus) for possible values'
- target: $['components']['schemas']['MerchantStatus']['description']
  remove: true
- target: $['components']['schemas']['Money']['properties']['currency']
  update:
    description: 'The type of currency, in __ISO 4217 format__. For example, the currency

      code for US dollars is `USD`.


      See [Currency](entity:Currency) for possible values.

      See [Currency](#type-currency) for possible values'
- target: $['components']['schemas']['ObtainTokenRequest']['description']
  remove: true
- target: $['components']['schemas']['ObtainTokenRequest']['example']
  remove: true
- target: $['components']['schemas']['ObtainTokenRequest']
  update:
    example:
      client_id: APPLICATION_ID
      client_secret: APPLICATION_SECRET
      code: CODE_FROM_AUTHORIZE
      grant_type: authorization_code
- target: $['components']['schemas']['ObtainTokenResponse']['description']
  remove: true
- target: $['components']['schemas']['Order']['properties']['customer_id']
  update:
    description: 'The ID of the [customer]($m/Customer) associated with the order.


      You should specify a `customer_id` on the order (or the payment) to ensure that transactions

      are reliably linked to customers. Omitting this field might result in the creation of new

      [instant profiles](https://developer.squareup.com/docs/customers-api/what-it-does#instant-profiles).'
- target: $['components']['schemas']['Order']['properties']['closed_at']
  update:
    description: The timestamp for when the order reached a terminal [state](entity:OrderState), in RFC 3339 format (for example "2016-09-04T23:59:33.123Z").
- target: $['components']['schemas']['Order']['properties']['state']
  update:
    description: 'The current state of the order.

      See [OrderState](#type-orderstate) for possible values'
- target: $['components']['schemas']['Order']['properties']['pricing_options']
  update:
    description: 'Pricing options for an order. The options affect how the order''s price is calculated.

      They can be used, for example, to apply automatic price adjustments that are based on

      preconfigured [pricing rules](entity:CatalogPricingRule).'
- target: $['components']['schemas']['OrderCreated']['properties']['state']
  update:
    description: 'The state of the order.

      See [OrderState](#type-orderstate) for possible values'
- target: $['components']['schemas']['OrderCreated']['description']
  remove: true
- target: $['components']['schemas']['OrderCreatedObject']['description']
  remove: true
- target: $['components']['schemas']['OrderEntry']
  update:
    description: 'A lightweight description of an [order]($m/Order) that is returned when

      `returned_entries` is `true` on a [SearchOrdersRequest]($e/Orders/SearchOrders).'
- target: $['components']['schemas']['OrderFulfillment']['properties']['type']
  update:
    description: 'The type of the fulfillment.

      See [OrderFulfillmentType](#type-orderfulfillmenttype) for possible values'
- target: $['components']['schemas']['OrderFulfillment']['properties']['state']
  update:
    description: 'The state of the fulfillment.

      See [OrderFulfillmentState](#type-orderfulfillmentstate) for possible values'
- target: $['components']['schemas']['OrderFulfillment']['properties']['line_item_application']
  update:
    description: 'Describes what order line items this fulfillment applies to.

      It can be `ALL` or `ENTRY_LIST` with a supplied list of fulfillment entries.

      See [OrderFulfillmentFulfillmentLineItemApplication](#type-orderfulfillmentfulfillmentlineitemapplication) for possible values'
- target: $['components']['schemas']['OrderFulfillmentDeliveryDetails']['properties']['schedule_type']
  update:
    description: 'Indicates the fulfillment delivery schedule type. If `SCHEDULED`, then

      `deliver_at` is required. If `ASAP`, then `prep_time_duration` is required. The default is `SCHEDULED`.

      See [OrderFulfillmentDeliveryDetailsScheduleType](#type-orderfulfillmentdeliverydetailsscheduletype) for possible values'
- target: $['components']['schemas']['OrderFulfillmentPickupDetails']['properties']['schedule_type']
  update:
    description: 'The schedule type of the pickup fulfillment. Defaults to `SCHEDULED`.

      See [OrderFulfillmentPickupDetailsScheduleType](#type-orderfulfillmentpickupdetailsscheduletype) for possible values'
- target: $['components']['schemas']['OrderFulfillmentType']['x-enum-elements']
  remove: true
- target: $['components']['schemas']['OrderFulfillmentType']
  update:
    x-enum-elements:
    - name: PICKUP
      description: A recipient to pick up the fulfillment from a physical [location]($m/Location).
    - name: SHIPMENT
      description: A shipping carrier to ship the fulfillment.
    - name: DELIVERY
      description: A courier to deliver the fulfillment.
- target: $['components']['schemas']['OrderFulfillmentUpdated']['properties']['state']
  update:
    description: 'The state of the order.

      See [OrderState](#type-orderstate) for possible values'
- target: $['components']['schemas']['OrderFulfillmentUpdated']['description']
  remove: true
- target: $['components']['schemas']['OrderFulfillmentUpdatedObject']['description']
  remove: true
- target: $['components']['schemas']['OrderLineItem']['properties']['catalog_object_id']
  update:
    description: The [CatalogItemVariation](entity:CatalogItemVariation) ID applied to this line item.
- target: $['components']['schemas']['OrderLineItem']['properties']['item_type']
  update:
    description: 'The type of line item: an itemized sale, a non-itemized sale (custom amount), or the

      activation or reloading of a gift card.

      See [OrderLineItemItemType](#type-orderlineitemitemtype) for possible values'
- target: $['components']['schemas']['OrderLineItem']['properties']['modifiers']
  update:
    description: The [CatalogModifier](entity:CatalogModifier)s applied to this line item.
- target: $['components']['schemas']['OrderLineItemAppliedServiceCharge']['description']
  remove: true
- target: $['components']['schemas']['OrderLineItemDiscount']['properties']['catalog_object_id']
  update:
    description: The catalog object ID referencing [CatalogDiscount](entity:CatalogDiscount).
- target: $['components']['schemas']['OrderLineItemDiscount']['properties']['type']
  update:
    description: 'The type of the discount.


      Discounts that do not reference a catalog object ID must have a type of

      `FIXED_PERCENTAGE` or `FIXED_AMOUNT`.

      See [OrderLineItemDiscountType](#type-orderlineitemdiscounttype) for possible values'
- target: $['components']['schemas']['OrderLineItemDiscount']['properties']['scope']
  update:
    description: 'Indicates the level at which the discount applies. For `ORDER` scoped discounts,

      Square generates references in `applied_discounts` on all order line items that do

      not have them. For `LINE_ITEM` scoped discounts, the discount only applies to line items

      with a discount reference in their `applied_discounts` field.


      This field is immutable. To change the scope of a discount, you must delete

      the discount and re-add it as a new discount.

      See [OrderLineItemDiscountScope](#type-orderlineitemdiscountscope) for possible values'
- target: $['components']['schemas']['OrderLineItemDiscount']['properties']['pricing_rule_id']
  update:
    description: 'The object ID of a [pricing rule](entity:CatalogPricingRule) to be applied

      automatically to this discount. The specification and application of the discounts, to

      which a `pricing_rule_id` is assigned, are completely controlled by the corresponding

      pricing rule.'
- target: $['components']['schemas']['OrderLineItemModifier']['properties']['catalog_object_id']
  update:
    description: The catalog object ID referencing [CatalogModifier](entity:CatalogModifier).
- target: $['components']['schemas']['OrderLineItemModifier']['properties']['base_price_money']
  update:
    description: 'The base price for the modifier.


      `base_price_money` is required for ad hoc modifiers.

      If both `catalog_object_id` and `base_price_money` are set, `base_price_money` will

      override the predefined [CatalogModifier](entity:CatalogModifier) price.'
- target: $['components']['schemas']['OrderLineItemModifier']
  update:
    description: A [CatalogModifier]($m/CatalogModifier).
- target: $['components']['schemas']['OrderLineItemTax']['properties']['catalog_object_id']
  update:
    description: The catalog object ID referencing [CatalogTax](entity:CatalogTax).
- target: $['components']['schemas']['OrderLineItemTax']['properties']['type']
  update:
    description: 'Indicates the calculation method used to apply the tax.

      See [OrderLineItemTaxType](#type-orderlineitemtaxtype) for possible values'
- target: $['components']['schemas']['OrderLineItemTax']['properties']['scope']
  update:
    description: 'Indicates the level at which the tax applies. For `ORDER` scoped taxes,

      Square generates references in `applied_taxes` on all order line items that do

      not have them. For `LINE_ITEM` scoped taxes, the tax only applies to line items

      with references in their `applied_taxes` field.


      This field is immutable. To change the scope, you must delete the tax and

      re-add it as a new tax.

      See [OrderLineItemTaxScope](#type-orderlineitemtaxscope) for possible values'
- target: $['components']['schemas']['OrderPricingOptions']
  update:
    description: 'Pricing options for an order. The options affect how the order''s price is calculated.

      They can be used, for example, to apply automatic price adjustments that are based on preconfigured

      [pricing rules]($m/CatalogPricingRule).'
- target: $['components']['schemas']['OrderQuantityUnit']['properties']['measurement_unit']
  update:
    description: 'A [MeasurementUnit](entity:MeasurementUnit) that represents the

      unit of measure for the quantity.'
- target: $['components']['schemas']['OrderQuantityUnit']['properties']['catalog_object_id']
  update:
    description: 'The catalog object ID referencing the

      [CatalogMeasurementUnit](entity:CatalogMeasurementUnit).


      This field is set when this is a catalog-backed measurement unit.'
- target: $['components']['schemas']['OrderReturnDiscount']['properties']['catalog_object_id']
  update:
    description: The catalog object ID referencing [CatalogDiscount](entity:CatalogDiscount).
- target: $['components']['schemas']['OrderReturnDiscount']['properties']['type']
  update:
