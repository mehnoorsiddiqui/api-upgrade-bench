      Only applications that use the Orders API to process orders can trigger this event.'
- target: $['components']['schemas']['LoyaltyEventAdjustPoints']['properties']['loyalty_program_id']
  update:
    description: The Square-assigned ID of the [loyalty program](entity:LoyaltyProgram).
- target: $['components']['schemas']['LoyaltyEventCreateReward']['properties']['loyalty_program_id']
  update:
