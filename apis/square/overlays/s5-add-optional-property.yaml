      x-release-status: BETA
      nullable: true
- target: $['components']['schemas']['CatalogModifierList']['properties']
  update:
    allow_quantities:
      type: boolean
      description: When `true`, allows multiple quantities of the same modifier to be selected.
      x-release-status: BETA
      nullable: true
- target: $['components']['schemas']['CatalogModifierList']['properties']
  update:
    is_conversational:
      type: boolean
      description: True if modifiers belonging to this list can be used conversationally.
      x-release-status: BETA
      nullable: true
- target: $['components']['schemas']['CatalogModifierList']['properties']
  update:
    min_selected_modifiers:
      type: integer
      description: 'The minimum number of modifiers that must be selected from this list. The value can be overridden with `CatalogItemModifierListInfo`.


        Values:


        - 0: No selection is required.

        - -1: Default value, the attribute was not set by the client. Treated as no selection required.

        - &gt;0: The required minimum modifier selections. This can be larger than the total `CatalogModifiers` when `allow_quantities` is enabled.

        - &lt; -1: Invalid. Treated as no selection required.'
      format: int64
      x-release-status: BETA
      nullable: true
- target: $['components']['schemas']['CatalogModifierList']['properties']
  update:
    max_selected_modifiers:
      type: integer
      description: 'The maximum number of modifiers that must be selected from this list. The value can be overridden with `CatalogItemModifierListInfo`.


        Values:


        - 0: No maximum limit.

        - -1: Default value, the attribute was not set by the client. Treated as no maximum limit.

        - &gt;0: The maximum total modifier selections. This can be larger than the total `CatalogModifiers` when `allow_quantities` is enabled.

        - &lt; -1: Invalid. Treated as no maximum limit.'
      format: int64
      x-release-status: BETA
      nullable: true
- target: $['components']['schemas']['CatalogModifierList']['properties']
  update:
    hidden_from_customer:
      type: boolean
      description: 'If `true`, modifiers from this list are hidden from customer receipts. The default value is `false`.

        This setting can be overridden with `CatalogItemModifierListInfo.hidden_from_customer_override`.'
      x-release-status: BETA
      nullable: true
- target: $['components']['schemas']['CatalogModifierOverride']['properties']
  update:
    hidden_online_override:
      $ref: '#/components/schemas/CatalogModifierToggleOverrideType'
      description: 'If `YES`, this setting overrides the `hidden_online` setting on the `CatalogModifier` object,

        and the modifier is always hidden from online sales channels.

        If `NO`, the modifier is not hidden. It is always visible in online sales channels for this catalog item.

        `NOT_SET` means the `hidden_online` setting on the `CatalogModifier` object is obeyed.

        See [CatalogModifierToggleOverrideType](#type-catalogmodifiertoggleoverridetype) for possible values'
      x-release-status: BETA
      nullable: true
- target: $['components']['schemas']['CatalogModifierOverride']['properties']
  update:
    on_by_default_override:
      $ref: '#/components/schemas/CatalogModifierToggleOverrideType'
      description: 'If `YES`, this setting overrides the `on_by_default` setting on the `CatalogModifier` object,

        and the modifier is always selected by default for the catalog item.


        If `NO`, the modifier is not selected by default for this catalog item.

        `NOT_SET` means the `on_by_default` setting on the `CatalogModifier` object is obeyed.

        See [CatalogModifierToggleOverrideType](#type-catalogmodifiertoggleoverridetype) for possible values'
      x-release-status: BETA
      nullable: true
