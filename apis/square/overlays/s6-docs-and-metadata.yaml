- target: $['components']['schemas']['ExcludeStrategy']['x-enum-elements']
  remove: true
- target: $['components']['schemas']['ExcludeStrategy']
  update:
    x-enum-elements:
    - name: LEAST_EXPENSIVE
      description: 'The least expensive matched products are excluded from the pricing. If

        the pricing rule is set to exclude one product and multiple products in the

        match set qualify as least expensive, then one will be excluded at random.


        Excluding the least expensive product gives the best discount value to the buyer.'
    - name: MOST_EXPENSIVE
      description: 'The most expensive matched product is excluded from the pricing rule.

        If multiple products have the same price and all qualify as least expensive,

        one will be excluded at random.


        This guarantees that the most expensive product is purchased at full price.'
    - name: MOST_EXPENSIVE_LOWEST_VALUE
      description: 'Like MOST_EXPENSIVE, the most expensive matched product is excluded and

        purchased at full price. However, instead of maximizing the discount value on

        the remaining products (standard BOGO), the discount is applied to the CHEAPEST

        remaining eligible product.


        Used by the "lowest-value free item" coupon shape where the intent is to make

        the least expensive item free, not the most valuable one.'
- target: $['components']['schemas']['FulfillmentDeliveryDetails']['properties']['schedule_type']
  update:
    description: 'Indicates the fulfillment delivery schedule type. If `SCHEDULED`, then

      `deliver_at` is required. The default is `SCHEDULED`.

      See [OrderFulfillmentDeliveryDetailsScheduleType](#type-orderfulfillmentdeliverydetailsscheduletype) for possible values'
- target: $['components']['schemas']['FulfillmentDeliveryDetails']['properties']['deliver_at']
  update:
    description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

      that represents the start of the delivery period.

      The application can set this field while the fulfillment `state` is

      `PROPOSED`, `RESERVED`, or `PREPARED` (any time before the

      terminal state such as `COMPLETED`, `CANCELED`, and `FAILED`).


      The timestamp must be in RFC 3339 format

      (for example, "2016-09-04T23:59:33.123Z").


      For fulfillments with the schedule type `ASAP`, this is automatically set

      to the current time plus `prep_time_duration`, if available.'
- target: $['components']['schemas']['FulfillmentDeliveryDetails']['properties']['prep_time_duration']
  update:
    description: 'The [duration](https://developer.squareup.com/docs/build-basics/working-with-dates)

      needed to prepare and deliver this fulfillment.

      The duration must be in RFC 3339 format (for example, "PT30M" for 30 minutes). Don''t confuse

      "M" for months with "M" for minutes. "P5M" means 5 months, while "PT5M" means 5 minutes.'
- target: $['components']['schemas']['FulfillmentDeliveryDetails']['properties']['delivery_window_duration']
  update:
    description: 'The [duration](https://developer.squareup.com/docs/build-basics/working-with-dates)

      after `deliver_at` in which to deliver the order.

      Applications can set this field when the fulfillment `state` is

      `PROPOSED`, `RESERVED`, or `PREPARED` (any time before the terminal state

      such as `COMPLETED`, `CANCELED`, and `FAILED`).


      The duration must be in RFC 3339 format (for example, "PT30M" for 30 minutes). Don''t confuse

      "M" for months with "M" for minutes. "P5M" means 5 months, while "PT5M" means 5 minutes.'
- target: $['components']['schemas']['FulfillmentDeliveryDetails']['properties']['courier_pickup_window_duration']
  update:
    description: 'The [duration](https://developer.squareup.com/docs/build-basics/working-with-dates)

      after `courier_pickup_at` in which the courier should pick up the order.

      The duration must be in RFC 3339 format (for example, "PT30M" for 30 minutes). Don''t confuse

      "M" for months with "M" for minutes. "P5M" means 5 months, while "PT5M" means 5 minutes.'
- target: $['components']['schemas']['FulfillmentPickupDetails']['properties']['auto_complete_duration']
  update:
    description: 'The [duration](https://developer.squareup.com/docs/build-basics/working-with-dates)

      after which an in-progress pickup fulfillment is automatically moved

      to the `COMPLETED` state. The duration must be in RFC 3339 format (for example, "PT4H" for 4 hours).


      If not set, this pickup fulfillment remains in progress until it is canceled or completed.'
- target: $['components']['schemas']['FulfillmentPickupDetails']['properties']['pickup_at']
  update:
    description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

      that represents the start of the pickup window. Must be in RFC 3339 timestamp format, e.g.,

      "2016-09-04T23:59:33.123Z".


      For fulfillments with the schedule type `ASAP`, this is automatically set

      to the current time plus `prep_time_duration`, if available.'
- target: $['components']['schemas']['FulfillmentPickupDetails']['properties']['pickup_window_duration']
  update:
    description: 'The [duration](https://developer.squareup.com/docs/build-basics/working-with-dates)

      in which the order should be picked up after the `pickup_at` timestamp.

      The duration must be in RFC 3339 format (for example, "PT30M" for 30 minutes). Don''t confuse

      "M" for months with "M" for minutes. "P5M" means 5 months, while "PT5M" means 5 minutes.


      Can be used as an informational guideline for merchants.'
- target: $['components']['schemas']['FulfillmentPickupDetails']['properties']['prep_time_duration']
  update:
    description: 'The [duration](https://developer.squareup.com/docs/build-basics/working-with-dates)

      needed to prepare this fulfillment.

      The duration must be in RFC 3339 format (for example, "PT30M" for 30 minutes). Don''t confuse

      "M" for months with "M" for minutes. "P5M" means 5 months, while "PT5M" means 5 minutes.'
- target: $['components']['schemas']['FulfillmentType']['x-enum-elements']
  remove: true
- target: $['components']['schemas']['FulfillmentType']
  update:
    x-enum-elements:
    - name: PICKUP
      description: A recipient to pick up the fulfillment from a physical [location](entity:Location).
    - name: SHIPMENT
      description: A shipping carrier to ship the fulfillment.
    - name: DELIVERY
      description: A courier to deliver the fulfillment.
    - name: IN_STORE
      description: A customer to receive the fulfillment within the seller's physical [location](entity:Location).
