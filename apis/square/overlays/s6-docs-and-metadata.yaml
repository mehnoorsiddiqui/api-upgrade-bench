- target: $['paths']['/v2/catalog/batch-upsert']['post']
  update:
    description: 'Creates or updates up to 10,000 target objects based on the provided

      list of objects. The target objects are grouped into batches and each batch is

      inserted/updated in an all-or-nothing manner. If an object within a batch is

      malformed in some way, or violates a database constraint, the entire batch

      containing that item will be disregarded. However, other batches in the same

      request may still succeed. Each batch may contain up to 1,000 objects, and

      batches will be processed in order as long as the total object count for the

      request (items, variations, modifier lists, discounts, and taxes) is no more

      than 10,000.


      This endpoint uses full-replacement semantics. The client must send the complete object, and any

      field absent from the request is interpreted as an intentional clear. This logic applies to

      nested objects as well. For example, omitting inlined children like variations will delete them.


      To ensure consistency, only one update request is processed at a time per seller account.

      While one (batch or non-batch) update request is being processed, other (batched and non-batched)

      update requests are rejected with the `429` error code. Prefer batching related changes into a

      single call rather than issuing many small writes, since each write acquires the lock separately

      and parallel writes to the same seller will contend with each other, producing `429` errors.'
- target: $['paths']['/v2/catalog/list']['get']
  update:
    description: 'Returns a list of all [CatalogObject](entity:CatalogObject)s of the specified types in the catalog.


      The `types` parameter is specified as a comma-separated list of the [CatalogObjectType](entity:CatalogObjectType) values,

      for example, "`ITEM`, `ITEM_VARIATION`, `MODIFIER`, `MODIFIER_LIST`, `CATEGORY`, `DISCOUNT`, `TAX`, `IMAGE`".

      Always specify `types` explicitly. When upgrading to a newer API version, omitting `types` may

      cause new object types to appear in results that were not returned under the previous version.


      __Important:__ ListCatalog does not return deleted catalog items. To retrieve

      deleted catalog items, use [SearchCatalogObjects](api-endpoint:Catalog-SearchCatalogObjects)

      and set the `include_deleted_objects` attribute value to `true`.'
- target: $['paths']['/v2/catalog/object']['post']
  update:
    description: 'Creates a new or updates the specified [CatalogObject](entity:CatalogObject).


      This endpoint uses full-replacement semantics. The client must send the complete object, and any

      field absent from the request is interpreted as an intentional clear. This logic applies to

      nested objects as well. For example, omitting inlined children like variations will delete them.


      To ensure consistency, only one update request is processed at a time per seller account.

      While one (batch or non-batch) update request is being processed, other (batched and non-batched)

      update requests are rejected with the `429` error code.'
- target: $['paths']['/v2/catalog/search']['post']
  update:
    description: 'Searches for [CatalogObject](entity:CatalogObject) of any type by matching supported search attribute values,

      excluding custom attribute values on items or item variations, against one or more of the specified query filters.


      This (`SearchCatalogObjects`) endpoint differs from the [SearchCatalogItems](api-endpoint:Catalog-SearchCatalogItems)

      endpoint in the following aspects:


      - `SearchCatalogItems` can only search for items or item variations, whereas `SearchCatalogObjects` can search for any type of catalog objects.

      - `SearchCatalogItems` supports the custom attribute query filters to return items or item variations that contain custom attribute values, where `SearchCatalogObjects` does not.

      - `SearchCatalogItems` does not support the `include_deleted_objects` filter to search for deleted items or item variations, whereas `SearchCatalogObjects` does.

      - The both endpoints have different call conventions, including the query filter formats.


      The `object_types` parameter is specified as a list of [CatalogObjectType](entity:CatalogObjectType) values.

      Always specify `object_types` explicitly. When upgrading to a newer API version, omitting

      `object_types` may cause new object types to appear in results that were not returned under

      the previous version.'
- target: $['paths']['/v2/orders/search']['post']
  update:
    description: "Search all orders for one or more locations. Orders include all sales,\nreturns, and exchanges regardless of how or when they entered the Square\necosystem (such as Point of Sale, Invoices, and Connect APIs).\n\n`SearchOrders` requests need to specify which locations to search and define a\n[SearchOrdersQuery](entity:SearchOrdersQuery) object that controls\nhow to sort or filter the results. Your `SearchOrdersQuery` can:\n\n  Set filter criteria.\n  Set the sort order.\n  Determine whether to return results as complete `Order` objects or as\n[OrderEntry](entity:OrderEntry) objects.\n\nNote that details for orders processed with Square Point of Sale while in\noffline mode might not be transmitted to Square for up to 72 hours. Offline\norders have a `created_at` value that reflects the time the order was\ntransmitted to Square and created server-side, not the time the order was\ncreated on the Point of Sale device."
