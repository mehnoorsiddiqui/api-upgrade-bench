- target: $['components']['schemas']['Order']['properties']['source']
  update:
    description: 'The latest source details of the order.


      This field reflects the most recent source that interacted with or modified the order,

      and may change during the order lifecycle. For example:

      - An order created via API (source.name = "MyPOS") paid with Square Terminal may have

      source updated to reflect the Terminal application (which uses REGISTER, like POS)

      - An order updated or completed by a different application may have source updated

      to reflect that application.


      To preserve the original source from order creation regardless of subsequent updates,

      use the `creation_source` field instead.'
- target: $['components']['schemas']['OrderLineItem']['properties']['base_price_money']
  update:
    description: 'The base price for a single unit of the line item. Note - If inclusive tax is set on

      this item it will be included in this value.'
- target: $['components']['schemas']['OrderLineItem']['properties']['variation_total_price_money']
  update:
    description: 'The total price of all item variations sold in this line item.

      The price is calculated as `base_price_money` multiplied by `quantity`.

      It does not include modifiers. Note - If inclusive tax is set on

      this item it will be included in this value.'
- target: $['components']['schemas']['OrderReturnServiceCharge']['properties']['treatment_type']
  update:
    description: 'Indicates whether the service charge will be treated as a value-holding line item or apportioned toward a line item.

      See [OrderServiceChargeTreatmentType](#type-orderservicechargetreatmenttype) for possible values'
- target: $['components']['schemas']['OrderServiceCharge']['properties']['name']
  update:
    description: The name of the service charge. This is unused and null for AUTO_GRATUITY to match the behavior on Bills.
- target: $['components']['schemas']['OrderServiceCharge']['properties']['treatment_type']
  update:
    description: 'Indicates whether the service charge will be treated as a value-holding line item or apportioned toward a line item.

      See [OrderServiceChargeTreatmentType](#type-orderservicechargetreatmenttype) for possible values'
