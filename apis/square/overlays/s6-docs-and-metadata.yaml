      description: 'Provides the available balance on a Square gift card when a gift card payment fails due to insufficient funds.

        This error is returned with an `INSUFFICIENT_FUNDS` error and contains the balance in the smallest denomination

        of the applicable currency. [Learn more](https://developer.squareup.com/docs/payments-api/error-codes#gift_card_available_amount)

