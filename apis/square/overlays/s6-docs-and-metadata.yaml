- target: $['components']['schemas']['CatalogCategory']['properties']['parent_category']
  update:
    description: 'The parent category of this category instance. This includes the parent category ID and an ordinal

      value that determines the category''s relative position among sibling categories with the same parent.'
- target: $['components']['schemas']['CatalogItem']['properties']['categories']
  update:
    description: 'The list of categories to which this item belongs. Each entry includes the category ID and an ordinal

      value that determines the item''s relative position within that category.'
- target: $['components']['schemas']['CatalogItemModifierListInfo']['properties']['ordinal']
  update:
    description: 'The position of this `CatalogItemModifierListInfo` object within the `modifier_list_info` list applied

      to a `CatalogItem` instance.'
- target: $['components']['schemas']['CatalogItemVariation']['properties']['track_inventory']
  update:
    description: 'If `true`, inventory tracking is active for the variation at all locations by default.

      This value can be overridden for specific locations using `ItemVariationLocationOverrides.track_inventory`.

      If unset at both levels, inventory tracking is disabled.'
- target: $['components']['schemas']['CatalogItemVariation']['properties']['inventory_alert_type']
  update:
    description: 'Indicates whether the item variation displays an alert when its inventory quantity is less than or equal

      to its `inventory_alert_threshold`.


      Deprecated because this field has never been global.

      See [InventoryAlertType](#type-inventoryalerttype) for possible values'
- target: $['components']['schemas']['CatalogItemVariation']['properties']['inventory_alert_threshold']
  update:
    description: 'If the inventory quantity for the variation is less than or equal to this value and `inventory_alert_type`

      is `LOW_QUANTITY`, the variation displays an alert in the merchant dashboard. This value is always an integer.


      Deprecated because this field has never been global.'
- target: $['components']['schemas']['CatalogModifierList']['properties']['name']
  update:
    description: 'The name of the `CatalogModifierList` instance. This is a searchable attribute for use in applicable query filters, and its value length is of

      Unicode code points.'
- target: $['components']['schemas']['CatalogModifierList']['properties']['modifiers']
  update:
    description: 'A non-empty list of `CatalogModifier` objects to be included in the `CatalogModifierList`,

      for non text-based modifiers when the `modifier_type` attribute is `LIST`. Each element of this list

      is a `CatalogObject` instance of the `MODIFIER` type, containing the following attributes:

      ```

      {

      "id": "{{catalog_modifier_id}}",

      "type": "MODIFIER",

      "modifier_data": {{a CatalogModifier instance>}}

      }

      ```'
- target: $['components']['schemas']['CatalogModifierList']['properties']['modifier_type']
  update:
    description: 'The type of the modifier.


      When this `modifier_type` value is `TEXT`,  the `CatalogModifierList` represents a text-based modifier.

      When this `modifier_type` value is `LIST`, the `CatalogModifierList` contains a list of `CatalogModifier` objects.

      See [CatalogModifierListModifierType](#type-catalogmodifierlistmodifiertype) for possible values'
- target: $['components']['schemas']['CatalogModifierList']['properties']['max_length']
  update:
    description: 'The maximum length, in Unicode points, of the text string of the text-based modifier as represented by

      this `CatalogModifierList` object with the `modifier_type` set to `TEXT`.'
- target: $['components']['schemas']['CatalogModifierList']['properties']['internal_name']
  update:
    description: 'A note for internal use by the business.


      For example, for a text-based modifier applied to a T-shirt item, if the buyer-supplied text of "Hello, Kitty!"

      is to be printed on the T-shirt, this `internal_name` attribute can be "Use italic face" as

      an instruction for the business to follow.


      For non text-based modifiers, this `internal_name` attribute can be

      used to include SKUs, internal codes, or supplemental descriptions for internal use.'
- target: $['components']['schemas']['CatalogObject']['properties']['version']
  update:
    description: 'The version of the object. When updating an object, the version supplied should match

      the version in the database. If it does not, the server attempts a three-way merge. If the

      client''s changes and the concurrent changes don''t overlap, the merge succeeds silently. A

      `VERSION_MISMATCH` error is only returned when both sides changed the same field to different

      values.


      Use the same API version (`Square-Version` header) for both reading and writing catalog

      objects. The server uses the API version on a write request to determine which missing fields

      the client intentionally cleared versus which fields the client simply could not see at that

      version. If a client reads an object at an older API version and writes it back at a newer

      version, fields that were introduced between those two versions will be absent from the

      request, and the server will interpret that absence as an intentional clear.'
- target: $['components']['schemas']['CatalogObject']['properties']['present_at_all_locations']
  update:
    description: 'Controls whether this object is present at all locations, including future locations.


      Most object types have independent location control, including `TAX`, `DISCOUNT`, and

      `MODIFIER_LIST`.


      `ITEM` and `ITEM_VARIATION` have separate settings, but a variation can only be enabled

      at locations where its parent item is enabled. Disabling a variation everywhere is valid

      even when the parent item is enabled at specific locations.


      `MODIFIER` objects nested within a `MODIFIER_LIST` inherit location settings from their parent.

      Some object types, including `CATEGORY`, `IMAGE`, and `CUSTOM_ATTRIBUTE_DEFINITION`, must

      always be globally enabled and cannot use location-specific fields.


      The field operates in two modes. When true (the default), the object is available at

      all current and future locations except those in `absent_at_location_ids`. When false,

      the object is available only at locations in `present_at_location_ids`. The unused

      list in each mode is ignored.'
- target: $['components']['schemas']['CatalogObject']['properties']['present_at_location_ids']
  update:
    description: 'Locations where the object is present, used when `present_at_all_locations` is false.


      When `present_at_all_locations` is true, this field is ignored since the object is

      already present everywhere. Can include deactivated locations. Empty strings are rejected.'
- target: $['components']['schemas']['CatalogObject']['properties']['absent_at_location_ids']
  update:
    description: 'Locations where the object is not present, used when `present_at_all_locations` is true.


      When `present_at_all_locations` is false, this field is ignored since the object is

      already absent everywhere except those in `present_at_location_ids`. Can include

      deactivated locations. Empty strings are rejected.'
- target: $['components']['schemas']['CatalogObjectCategory']['properties']['ordinal']
  update:
    description: 'The position of this object within the specified category. When an item is assigned to a category,

      the ordinal determines the item''s position relative to other items in the same category. When used for a

      parent category reference, the ordinal determines the category''s position among its sibling categories.'
- target: $['components']['schemas']['CatalogProductSet']['properties']['product_ids_any']
  update:
    description: ' Unique IDs for any `CatalogObject` included in this product set. Any

      number of these catalog objects can be in an order for a pricing rule to apply.


      This can be used with `product_ids_all` in a parent `CatalogProductSet` to

      match groups of products for a bulk discount, such as a discount for an

      entree and side combo.


      Only one of `product_ids_all`, `product_ids_any`, or `all_products` can be set.


      Max: 5000 catalog object IDs.'
- target: $['components']['schemas']['CatalogProductSet']['properties']['product_ids_all']
  update:
    description: 'Unique IDs for any `CatalogObject` included in this product set.

      All objects in this set must be included in an order for a pricing rule to apply.


      Only one of `product_ids_all`, `product_ids_any`, or `all_products` can be set.


      Max: 5000 catalog object IDs.'
- target: $['components']['schemas']['CreatePaymentRequest']['properties']['tip_money']
  update:
    description: 'The amount designated as a tip, in addition to `amount_money`.


      The amount must be specified in the smallest denomination of the applicable currency

      (for example, US dollar amounts are specified in cents). For more information, see

      [Working with Monetary Amounts](https://developer.squareup.com/docs/build-basics/working-with-monetary-amounts).


      Tips for external vendors such as a 3rd party delivery courier must be recorded using Order.service_charges.


      The currency code must match the currency associated with the business

      that is accepting the payment.'
- target: $['components']['schemas']['DigitalWalletDetails']['properties']['brand']
  update:
    description: 'The brand used for the `WALLET` payment. The brand can be `CASH_APP`, `PAYPAY`, `ALIPAY`,

      `RAKUTEN_PAY`, `AU_PAY`, `D_BARAI`, `MERPAY`, `WECHAT_PAY`, `LIGHTNING` or `UNKNOWN`.'
