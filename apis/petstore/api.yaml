# yaml-language-server: $schema=../../schemas/api.schema.json
name: petstore
# Bench-only SDK package and plugin: every version, the base included, is published by the bench
# with the same generator, so the diff between two versions is only the overlays.
#
# From `apimatic publishing profile list`: the profile that publishes ApimaticBench.Petstore to
# NuGet and the source to bench-petstore-sdk-csharp.
profile_id: 6afad0c52f09fd9183fc6fb5
nuget_package_id: ApimaticBench.Petstore
sdk_repo: mehnoorsiddiqui/bench-petstore-sdk-csharp
plugin_repo: mehnoorsiddiqui/bench-petstore-context-plugin
plugin_id: bench-petstore
plugin_name: Bench Petstore
